<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>摸鱼海湾 - Idle Cove</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10293a;
      --panel: rgba(20, 36, 42, 0.82);
      --cream: #ffe9b7;
      --ink: #17313b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(88, 207, 220, 0.16), transparent 32%),
        linear-gradient(180deg, #0d2330 0%, #081924 100%);
      color: var(--cream);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      touch-action: none;
    }

    #shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    #gameWrap {
      position: relative;
      width: min(calc(100vw - 20px), calc((100vh - 20px) * 0.5625));
      max-width: 460px;
      aspect-ratio: 9 / 16;
      border: 4px solid #31505d;
      border-radius: 14px;
      overflow: hidden;
      background: #10293a;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: pointer;
    }

    #error {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(320px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 2px solid rgba(255, 221, 152, 0.65);
      border-radius: 10px;
      background: var(--panel);
      color: var(--cream);
      text-align: center;
      font-weight: 700;
      display: none;
      z-index: 10;
    }

    @media (min-width: 900px) {
      #shell {
        padding: 24px;
      }

      #gameWrap {
        width: min(520px, calc((100vh - 48px) * 0.5625));
        max-width: 520px;
        border-width: 5px;
        border-radius: 18px;
      }
    }

    @media (max-width: 430px) {
      #shell {
        padding: 0;
      }

      #gameWrap {
        width: min(100vw, calc(100vh * 0.5625));
        max-width: none;
        border-width: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main id="shell" aria-label="摸鱼海湾游戏区域">
    <div id="gameWrap">
      <canvas id="gameCanvas" width="360" height="640"></canvas>
    </div>
  </main>
  <div id="error">哎呀，出错了，请重启试试吧~</div>

  <script>
  (() => {
    'use strict';

    // ==============================
    // Config
    // ==============================
    const CONFIG = {
      width: 360,
      height: 640,
      roundTime: 45,
      targetScore: 650,
      level: 1,
      uiHeight: 70,
      pierTop: 70,
      pierBottom: 130,
      waterTop: 130,
      waterBottom: 610,
      seaFloorTop: 610,
      hook: {
        originX: 180,
        originY: 120,
        minAngle: -80,
        maxAngle: 80,
        swingSpeed: 52,
        speedOut: 560,
        speedBackBase: 430,
        grabbedReturnMultiplier: 0.7,
        maxLength: 520,
        radius: 8
      },
      spawnArea: {
        xMin: 30,
        xMax: 330,
        yMin: 180,
        yMax: 580
      },
      targetTypes: {
        stickyFish: {
          id: 'stickyFish',
          label: '便签小鱼',

          moving: true,

        },
        coffeeJelly: {

        },
        mysteryFish: {
          id: 'mysteryFish',

          score: 420,
          mass: 4.4,

      }
    };

    const DIFFICULTY = {
      low: { label: '低', ratioOffset: -0.15 },
      medium: { label: '中', ratioOffset: 0 },
      high: { label: '高', ratioOffset: 0.15 }
    };

    const LEVELS = [
      { id: 1, name: '便签浅湾', type: 'standard', duration: 45, availableScore: 1180, baseTargetRatio: 0.55, maxActiveTargets: 16, counts: { stickyFish: 8, lunchFish: 3, emptyBottle: 4, coffeeJelly: 2, driftChest: 1 } },
      { id: 2, name: '大鱼海沟', type: 'bigFish', duration: 45, availableScore: 1450, baseTargetRatio: 0.59, maxActiveTargets: 16, counts: { stickyFish: 5, lunchFish: 5, glowFish: 2, emptyBottle: 3, coffeeJelly: 2, driftChest: 1 } },
      { id: 3, name: '漂流箱潮', type: 'chest', duration: 30, availableScore: 1900, baseTargetRatio: 0.58, maxActiveTargets: 16, counts: { stickyFish: 6, lunchFish: 3, emptyBottle: 4, coffeeJelly: 3, driftChest: { min: 0, max: 5 } } },
      { id: 4, name: '珍珠浅滩', type: 'pearl', duration: 60, availableScore: 1300, baseTargetRatio: 0.54, maxActiveTargets: 16, counts: { stickyFish: 5, lunchFish: 2, smallPearl: 5, bigPearl: 2, coffeeJelly: 2, driftChest: 1 } },
      { id: 5, name: '水母夜港', type: 'jelly', duration: 45, availableScore: 1550, baseTargetRatio: 0.61, maxActiveTargets: 17, counts: { stickyFish: 5, lunchFish: 3, glowFish: 1, emptyBottle: 3, coffeeJelly: 4, electricJelly: 2, driftChest: 1 } },
      { id: 6, name: '急潮通勤', type: 'rush', duration: 30, availableScore: 1500, baseTargetRatio: 0.63, maxActiveTargets: 18, movingSpeedMultiplier: 1.35, counts: { stickyFish: 7, lunchFish: 4, glowFish: 1, smallPearl: 3, coffeeJelly: 2, driftChest: 1, emptyBottle: 3 } }
    ];

    const BONUS_ENDLESS_SCENE = {
      id: 7,
      name: '星砂新港',
      type: 'bonus',
      duration: 60,
      availableScore: 1600,
      baseTargetRatio: 0.58,
      maxActiveTargets: 17,
      counts: { stickyFish: 5, lunchFish: 4, glowFish: 2, smallPearl: 3, bigPearl: 1, messageBottle: 2, driftChest: 1, mysteryFish: 1 }
    };

    const ENDLESS_SCENE_CHOICES = [
      { id: 'world', name: '世界潮汐', world: true },
      ...LEVELS,
      BONUS_ENDLESS_SCENE
    ];

    const CHEST_LOOT_TABLE = [
      { id: 'silverCoin', label: '银币', scoreMin: 60, scoreMax: 180, chance: 0.55 },
      { id: 'goldCoin', label: '金币', scoreMin: 120, scoreMax: 360, chance: 0.25 },
      { id: 'tideCoinBag', label: '潮汐硬币袋', scoreMin: 0, scoreMax: 90, chance: 0.15 },
      { id: 'emptyShell', label: '空贝壳', scoreMin: 30, scoreMax: 30, chance: 0.05 }
    ];

    const ENDLESS_MODE = {
      durationOptions: [30, 60, 120],
      maxActiveTargets: 16,
      respawnDelay: { min: 0.5, max: 1.5 },
      maxActiveByType: { driftChest: 1, coffeeJelly: 2, mysteryFish: 1 },
      spawnWeights: {
        stickyFish: 32,
        lunchFish: 18,
        glowFish: 6,
        smallPearl: 12,
        bigPearl: 5,
        emptyBottle: 12,
        messageBottle: 4,
        coffeeJelly: 8,
        driftChest: 3,
        mysteryFish: 1
      }
    };

    const COMPETITIVE_MODE = {
      duration: 45,
      availableScore: 1800,
      baseTargetRatio: 0.58,
      maxActiveTargets: 18,
      respawnDelay: { min: 0.25, max: 0.9 },
      maxActiveByType: { driftChest: 2, coffeeJelly: 3, electricJelly: 1, mysteryFish: 1 },
      spawnWeights: {
        stickyFish: 24,
        lunchFish: 20,
        glowFish: 10,
        smallPearl: 8,
        bigPearl: 5,
        emptyBottle: 8,
        coffeeJelly: 10,
        electricJelly: 4,
        driftChest: 7,
        mysteryFish: 1
      }
    };

    const LEVEL_RESPAWN = {
      respawnDelay: { min: 0.45, max: 1.2 },
      maxActiveByType: { driftChest: 2, coffeeJelly: 3, electricJelly: 2, mysteryFish: 1 }
    };

    const LETTERS = [
      '海底小镇：今天的潮水也准时下班了吗？',
      '潮汐事务所：文件还在上传，先摸一条鱼。',
      '未知客户：请假装需求已经改完了。',
      '阿星便签：等 AI 的时候，海也在转圈。'
    ];

    const USERNAME_PRESETS = ['阿星', '潮汐打工人', '码头摸鱼员', '白浪岛住民'];

    const STATE = {
      MENU: 'MENU',
      AIMING: 'AIMING',
      FIRING: 'FIRING',
      RETURNING: 'RETURNING',
      RESULT: 'RESULT',
      PROFILE: 'PROFILE',
      INFO: 'INFO',
      GALLERY: 'GALLERY',
      LETTERS: 'LETTERS'
    };

    // ==============================
    // Canvas setup
    // ==============================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const errorBox = document.getElementById('error');
    ctx.imageSmoothingEnabled = false;

    // ==============================
    // Utilities
    // ==============================
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const lerp = (a, b, t) => a + (b - a) * t;
    const degToRad = deg => (deg + 90) * Math.PI / 180;
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }

    function pickWeighted(weights) {
      const entries = Object.entries(weights);
      const total = entries.reduce((sum, entry) => sum + entry[1], 0);
      let roll = Math.random() * total;
      for (const [type, weight] of entries) {
        roll -= weight;
        if (roll <= 0) return type;
      }
      return entries[0][0];
    }

    function pickChestLoot() {
      let roll = Math.random();
      for (const loot of CHEST_LOOT_TABLE) {
        roll -= loot.chance;
        if (roll <= 0) {
          return {
            label: loot.label,
            score: randInt(loot.scoreMin, loot.scoreMax)
          };
        }
      }
      const fallback = CHEST_LOOT_TABLE[CHEST_LOOT_TABLE.length - 1];
      return { label: fallback.label, score: fallback.scoreMin };
    }

    function calculateTargetScore(level) {
      const difficulty = DIFFICULTY[game.difficulty] || DIFFICULTY.medium;
      const ratio = clamp(level.baseTargetRatio + difficulty.ratioOffset, 0.4, 0.75);
      return Math.floor(level.availableScore * ratio);
    }

    function getCompetitiveTargetScore() {
      return calculateTargetScore(game.currentLevel || LEVELS[0]);
    }

    function getLevelSpawnWeights(level) {
      const weights = {};
      const counts = level && level.counts ? level.counts : {};
      for (const [type, countConfig] of Object.entries(counts)) {
        const count = typeof countConfig === 'number'
          ? countConfig
          : Math.max(countConfig.min || 0, Math.ceil(((countConfig.min || 0) + (countConfig.max || 0)) / 2));
        weights[type] = Math.max(1, count) * (CONFIG.targetTypes[type] && CONFIG.targetTypes[type].moving ? 6 : 3);
      }
      return Object.keys(weights).length ? weights : COMPETITIVE_MODE.spawnWeights;
    }

    function getRandomEndlessScene(excludeName = '') {
      const scenes = ENDLESS_SCENE_CHOICES.filter(scene => !scene.world && scene.name !== excludeName);
      return scenes[randInt(0, scenes.length - 1)];
    }

    function getSelectedEndlessScene() {
      const choice = ENDLESS_SCENE_CHOICES[game.endlessSceneIndex] || ENDLESS_SCENE_CHOICES[0];
      return choice.world ? getRandomEndlessScene(game.currentLevel && game.currentLevel.name) : choice;
    }

    function changeEndlessScene(step) {
      game.endlessSceneIndex = (game.endlessSceneIndex + step + ENDLESS_SCENE_CHOICES.length) % ENDLESS_SCENE_CHOICES.length;
    }

    function getMassFromScoreAndSize(score, radius) {
      const scoreFactor = clamp(Math.max(0, score) / 150, 0, 1.5);
      const sizeFactor = clamp((radius - 16) / 14, 0, 1.4);
      return Number((0.8 + scoreFactor * 0.8 + sizeFactor * 0.7).toFixed(2));
    }

    function safeLocalStorageGet(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : value;
      } catch (_err) {
        return fallback;
      }
    }

    function safeLocalStorageSet(key, value) {
      try {
        localStorage.setItem(key, String(value));
      } catch (_err) {
        // Highest score is optional; ignore storage failures.
      }
    }

    function safeJsonStorageGet(key, fallback) {
      try {
        return JSON.parse(safeLocalStorageGet(key, JSON.stringify(fallback)));
      } catch (_err) {
        return fallback;
      }
    }

    function getBestOverallScore() {
      return Math.max(game.bestEndlessScore, game.bestCompetitiveScore, game.highScore);
    }

    function getPointerPos(event) {
      const rect = canvas.getBoundingClientRect();
      const touch = event.touches && event.touches[0] ? event.touches[0] : event;
      return {
        x: (touch.clientX - rect.left) * CONFIG.width / rect.width,
        y: (touch.clientY - rect.top) * CONFIG.height / rect.height
      };
    }

    // ==============================
    // Game state
    // ==============================
    const game = {
      state: STATE.MENU,
      mode: 'endless',
      selectedMode: 'endless',
      difficulty: 'medium',
      endlessDuration: 60,
      endlessSceneIndex: 0,
      worldSceneTimer: 0,
      username: safeLocalStorageGet('idleCoveUsername', '阿星'),
      score: 0,
      levelScore: 0,
      runScore: 0,
      highScore: Number(safeLocalStorageGet('idleCoveHighScore', 0)) || 0,
      bestEndlessScore: Number(safeLocalStorageGet('idleCoveBestEndlessScore', 0)) || 0,
      bestCompetitiveScore: Number(safeLocalStorageGet('idleCoveBestCompetitiveScore', 0)) || 0,
      targetScore: CONFIG.targetScore,
      timer: CONFIG.roundTime,
      level: CONFIG.level,
      levelIndex: 0,
      currentLevel: { id: 0, name: '休闲摸鱼', type: 'endless', duration: 60 },
      resultSuccess: false,
      runComplete: false,
      newRecord: false,
      lastDiscovery: '',
      unlockedCards: safeJsonStorageGet('idleCoveCards', {}),
      unlockedLetters: safeJsonStorageGet('idleCoveLetters', []),
      respawnQueue: [],
      lastTime: 0,
      running: true,
      bubbles: [],
      sparkles: [],
      floatTexts: [],
      resultButtons: {
        start: { x: 92, y: 536, w: 176, h: 44 },
        retry: { x: 40, y: 456, w: 130, h: 42 },
        menu: { x: 190, y: 456, w: 130, h: 42 },
        failMenu: { x: 92, y: 456, w: 176, h: 42 },
        next: { x: 92, y: 414, w: 176, h: 42 },
        modeEndless: { x: 48, y: 292, w: 120, h: 36 },
        modeCompetitive: { x: 192, y: 292, w: 120, h: 36 },
        diffLow: { x: 54, y: 372, w: 72, h: 30 },
        diffMedium: { x: 144, y: 372, w: 72, h: 30 },
        diffHigh: { x: 234, y: 372, w: 72, h: 30 },
        endless30: { x: 28, y: 380, w: 64, h: 30 },
        endless60: { x: 108, y: 380, w: 64, h: 30 },
        endless120: { x: 188, y: 380, w: 64, h: 30 },
        endlessInfinite: { x: 268, y: 380, w: 64, h: 30 },
        scenePrev: { x: 42, y: 450, w: 36, h: 30 },
        sceneName: { x: 88, y: 450, w: 184, h: 30 },
        sceneNext: { x: 282, y: 450, w: 36, h: 30 },
        profile: { x: 22, y: 92, w: 82, h: 30 },
        info: { x: 256, y: 92, w: 82, h: 30 },
        gallery: { x: 44, y: 494, w: 122, h: 34 },
        letters: { x: 194, y: 494, w: 122, h: 34 },
        rename: { x: 100, y: 292, w: 160, h: 34 },
        back: { x: 92, y: 560, w: 176, h: 38 },
        endRun: { x: 302, y: 10, w: 48, h: 28 },
        runMenu: { x: 302, y: 42, w: 48, h: 22 }
      }
    };

    // ==============================
    // Hook logic
    // ==============================
    const hook = {
      originX: CONFIG.hook.originX,
      originY: CONFIG.hook.originY,
      angle: 0,
      swingDirection: 1,
      length: 44,
      grabbedTarget: null,

      reset() {
        this.length = 44;
        this.grabbedTarget = null;
      },

      headPosition() {
        const rad = degToRad(this.angle);
        return {
          x: this.originX + Math.cos(rad) * this.length,
          y: this.originY + Math.sin(rad) * this.length
        };
      },

      updateSwing(dt) {
        this.angle += this.swingDirection * CONFIG.hook.swingSpeed * dt;
        if (this.angle >= CONFIG.hook.maxAngle) {
          this.angle = CONFIG.hook.maxAngle;
          this.swingDirection = -1;
        } else if (this.angle <= CONFIG.hook.minAngle) {
          this.angle = CONFIG.hook.minAngle;
          this.swingDirection = 1;
        }
      },

      fire() {
        if (game.state !== STATE.AIMING) return;
        game.state = STATE.FIRING;
        playTone(360, 0.05, 0.035);
      },

      extend(dt) {
        this.length += CONFIG.hook.speedOut * dt;
      },

      retract(dt) {
        const mass = this.grabbedTarget ? this.grabbedTarget.mass : 1;
        const returnMultiplier = this.grabbedTarget ? CONFIG.hook.grabbedReturnMultiplier : 1;
        const returnSpeed = (CONFIG.hook.speedBackBase / mass) * returnMultiplier;
        this.length -= returnSpeed * dt;
        if (this.grabbedTarget) {
          const p = this.headPosition();
          this.grabbedTarget.x = p.x;
          this.grabbedTarget.y = p.y;
        }
      },

      shouldReturn() {
        const p = this.headPosition();
        return this.length >= CONFIG.hook.maxLength ||
          p.x < -10 || p.x > CONFIG.width + 10 ||
          p.y < -10 || p.y > CONFIG.height + 10;
      },

      isBack() {
        return this.length <= 44;
      },

      attach(target) {
        this.grabbedTarget = target;
        target.grabbed = true;
        game.state = STATE.RETURNING;
        playTone(target.dangerous ? 170 : 520, 0.08, target.dangerous ? 0.045 : 0.055);
      }
    };

    // ==============================
    // Target logic
    // ==============================
    let targets = [];

    function createTarget(type, x, y, options = {}) {
      const cfg = CONFIG.targetTypes[type];
      const mass = cfg.mass || getMassFromScoreAndSize(cfg.score, cfg.radius);
      const level = game.currentLevel || { type: 'endless' };
      const speedMultiplier = game.mode === 'competitive' && cfg.moving
        ? (game.difficulty === 'high' ? 1.35 : game.difficulty === 'low' ? 0.9 : 1.15)
        : (level.type === 'rush' && cfg.moving ? (level.movingSpeedMultiplier || 1) : 1);
      const direction = options.direction || (Math.random() > 0.5 ? 1 : -1);
      return {
        type,
        label: cfg.label,
        x,
        y,
        baseY: y,
        score: cfg.score,
        timePenalty: cfg.timePenalty || 0,
        mass,
        radius: cfg.radius,
        moving: cfg.moving,
        dangerous: cfg.dangerous,
        color: cfg.color,
        accent: cfg.accent,
        phase: rand(0, Math.PI * 2),
        speed: rand(12, 26) * speedMultiplier * direction,
        bob: rand(3, 9),
        grabbed: false,
        entering: Boolean(options.entering)
      };
    }

    function updateTargets(dt) {
      for (const target of targets) {
        if (target.grabbed || !target.moving) continue;
        target.phase += dt * 1.8;
        target.x += target.speed * dt;
        target.y = target.baseY + Math.sin(target.phase) * target.bob;
        if (target.entering) {
          const leftReady = target.speed > 0 && target.x >= CONFIG.spawnArea.xMin + target.radius;
          const rightReady = target.speed < 0 && target.x <= CONFIG.spawnArea.xMax - target.radius;
          if (leftReady || rightReady) target.entering = false;
          continue;
        }
        if (target.x < CONFIG.spawnArea.xMin + target.radius) {
          target.x = CONFIG.spawnArea.xMin + target.radius;
          target.speed *= -1;
        }
        if (target.x > CONFIG.spawnArea.xMax - target.radius) {
          target.x = CONFIG.spawnArea.xMax - target.radius;
          target.speed *= -1;
        }
      }
    }

    // ==============================
    // Target spawning
    // ==============================
    function countForConfig(value) {
      if (typeof value === 'number') return value;
      if (value && typeof value === 'object') return randInt(value.min || 0, value.max || 0);
      return 0;
    }

    function placeTarget(type, options = {}) {
      const cfg = CONFIG.targetTypes[type];
      if (!cfg) return false;
      if (options.fromSide && cfg.moving) {
        const fromLeft = Math.random() > 0.5;
        const x = fromLeft
          ? CONFIG.spawnArea.xMin - cfg.radius - rand(8, 42)
          : CONFIG.spawnArea.xMax + cfg.radius + rand(8, 42);
        const y = rand(CONFIG.spawnArea.yMin + cfg.radius, CONFIG.spawnArea.yMax - cfg.radius);
        targets.push(createTarget(type, x, y, {
          entering: true,
          direction: fromLeft ? 1 : -1
        }));
        return true;
      }
      for (let attempts = 0; attempts < 80; attempts++) {
        const x = rand(CONFIG.spawnArea.xMin + cfg.radius, CONFIG.spawnArea.xMax - cfg.radius);
        const y = rand(CONFIG.spawnArea.yMin + cfg.radius, CONFIG.spawnArea.yMax - cfg.radius);
        const candidate = { x, y, radius: cfg.radius };
        const overlaps = targets.some(t => distance(candidate, t) < candidate.radius + t.radius + 8);
        if (!overlaps) {
          targets.push(createTarget(type, x, y));
          return true;
        }
      }
      targets.push(createTarget(type, rand(50, 310), rand(200, 570)));
      return true;
    }

    function spawnTargets() {
      targets = [];
      if (game.mode === 'endless') {
        const counts = game.currentLevel && game.currentLevel.counts ? game.currentLevel.counts : null;
        if (counts) {
          for (const type of Object.keys(counts)) {
            const count = countForConfig(counts[type]);
            for (let i = 0; i < count; i++) {
              placeTarget(type);
            }
          }
        } else {
          for (let i = 0; i < ENDLESS_MODE.maxActiveTargets; i++) {
            spawnEndlessTarget(false);
          }
        }
        return;
      }
      if (game.mode === 'competitive') {
        const counts = game.currentLevel ? game.currentLevel.counts : {};
        if (Object.keys(counts).length) {
          for (const type of Object.keys(counts)) {
            const count = countForConfig(counts[type]);
            for (let i = 0; i < count; i++) {
              placeTarget(type);
            }
          }
        } else {
          for (let i = 0; i < COMPETITIVE_MODE.maxActiveTargets; i++) {
            spawnCompetitiveTarget(false);
          }
        }
        return;
      }
      const counts = game.currentLevel ? game.currentLevel.counts : {};
      for (const type of Object.keys(counts)) {
        const count = countForConfig(counts[type]);
        for (let i = 0; i < count; i++) {
          placeTarget(type);
        }
      }
    }

    function spawnEndlessTarget(fromSide = false) {
      const level = game.currentLevel || {};
      const weights = level.counts ? getLevelSpawnWeights(level) : ENDLESS_MODE.spawnWeights;
      for (let attempts = 0; attempts < 30; attempts++) {
        const type = pickWeighted(weights);
        const maxActive = ENDLESS_MODE.maxActiveByType[type];
        if (maxActive && targets.filter(target => !target.grabbed && target.type === type).length >= maxActive) continue;
        placeTarget(type, { fromSide });
        return;
      }
      placeTarget('stickyFish', { fromSide });
    }

    function spawnCompetitiveTarget(fromSide = false) {
      const level = game.currentLevel || {};
      const weights = level.counts ? getLevelSpawnWeights(level) : COMPETITIVE_MODE.spawnWeights;
      const maxActiveByType = { ...COMPETITIVE_MODE.maxActiveByType, ...LEVEL_RESPAWN.maxActiveByType };
      for (let attempts = 0; attempts < 30; attempts++) {
        const type = pickWeighted(weights);
        const maxActive = maxActiveByType[type];
        if (maxActive && targets.filter(target => !target.grabbed && target.type === type).length >= maxActive) continue;
        placeTarget(type, { fromSide });
        return;
      }
      placeTarget('lunchFish', { fromSide });
    }

    function scheduleEndlessRespawn() {
      if (game.mode === 'endless') {
        game.respawnQueue.push(rand(ENDLESS_MODE.respawnDelay.min, ENDLESS_MODE.respawnDelay.max));
      } else if (game.mode === 'competitive') {
        const delay = (game.currentLevel && game.currentLevel.counts) ? LEVEL_RESPAWN.respawnDelay : COMPETITIVE_MODE.respawnDelay;
        game.respawnQueue.push(rand(delay.min, delay.max));
      }
    }

    function updateEndlessRespawns(dt) {
      if (game.mode !== 'endless' && game.mode !== 'competitive') return;
      const modeConfig = game.mode === 'endless'
        ? (game.currentLevel && game.currentLevel.maxActiveTargets ? game.currentLevel : ENDLESS_MODE)
        : (game.currentLevel || COMPETITIVE_MODE);
      for (let i = game.respawnQueue.length - 1; i >= 0; i--) {
        game.respawnQueue[i] -= dt;
        if (game.respawnQueue[i] <= 0 && targets.length < modeConfig.maxActiveTargets) {
          if (game.mode === 'endless') spawnEndlessTarget(true);
          else spawnCompetitiveTarget(true);
          game.respawnQueue.splice(i, 1);
        }
      }
    }

    function updateWorldScene(dt) {
      if (!isPlayingState() || game.mode !== 'endless') return;
      const choice = ENDLESS_SCENE_CHOICES[game.endlessSceneIndex];
      if (!choice || !choice.world) return;
      game.worldSceneTimer -= dt;
      if (game.worldSceneTimer > 0) return;
      const nextScene = getRandomEndlessScene(game.currentLevel && game.currentLevel.name);
      game.currentLevel = { ...nextScene, duration: game.endlessDuration };
      game.worldSceneTimer = rand(16, 24);
      spawnFloatText(nextScene.name, 180, 126, '#fff0a6');
      spawnSparkle(180, 150, '#c8fff5', 18);
    }

    // ==============================
    // Collision
    // ==============================
    function checkHookCollision() {
      const head = hook.headPosition();
      for (const target of targets) {
        if (target.grabbed) continue;
        if (distance(head, target) < CONFIG.hook.radius + target.radius) {
          return target;
        }
      }
      return null;
    }

    // ==============================
    // Score and timer
    // ==============================
    function unlockCard(target) {
      const cardId = target.type;
      const existing = game.unlockedCards[cardId];
      game.unlockedCards[cardId] = {
        id: cardId,
        name: target.label,
        caughtCount: existing ? existing.caughtCount + 1 : 1,
        bestScore: Math.max(existing ? existing.bestScore || 0 : 0, Math.max(0, target.score || 0))
      };
      safeLocalStorageSet('idleCoveCards', JSON.stringify(game.unlockedCards));
      if (!existing) {
        game.lastDiscovery = `新卡片：${target.label}`;
        spawnFloatText(game.lastDiscovery, target.x, target.y - target.radius - 12, '#c8fff5');
      }
    }

    function collectTarget(target) {
      let score = target.score;
      let label = target.label;
      let letter = '';
      if (target.type === 'driftChest') {
        const loot = pickChestLoot();
        score = loot.score;
        label = loot.label;
      } else if (target.type === 'messageBottle') {
        letter = LETTERS[randInt(0, LETTERS.length - 1)];
        game.lastDiscovery = letter;
        if (!game.unlockedLetters.includes(letter)) {
          game.unlockedLetters.push(letter);
          safeLocalStorageSet('idleCoveLetters', JSON.stringify(game.unlockedLetters));
        }
        spawnFloatText('摸到一封信', target.x, target.y - target.radius - 12, '#fff0a6');
      } else if (target.type === 'mysteryFish') {
        score = randInt(300, 520);
      }
      target.score = score;
      game.score += score;
      game.levelScore += score;
      game.runScore += score;
      if (target.timePenalty) {
        game.timer = Math.max(0, game.timer - target.timePenalty);
      }
      unlockCard(target);
      const sign = score >= 0 ? '+' : '';
      const message = target.dangerous
        ? `${target.label} ${sign}${score}`
        : target.type === 'emptyBottle'
          ? `空瓶一只 ${sign}${score}`
          : target.type === 'driftChest'
            ? `${label} ${sign}${score}`
            : target.type === 'messageBottle'
              ? `漂流信件 ${sign}${score}`
              : target.type === 'mysteryFish'
                ? `神秘大鱼 ${sign}${score}`
                : `${sign}${score}`;
      spawnFloatText(message, target.x, target.y - target.radius, target.dangerous ? '#ff95b2' : '#fff0a6');
      if (target.type === 'driftChest' || target.type === 'lunchFish' || target.type === 'glowFish' || target.type === 'mysteryFish') {
        spawnSparkle(target.x, target.y, target.color, 18);
      } else if (target.dangerous || target.type === 'emptyBottle') {
        spawnSparkle(target.x, target.y, '#ff89a9', 10);
      }
      playTone(score < 0 ? 120 : (score >= 150 ? 740 : 560), 0.1, score < 0 ? 0.04 : 0.055);
    }

    function finishRound() {
      game.resultSuccess = game.mode === 'endless' || game.levelScore >= game.targetScore;
      game.state = STATE.RESULT;
      game.runComplete = true;
      game.newRecord = false;
      if (game.mode === 'endless') {
        if (game.score > game.bestEndlessScore) {
          game.bestEndlessScore = game.score;
          game.newRecord = true;
          safeLocalStorageSet('idleCoveBestEndlessScore', game.bestEndlessScore);
        }
      } else if (game.mode === 'competitive') {
        if (game.score > game.bestCompetitiveScore) {
          game.bestCompetitiveScore = game.score;
          game.newRecord = true;
          safeLocalStorageSet('idleCoveBestCompetitiveScore', game.bestCompetitiveScore);
        }
      } else if (game.runComplete && game.runScore > game.highScore) {
        game.highScore = game.runScore;
        game.newRecord = true;
        safeLocalStorageSet('idleCoveHighScore', game.highScore);
      }
      playTone(game.resultSuccess ? 660 : 220, 0.18, 0.05);
      if (game.mode === 'competitive' && !game.resultSuccess) {
        game.state = STATE.MENU;
        hook.reset();
        game.respawnQueue = [];
        spawnTargets();
      }
    }

    // ==============================
    // Feedback
    // ==============================
    let audioContext = null;

    function ensureAudio() {
      if (audioContext) return audioContext;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      audioContext = new AudioCtor();
      return audioContext;
    }

    function playTone(freq, duration, volume) {
      try {
        const ac = ensureAudio();
        if (!ac) return;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + duration);
      } catch (_err) {
        // Audio feedback is optional.
      }
    }

    function spawnFloatText(text, x, y, color) {
      game.floatTexts.push({ text, x, y, color, life: 0.9, maxLife: 0.9 });
    }

    function spawnSparkle(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        game.sparkles.push({
          x,
          y,
          vx: rand(-70, 70),
          vy: rand(-95, 30),
          color,
          life: rand(0.35, 0.72),
          size: rand(2, 5)
        });
      }
    }

    function updateFeedback(dt) {
      game.floatTexts = game.floatTexts.filter(item => {
        item.y -= 38 * dt;
        item.life -= dt;
        return item.life > 0;
      });
      game.sparkles = game.sparkles.filter(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 160 * dt;
        p.life -= dt;
        return p.life > 0;
      });
      for (const bubble of game.bubbles) {
        bubble.y -= bubble.speed * dt;
        bubble.x += Math.sin((bubble.y + bubble.phase) * 0.03) * dt * 16;
        if (bubble.y < CONFIG.waterTop - 20) {
          bubble.y = rand(CONFIG.waterBottom, CONFIG.height + 40);
          bubble.x = rand(18, CONFIG.width - 18);
        }
      }
    }

    function createBubbles() {
      game.bubbles = [];
      for (let i = 0; i < 38; i++) {
        game.bubbles.push({
          x: rand(16, CONFIG.width - 16),
          y: rand(CONFIG.waterTop, CONFIG.height + 60),
          r: rand(1.5, 4.2),
          speed: rand(8, 26),
          phase: rand(0, 200)
        });
      }
    }

    // ==============================
    // UI
    // ==============================
    function isPlayingState() {
      return game.state === STATE.AIMING || game.state === STATE.FIRING || game.state === STATE.RETURNING;
    }

    function buttonHit(pos, button) {
      return pos.x >= button.x && pos.x <= button.x + button.w &&
        pos.y >= button.y && pos.y <= button.y + button.h;
    }

    function drawPixelText(text, x, y, size, color, align = 'left') {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `700 ${size}px "Microsoft YaHei", Arial, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(5, 20, 24, 0.6)';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawButton(button, label, primary = true, selected = false) {
      ctx.save();
      ctx.fillStyle = selected ? '#d2ffc2' : (primary ? '#ffd36b' : '#7fd7e9');
      ctx.strokeStyle = selected ? '#fff0a6' : '#17313b';
      ctx.lineWidth = 4;
      roundRect(button.x, button.y, button.w, button.h, 8, true, true);
      ctx.fillStyle = primary ? '#17313b' : '#17313b';
      const size = button.w < 130 ? 15 : 20;
      ctx.font = `700 ${size}px "Microsoft YaHei", Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, button.x + button.w / 2, button.y + button.h / 2);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawTopUI() {
      ctx.save();
      ctx.fillStyle = 'rgba(17, 42, 50, 0.82)';
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.uiHeight);
      ctx.strokeStyle = 'rgba(255, 232, 172, 0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, CONFIG.uiHeight);
      ctx.lineTo(CONFIG.width, CONFIG.uiHeight);
      ctx.stroke();

      drawPixelText(`本关 ${game.levelScore}`, 14, 22, 15, '#fff0a6');
      const lineTwo = game.mode === 'competitive'
        ? `总分 ${game.runScore}  目标 ${game.targetScore}`
        : `休闲-总分 ${game.runScore}`;
      drawPixelText(lineTwo, 14, 50, 12, '#bdefff');
      const modeTitle = game.mode === 'competitive'
        ? `${game.levelIndex + 1}/${LEVELS.length} ${game.currentLevel.name}`
        : game.currentLevel.name;
      drawPixelText(modeTitle, 220, 22, 12, '#d2ffc2', 'center');
      drawPixelText(`图鉴 ${Object.keys(game.unlockedCards).length}  信 ${game.unlockedLetters.length}`, 220, 50, 12, '#9ee7ff', 'center');

      const urgent = game.state !== STATE.MENU && game.timer <= 10;
      const pulse = urgent ? Math.sin(performance.now() * 0.012) * 0.5 + 0.5 : 0;
      const timeText = game.timer === Infinity ? '∞' : `${Math.ceil(game.timer)}s`;
      drawPixelText(timeText, game.timer === Infinity ? 292 : 340, 34, 24, urgent ? `rgb(255, ${Math.floor(110 + pulse * 95)}, 110)` : '#ffe7b4', 'right');
      if (game.timer === Infinity) {
        drawButton(game.resultButtons.endRun, '结束', false);
      }
      if (isPlayingState()) {
        drawButton(game.resultButtons.runMenu, '菜单', false);
      }
      ctx.restore();
    }

          const y = 178 + i * 34;
          drawPixelText(card.name, 50, y, 14, '#e8fff6');
          drawPixelText(`次数 ${card.caughtCount}`, 178, y, 12, '#bdefff');
          drawPixelText(`最高 ${card.bestScore}`, 260, y, 12, '#fff0a6');
        });
      }
      drawBackButton();
    }

    function drawLetters() {
      drawOverlayPanel(20, 92, 320, 522);
      drawPixelText('漂流信件', 180, 128, 26, '#ffe89b', 'center');
      if (!game.unlockedLetters.length) {
        drawPixelText('还没有摸到信件。', 180, 278, 15, '#e8fff6', 'center');
        drawPixelText('抓到漂流信件后会收进这里。', 180, 310, 13, '#bdefff', 'center');
      } else {
        game.unlockedLetters.slice(-6).forEach((letter, i) => {
          drawPixelText(`${i + 1}. ${letter}`, 34, 178 + i * 56, 12, '#e8fff6');
        });
      }
      drawBackButton();
    }

    function drawOverlayPanel(x, y, w, h) {
      ctx.save();
      ctx.fillStyle = 'rgba(18, 42, 45, 0.9)';
      ctx.strokeStyle = '#ffd36b';
      ctx.lineWidth = 4;
      roundRect(x, y, w, h, 12, true, true);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillRect(x + 8, y + 8, w - 16, 8);
      ctx.restore();
    }

    // ==============================
    // Rendering
    // ==============================
    function render() {
      drawBackground();
      drawTargets();
      drawHook();
      drawFeedback();
      if (game.state === STATE.AIMING || game.state === STATE.FIRING || game.state === STATE.RETURNING || game.state === STATE.RESULT) {
        drawTopUI();
      }

      if (game.state === STATE.MENU) drawMenu();
      if (game.state === STATE.RESULT) drawResult();
      if (game.state === STATE.PROFILE) drawProfile();
      if (game.state === STATE.INFO) drawInfo();
      if (game.state === STATE.GALLERY) drawGallery();
      if (game.state === STATE.LETTERS) drawLetters();
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, CONFIG.height);
      g.addColorStop(0, '#7bded6');
      g.addColorStop(0.22, '#4da8bd');
      g.addColorStop(0.58, '#174e72');
      g.addColorStop(1, '#081d2c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // Light rays.
      ctx.save();
      ctx.globalAlpha = 0.14;
      ctx.fillStyle = '#fff3b0';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const x = 30 + i * 90;
        ctx.moveTo(x, CONFIG.uiHeight);
        ctx.lineTo(x + 42, CONFIG.height);
        ctx.lineTo(x + 95, CONFIG.height);
        ctx.lineTo(x + 22, CONFIG.uiHeight);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Office / pier zone.
      ctx.fillStyle = '#6d4a35';
      ctx.fillRect(0, 92, CONFIG.width, 38);
      ctx.fillStyle = '#8b6242';
      for (let x = 0; x < CONFIG.width; x += 42) {
        ctx.fillRect(x + 2, 92, 5, 38);
        ctx.fillRect(x, 126, 42, 4);
      }
      ctx.fillStyle = '#f5d488';
      ctx.fillRect(121, 96, 118, 18);
      ctx.fillStyle = '#17313b';
      ctx.fillRect(129, 101, 102, 4);

      // Tiny desk items.
      drawMiniStar(65, 113, 0.54);
      ctx.fillStyle = '#d1f4ff';
      ctx.fillRect(278, 104, 18, 14);
      ctx.fillStyle = '#9ee7ff';
      ctx.fillRect(281, 98, 12, 7);

      // Bubbles.
      ctx.save();
      ctx.strokeStyle = 'rgba(210, 252, 255, 0.34)';
      ctx.lineWidth = 1;
      for (const bubble of game.bubbles) {
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y, bubble.r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      // Sea floor.
      ctx.fillStyle = '#d8b269';
      ctx.fillRect(0, CONFIG.seaFloorTop, CONFIG.width, 30);
      ctx.fillStyle = '#be9658';
      for (let x = 0; x < CONFIG.width; x += 22) {
        ctx.fillRect(x, CONFIG.seaFloorTop + 8 + (x % 3) * 2, 12, 3);
      }
      drawSeaweed(28, 612, '#68c285');
      drawSeaweed(315, 612, '#4eb884');
      drawCoral(78, 616);
      drawCoral(265, 618);
    }

    function drawTargets() {
      for (const target of targets) {
        if (target.grabbed) continue;
        drawTarget(target);
      }
      if (hook.grabbedTarget) drawTarget(hook.grabbedTarget);
    }

    function drawTarget(target) {
      ctx.save();
      ctx.translate(Math.round(target.x), Math.round(target.y));
      if (target.type === 'stickyFish' || target.type === 'lunchFish' || target.type === 'glowFish' || target.type === 'mysteryFish') {
        const flip = target.speed < 0 ? -1 : 1;
        ctx.scale(flip, 1);
        if (target.type === 'mysteryFish') {
          ctx.globalAlpha = 0.95;
          ctx.fillStyle = 'rgba(200, 255, 245, 0.18)';
          pixelOval(0, 0, target.radius * 1.55, target.radius * 0.95);
        }
        ctx.fillStyle = target.color;
        pixelOval(0, 0, target.radius * 1.2, target.radius * 0.72);
        ctx.fillStyle = target.accent;
        ctx.fillRect(-5, -target.radius * 0.35, 11, 8);
        ctx.fillStyle = target.color;
        ctx.beginPath();
        ctx.moveTo(-target.radius * 1.05, 0);
        ctx.lineTo(-target.radius * 1.55, -target.radius * 0.45);
        ctx.lineTo(-target.radius * 1.55, target.radius * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#17313b';
        ctx.fillRect(target.radius * 0.42, -4, 4, 4);
        if (target.type === 'glowFish' || target.type === 'mysteryFish') {
          ctx.fillStyle = '#fff0a6';
          ctx.fillRect(-target.radius * 0.35, -target.radius * 0.55, target.radius * 0.7, 4);
        }
        if (target.mass >= 2.5) {
          ctx.fillStyle = '#fff0a6';
          ctx.fillRect(-8, target.radius * 0.24, 16, 4);
        }
      } else if (target.type === 'driftChest') {
        ctx.fillStyle = '#6c432e';
        ctx.fillRect(-24, -14, 48, 28);
        ctx.fillStyle = target.color;
        ctx.fillRect(-22, -18, 44, 16);
        ctx.fillStyle = target.accent;
        ctx.fillRect(-3, -18, 6, 32);
        ctx.fillRect(-22, -3, 44, 5);
        ctx.strokeStyle = '#2b1c18';
        ctx.lineWidth = 3;
        ctx.strokeRect(-24, -18, 48, 32);
      } else if (target.type === 'emptyBottle' || target.type === 'messageBottle') {
        ctx.rotate(-0.35);
        ctx.fillStyle = '#8fb0ba';
        ctx.fillRect(-8, -17, 16, 30);
        ctx.fillStyle = '#c7edf2';
        ctx.fillRect(-5, -13, 10, 22);
        ctx.fillStyle = '#6f8790';
        ctx.fillRect(-5, -23, 10, 8);
        ctx.fillStyle = target.accent;
        ctx.fillRect(-4, -2, 8, 6);
        if (target.type === 'messageBottle') {
          ctx.fillStyle = '#ffe8a4';
          ctx.fillRect(-6, 4, 12, 7);
        }
        ctx.strokeStyle = '#425762';
        ctx.lineWidth = 3;
        ctx.strokeRect(-8, -17, 16, 30);
      } else if (target.type === 'coffeeJelly' || target.type === 'electricJelly') {
        ctx.save();
        ctx.globalAlpha = 0.22 + Math.sin(performance.now() * 0.01 + target.phase) * 0.08;
        ctx.fillStyle = target.type === 'electricJelly' ? '#8cf7ff' : '#ff79b5';
        ctx.beginPath();
        ctx.arc(0, 4, target.radius + 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = target.color;
        ctx.beginPath();
        ctx.arc(0, -2, target.radius, Math.PI, 0);
        ctx.lineTo(target.radius, 9);
        ctx.lineTo(-target.radius, 9);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = target.accent;
        ctx.fillRect(-9, -9, 18, 5);
        ctx.strokeStyle = '#f3bbff';
        ctx.lineWidth = 3;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 7, 8);
          ctx.quadraticCurveTo(i * 7 + 5, 18, i * 7, 28);
          ctx.stroke();
        }
      } else if (target.type === 'smallPearl' || target.type === 'bigPearl') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        pixelOval(0, 3, target.radius + 5, target.radius * 0.75);
        ctx.fillStyle = target.color;
        ctx.beginPath();
        ctx.arc(0, 0, target.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = target.accent;
        ctx.beginPath();
        ctx.arc(-target.radius * 0.28, -target.radius * 0.28, Math.max(3, target.radius * 0.24), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function pixelOval(x, y, rx, ry) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawHook() {
      const head = hook.headPosition();
      ctx.save();
      ctx.strokeStyle = '#17313b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hook.originX, hook.originY);
      ctx.lineTo(head.x, head.y);
      ctx.stroke();
      ctx.strokeStyle = '#e7d6a4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(hook.originX, hook.originY);
      ctx.lineTo(head.x, head.y);
      ctx.stroke();

      ctx.translate(head.x, head.y);
      ctx.rotate(degToRad(hook.angle) - Math.PI / 2);
      ctx.strokeStyle = '#263d4b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 3, 11, Math.PI * 0.1, Math.PI * 1.15);
      ctx.stroke();
      ctx.strokeStyle = '#f0e3b4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 3, 11, Math.PI * 0.1, Math.PI * 1.15);
      ctx.stroke();
      ctx.restore();
    }

    function drawFeedback() {
      for (const p of game.sparkles) {
        ctx.save();
        ctx.globalAlpha = clamp(p.life / 0.7, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
      }
      for (const item of game.floatTexts) {
        ctx.save();
        ctx.globalAlpha = clamp(item.life / item.maxLife, 0, 1);
        drawPixelText(item.text, item.x, item.y, 18, item.color, 'center');
        ctx.restore();
      }
      if (game.state !== STATE.MENU && game.state !== STATE.RESULT && game.timer <= 10) {
        ctx.save();
        const alpha = (Math.sin(performance.now() * 0.015) + 1) * 0.08;
        ctx.fillStyle = `rgba(255, 95, 88, ${alpha})`;
        ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
        ctx.restore();
      }
    }

    function drawMiniStar(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#f6a6ad';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 18 : 8;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#17313b';
      ctx.fillRect(-6, -3, 4, 4);
      ctx.fillRect(4, -3, 4, 4);
      ctx.fillRect(-3, 5, 8, 3);
      ctx.restore();
    }

    function drawSeaweed(x, y, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 8, y + 20);
        ctx.quadraticCurveTo(x - 6 + i * 8, y + 8, x + 3 + i * 8, y - 8 - i * 5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCoral(x, y) {
      ctx.save();
      ctx.strokeStyle = '#ff9a9e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 20);
      ctx.lineTo(x, y - 10);
      ctx.moveTo(x, y + 4);
      ctx.lineTo(x - 12, y - 7);
      ctx.moveTo(x, y);
      ctx.lineTo(x + 13, y - 14);
      ctx.stroke();
      ctx.restore();
    }

    // ==============================
    // Input
    // ==============================
    function handlePress(event) {
      event.preventDefault();
      const pos = getPointerPos(event);
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      } else {
        ensureAudio();
      }

      if (game.state === STATE.MENU && buttonHit(pos, game.resultButtons.start)) {
        startRun();
        return;
      }
      if (game.state === STATE.MENU) {
        if (buttonHit(pos, game.resultButtons.profile)) game.state = STATE.PROFILE;
        else if (buttonHit(pos, game.resultButtons.info)) game.state = STATE.INFO;
        else if (buttonHit(pos, game.resultButtons.gallery)) game.state = STATE.GALLERY;
        else if (buttonHit(pos, game.resultButtons.letters)) game.state = STATE.LETTERS;
        else if (buttonHit(pos, game.resultButtons.modeEndless)) game.selectedMode = 'endless';
        else if (buttonHit(pos, game.resultButtons.modeCompetitive)) game.selectedMode = 'competitive';
        else if (buttonHit(pos, game.resultButtons.diffLow)) game.difficulty = 'low';
        else if (buttonHit(pos, game.resultButtons.diffMedium)) game.difficulty = 'medium';
        else if (buttonHit(pos, game.resultButtons.diffHigh)) game.difficulty = 'high';
        else if (buttonHit(pos, game.resultButtons.endless30)) game.endlessDuration = 30;
        else if (buttonHit(pos, game.resultButtons.endless60)) game.endlessDuration = 60;
        else if (buttonHit(pos, game.resultButtons.endless120)) game.endlessDuration = 120;
        else if (buttonHit(pos, game.resultButtons.endlessInfinite)) game.endlessDuration = Infinity;
        else if (game.selectedMode === 'endless' && buttonHit(pos, game.resultButtons.scenePrev)) changeEndlessScene(-1);
        else if (game.selectedMode === 'endless' && buttonHit(pos, game.resultButtons.sceneNext)) changeEndlessScene(1);
        return;
      }
      if (game.state === STATE.PROFILE || game.state === STATE.INFO || game.state === STATE.GALLERY || game.state === STATE.LETTERS) {
        if (buttonHit(pos, game.resultButtons.back)) {
          game.state = STATE.MENU;
          return;
        }
        if (game.state === STATE.PROFILE && buttonHit(pos, game.resultButtons.rename)) {
          const index = USERNAME_PRESETS.indexOf(game.username);
          game.username = USERNAME_PRESETS[(index + 1) % USERNAME_PRESETS.length];
          safeLocalStorageSet('idleCoveUsername', game.username);
          return;
        }
      }
      if (game.state === STATE.RESULT && game.mode === 'competitive' && game.resultSuccess &&
        game.levelIndex < LEVELS.length - 1 && buttonHit(pos, game.resultButtons.next)) {
        startNextLevel();
        return;
      }
      if (game.state === STATE.RESULT && game.mode === 'competitive' && !game.resultSuccess &&
        buttonHit(pos, game.resultButtons.failMenu)) {
        game.state = STATE.MENU;
        hook.reset();
        spawnTargets();
        return;
      }
      const canRetryFromResult = game.state === STATE.RESULT &&
        (game.mode !== 'competitive' || game.resultSuccess && game.levelIndex >= LEVELS.length - 1);
      if (canRetryFromResult && buttonHit(pos, game.resultButtons.retry)) {
        startRun();
        return;
      }
      if (game.state === STATE.RESULT && buttonHit(pos, game.resultButtons.menu)) {
        game.state = STATE.MENU;
        hook.reset();
        spawnTargets();
        return;
      }
      if (isPlayingState() && buttonHit(pos, game.resultButtons.runMenu)) {
        game.state = STATE.MENU;
        hook.reset();
        spawnTargets();
        game.respawnQueue = [];
        return;
      }
      if (isPlayingState() && game.timer === Infinity && buttonHit(pos, game.resultButtons.endRun)) {
        finishRound();
        return;
      }
      if (game.state === STATE.AIMING && pos.y > CONFIG.uiHeight) {
        hook.fire();
      }
    }

    canvas.addEventListener('pointerdown', handlePress, { passive: false });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (game.state === STATE.MENU) startRun();
        else if (game.state === STATE.PROFILE || game.state === STATE.INFO || game.state === STATE.GALLERY || game.state === STATE.LETTERS) game.state = STATE.MENU;
        else if (game.state === STATE.RESULT) {
          if (game.mode === 'competitive' && game.resultSuccess && game.levelIndex < LEVELS.length - 1) startNextLevel();
          else if (game.mode === 'competitive' && !game.resultSuccess) game.state = STATE.MENU;
          else startRun();
        }
        else hook.fire();
      }
    });
    document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });

    // ==============================
    // Main loop
    // ==============================
    function prepareLevel(levelIndex) {
      game.levelIndex = levelIndex;
      game.currentLevel = LEVELS[levelIndex];
      game.level = game.currentLevel.id;
      game.timer = game.currentLevel.duration;
      game.targetScore = calculateTargetScore(game.currentLevel);
      game.levelScore = 0;
      game.respawnQueue = [];
    }

    function startRun() {
      game.mode = game.selectedMode;
      game.state = STATE.AIMING;
      game.score = 0;
      game.levelScore = 0;
      game.runScore = 0;
      game.resultSuccess = false;
      game.runComplete = false;
      game.newRecord = false;
      game.lastDiscovery = '';
      game.respawnQueue = [];
      if (game.mode === 'endless') {
        game.timer = game.endlessDuration;
        game.targetScore = null;
        game.level = 0;
        const sceneChoice = ENDLESS_SCENE_CHOICES[game.endlessSceneIndex] || ENDLESS_SCENE_CHOICES[0];
        const selectedScene = getSelectedEndlessScene();
        game.currentLevel = { ...selectedScene, duration: game.endlessDuration };
        game.worldSceneTimer = sceneChoice.world ? rand(16, 24) : 0;
      } else {
        prepareLevel(0);
      }
      resetPlayfield();
    }

    function startNextLevel() {
      game.state = STATE.AIMING;
      game.resultSuccess = false;
      game.newRecord = false;
      game.lastDiscovery = '';
      prepareLevel(game.levelIndex + 1);
      resetPlayfield();
    }

    function resetPlayfield() {
      hook.angle = 0;
      hook.swingDirection = 1;
      hook.reset();
      spawnTargets();
      game.floatTexts = [];
      game.sparkles = [];
      spawnSparkle(180, 120, '#fff0a6', 16);
      playTone(480, 0.08, 0.04);
    }

    function update(dt) {
      updateFeedback(dt);

      if (game.state === STATE.AIMING || game.state === STATE.FIRING || game.state === STATE.RETURNING) {
        if (game.timer !== Infinity) {
          game.timer = Math.max(0, game.timer - dt);
        }
        if (game.timer !== Infinity && game.timer <= 0) {
          finishRound();
          return;
        }
      }

      if (game.state === STATE.AIMING) {
        hook.updateSwing(dt);
      } else if (game.state === STATE.FIRING) {
        hook.extend(dt);
        const hit = checkHookCollision();
        if (hit) {
          hook.attach(hit);
        } else if (hook.shouldReturn()) {
          game.state = STATE.RETURNING;
        }
      } else if (game.state === STATE.RETURNING) {
        hook.retract(dt);
        if (hook.isBack()) {
          if (hook.grabbedTarget) {
            collectTarget(hook.grabbedTarget);
            targets = targets.filter(target => target !== hook.grabbedTarget);
            scheduleEndlessRespawn();
          }
          hook.reset();
          game.state = STATE.AIMING;
        }
      }

      updateTargets(dt);
      updateEndlessRespawns(dt);
      updateWorldScene(dt);
    }

    function loop(timestamp) {
      try {
        if (!game.running) return;
        const dt = Math.min(0.033, (timestamp - game.lastTime) / 1000 || 0);
        game.lastTime = timestamp;
        update(dt);
        render();
        requestAnimationFrame(loop);
      } catch (err) {
        showError(err);
      }
    }

    function showError(err) {
      console.error(err);
      game.running = false;
      errorBox.style.display = 'block';
    }

    function init() {
      try {
        createBubbles();
        spawnTargets();
        render();
        requestAnimationFrame(time => {
          game.lastTime = time;
          requestAnimationFrame(loop);
        });
      } catch (err) {
        showError(err);
      }
    }

    init();
  })();
  </script>
</body>
</html>
