<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>穗潮湾场景原型集</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #211a16;
      color: #fff6de;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }
    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 223, 165, 0.18), transparent 36%),
        linear-gradient(180deg, #35281f, #15110f);
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      max-width: 100vw;
      max-height: 100vh;
      background: #142027;
      border-radius: 14px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      touch-action: none;
    }
    @media (max-width: 520px) {
      canvas { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="gameCanvas" width="360" height="640" aria-label="穗潮湾场景原型集"></canvas>
  </div>

  <script>
  (() => {
    "use strict";

    const Config = {
      version: "v1.7",
      W: 360,
      H: 640,
      fov: 98,
      pitchScale: 5.3,
      yawSmoothing: 0.18,
      pitchSmoothing: 0.18,
      staminaMax: 100,
      errorText: "哎呀，出错了，请重启试试吧~",
      storageKey: "tidegrain-bay-multi-scene-v1"
    };

    const SceneOrder = ["coop", "dock", "orchard", "market"];
    const SceneMeta = {
      coop: { name: "暖穗鸡舍", en: "WarmSheaf Coop", core: "投喂、抚摸、拾蛋", color: "#efbd70", duration: 80 },
      dock: { name: "听潮码头", en: "Tidewharf Dock", core: "听音、抛竿、拉扯", color: "#6dc5dd", duration: 82 },
      orchard: { name: "风磨果园", en: "Windmill Orchard", core: "摇树、分拣、压榨", color: "#f29d63", duration: 80 },
      market: { name: "暮灯集市", en: "Dusklantern Market", core: "浏览、交付、变现", color: "#c18dff", duration: 80 }
    };

    const InventoryLabels = {
      egg: "鸡蛋",
      silverEgg: "银星蛋",
      fish: "鲜鱼",
      shell: "贝壳",
      berry: "鲜果",
      jam: "果酱",
      honey: "蜂蜜"
    };

    const OrderDefs = [
      { id: "egg_pair", title: "早餐篮", needs: { egg: 2 }, gold: 90, rep: 1 },
      { id: "silver_show", title: "银星展示", needs: { silverEgg: 1 }, gold: 120, rep: 1 },
      { id: "dock_pair", title: "海风拼盘", needs: { fish: 1, shell: 1 }, gold: 125, rep: 1 },
      { id: "sweet_jar", title: "甜味订单", needs: { jam: 1 }, gold: 150, rep: 2 },
      { id: "orchard_box", title: "果篮补货", needs: { berry: 2 }, gold: 96, rep: 1 },
      { id: "honey_gift", title: "蜂蜜伴手礼", needs: { honey: 1 }, gold: 138, rep: 2 }
    ];

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function defaultSave() {
      return {
        day: 1,
        gold: 120,
        stamina: Config.staminaMax,
        rep: 0,
        weather: "晴",
        friendship: { chickA: 0, chickB: 0, chickC: 0 },
        inventory: {
          egg: 0,
          silverEgg: 0,
          fish: 0,
          shell: 0,
          berry: 0,
          jam: 0,
          honey: 0
        },
        marketOrders: [],
        sceneBest: {},
        sceneClears: {}
      };
    }

    const State = {
      screen: "menu",
      sensorMode: "drag",
      desktopSim: false,
      sensorReady: false,
      needsCalibration: false,
      permissionAsked: false,
      lastTime: 0,
      hoverId: null,
      toast: "",
      toastTimer: 0,
      result: null,
      currentScene: null,
      drag: { active: false, moved: false, canPan: false, x: 0, y: 0, yaw: 0, pitch: 0 },
      press: { down: false },
      orientation: { alpha: 0, beta: 0, gamma: 0, has: false },
      calibration: { alpha: 0, beta: 70 },
      targetLook: { yaw: 0, pitch: 0 },
      look: { yaw: 0, pitch: 0 },
      particles: [],
      floaters: [],
      save: defaultSave()
    };

    const Audio = {
      ctx: null,
      ensure() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      },
      beep(type) {
        try {
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const map = {
            pickup: [340, 0.08, "triangle"],
            place: [250, 0.1, "sine"],
            good: [620, 0.12, "sine"],
            harvest: [780, 0.09, "triangle"],
            coin: [560, 0.14, "square"],
            miss: [150, 0.05, "sawtooth"],
            bite: [920, 0.08, "triangle"],
            win: [460, 0.24, "sine"]
          };
          const entry = map[type] || map.miss;
          osc.type = entry[2];
          osc.frequency.setValueAtTime(entry[0], now);
          if (type === "win" || type === "coin") osc.frequency.exponentialRampToValueAtTime(entry[0] * 1.5, now + entry[1]);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + entry[1]);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + entry[1] + 0.02);
        } catch (_) {}
      }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function normDeg(v) {
      let n = ((v + 180) % 360 + 360) % 360 - 180;
      return n === -180 ? 180 : n;
    }
    function angleDistance(a, b) { return Math.abs(normDeg(a - b)); }
    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {}
    }
    function safeText(text, x, y, size = 16, color = "#fff7df", align = "center") {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `700 ${size}px system-ui, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }
    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }
    function setToast(text, time = 1.2) {
      State.toast = text;
      State.toastTimer = time;
    }

    function normalizeSave(parsed) {
      const base = defaultSave();
      const save = Object.assign(base, parsed || {});
      save.friendship = Object.assign(base.friendship, parsed && parsed.friendship ? parsed.friendship : {});
      save.inventory = Object.assign(base.inventory, parsed && parsed.inventory ? parsed.inventory : {});
      save.sceneBest = filterSceneStats(parsed && parsed.sceneBest);
      save.sceneClears = filterSceneStats(parsed && parsed.sceneClears);
      save.marketOrders = normalizeOrders(parsed && parsed.marketOrders);
      return save;
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(Config.storageKey);
        State.save = raw ? normalizeSave(JSON.parse(raw)) : normalizeSave(null);
      } catch (_) {
        State.save = normalizeSave(null);
      }
    }
    function saveGame() {
      try { localStorage.setItem(Config.storageKey, JSON.stringify(State.save)); } catch (_) {}
    }

    function randomChoice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }
    function rollWeather() {
      const pool = ["晴", "晴", "多云", "海风", "小雨"];
      return randomChoice(pool);
    }
    function generateOrders() {
      const available = OrderDefs.slice();
      const result = [];
      while (result.length < 3 && available.length) {
        const idx = Math.floor(Math.random() * available.length);
        result.push(Object.assign({ done: false }, available.splice(idx, 1)[0]));
      }
      return result;
    }
    function filterSceneStats(map) {
      const result = {};
      for (const id of SceneOrder) {
        if (map && map[id] != null) result[id] = map[id];
      }
      return result;
    }
    function isSupportedOrder(order) {
      if (!order || typeof order !== "object" || !order.needs) return false;
      return Object.keys(order.needs).every((key) => Object.prototype.hasOwnProperty.call(InventoryLabels, key));
    }
    function normalizeOrders(orders) {
      if (!Array.isArray(orders)) return generateOrders();
      const cleaned = orders.filter(isSupportedOrder).map((order) => Object.assign({ done: false }, order));
      return cleaned.length >= 3 ? cleaned.slice(0, 3) : generateOrders();
    }
    function advanceDay() {
      State.save.day += 1;
      State.save.stamina = Config.staminaMax;
      State.save.weather = rollWeather();
      State.save.marketOrders = generateOrders();
      saveGame();
      setToast(`第 ${State.save.day} 天开始了 · ${State.save.weather}`, 1.8);
    }

    function addInventory(key, amount) {
      State.save.inventory[key] = (State.save.inventory[key] || 0) + amount;
    }
    function hasInventory(need) {
      for (const [key, amount] of Object.entries(need)) {
        if ((State.save.inventory[key] || 0) < amount) return false;
      }
      return true;
    }
    function removeInventory(need) {
      if (!hasInventory(need)) return false;
      for (const [key, amount] of Object.entries(need)) {
        State.save.inventory[key] = Math.max(0, (State.save.inventory[key] || 0) - amount);
      }
      return true;
    }
    function useStamina(amount) {
      if (State.save.stamina < amount) {
        setToast("体力不够啦，先睡一觉吧", 1.4);
        Audio.beep("miss");
        return false;
      }
      State.save.stamina = Math.max(0, State.save.stamina - amount);
      return true;
    }
    function getFriendship(id) {
      return clamp(State.save.friendship[id] || 0, 0, 1000);
    }
    function heartsFromFriendship(value) {
      return clamp(Math.floor(value / 200), 0, 5);
    }
    function getEggQuality() {
      const avg = (getFriendship("chickA") + getFriendship("chickB") + getFriendship("chickC")) / 3;
      return avg >= 300 ? "silverEgg" : "egg";
    }
    function formatNeed(need) {
      return Object.entries(need).map(([key, amount]) => `${InventoryLabels[key]}x${amount}`).join(" + ");
    }

    function project(obj) {
      const dx = normDeg(obj.yaw - State.look.yaw);
      if (Math.abs(dx) > Config.fov / 2 + 22) return null;
      const x = Config.W / 2 + (dx / (Config.fov / 2)) * (Config.W / 2);
      const y = 330 - (obj.pitch - State.look.pitch) * Config.pitchScale;
      const scale = clamp(1 - Math.abs(dx) / 132, 0.52, 1.16);
      return { x, y, scale, dx };
    }

    function getSceneObjects() {
      return State.currentScene ? State.currentScene.objects.filter(o => !o.hidden) : [];
    }

    function findHover() {
      if (!State.currentScene) return null;
      let best = null;
      let bestScore = Infinity;
      for (const obj of getSceneObjects()) {
        if (obj.disabled) continue;
        const dy = Math.abs(obj.pitch - State.look.pitch);
        const dist = Math.hypot(angleDistance(obj.yaw, State.look.yaw), dy * 1.35);
        if (dist < (obj.angle || 15) && dist < bestScore) {
          best = obj;
          bestScore = dist;
        }
      }
      State.hoverId = best ? best.id : null;
      return best;
    }

    function calibrate() {
      State.calibration.alpha = State.orientation.has ? State.orientation.alpha : 0;
      State.calibration.beta = State.orientation.has ? State.orientation.beta : 70;
      State.drag.yaw = 0;
      State.drag.pitch = 0;
      State.targetLook.yaw = 0;
      State.targetLook.pitch = 0;
      State.look.yaw = 0;
      State.look.pitch = 0;
      setToast("已重新居中", 1);
    }

    function onOrientation(e) {
      State.orientation.alpha = e.alpha || 0;
      State.orientation.beta = e.beta || 0;
      State.orientation.gamma = e.gamma || 0;
      State.orientation.has = true;
      if (State.sensorReady) State.sensorMode = "gyro";
      if (State.needsCalibration && State.screen === "playing") {
        State.calibration.alpha = State.orientation.alpha;
        State.calibration.beta = State.orientation.beta;
        State.needsCalibration = false;
      }
    }

    function updateLook() {
      if (State.sensorMode === "gyro" && State.orientation.has && !State.desktopSim) {
        State.targetLook.yaw = normDeg(State.orientation.alpha - State.calibration.alpha + State.drag.yaw);
        State.targetLook.pitch = clamp((State.orientation.beta - State.calibration.beta) * 0.72 + State.drag.pitch, -32, 32);
      } else {
        State.targetLook.yaw = normDeg(State.drag.yaw);
        State.targetLook.pitch = clamp(State.drag.pitch, -32, 32);
      }
      State.look.yaw = normDeg(State.look.yaw + normDeg(State.targetLook.yaw - State.look.yaw) * Config.yawSmoothing);
      State.look.pitch += (State.targetLook.pitch - State.look.pitch) * Config.pitchSmoothing;
    }

    async function requestMotionAndOpenHub() {
      try {
        Audio.ensure();
        State.permissionAsked = true;
        const DOE = window.DeviceOrientationEvent;
        if (DOE && typeof DOE.requestPermission === "function") {
          const res = await DOE.requestPermission();
          if (res === "granted") {
            State.sensorMode = "gyro";
            State.sensorReady = true;
          } else {
            State.sensorMode = "drag";
            State.desktopSim = false;
            setToast("已切换为拖动视角", 1.6);
          }
        } else if (DOE) {
          State.sensorMode = "gyro";
          State.sensorReady = true;
        } else {
          State.sensorMode = "drag";
          State.desktopSim = true;
        }
      } catch (_) {
        State.sensorMode = "drag";
        State.desktopSim = true;
      }
      State.screen = "hub";
    }

    function openHubDesktop() {
      State.sensorMode = "drag";
      State.sensorReady = false;
      State.desktopSim = true;
      State.screen = "hub";
    }

    function createScene(id) {
      const meta = SceneMeta[id];
      const scene = { id, meta, timer: meta.duration, objects: [], data: {} };
      if (id === "coop") {
        scene.data = { holding: "", feedPlaced: 0, petsDone: 0, eggsCollected: 0 };
        const eggKind = getEggQuality();
        scene.objects = [
          { id: "hopper", kind: "hopper", label: "干草料斗", action: "拿干草", yaw: -60, pitch: -6, angle: 13 },
          { id: "trough1", kind: "trough", label: "食槽 1", action: "放干草", yaw: 6, pitch: -18, angle: 12, filled: false },
          { id: "trough2", kind: "trough", label: "食槽 2", action: "放干草", yaw: 26, pitch: -18, angle: 12, filled: false },
          { id: "trough3", kind: "trough", label: "食槽 3", action: "放干草", yaw: 46, pitch: -18, angle: 12, filled: false },
          { id: "chickA", kind: "chicken", label: "米粒", action: "摸摸", yaw: -28, baseYaw: -28, pitch: -24, angle: 16, color: "#fff6d7", pet: false, bob: 0, wander: 0, mood: "idle" },
          { id: "chickB", kind: "chicken", label: "栗栗", action: "摸摸", yaw: 66, baseYaw: 66, pitch: -22, angle: 16, color: "#c98242", pet: false, bob: 1.8, wander: 1.1, mood: "idle" },
          { id: "chickC", kind: "chicken", label: "小葵", action: "摸摸", yaw: -86, baseYaw: -86, pitch: -25, angle: 16, color: "#ffd85e", pet: false, bob: 3, wander: 2.2, mood: "idle" },
          { id: "egg1", kind: "egg", label: eggKind === "silverEgg" ? "银星蛋" : "普通蛋", action: "拾取", yaw: -42, pitch: -35, angle: 14, collected: false, quality: eggKind },
          { id: "egg2", kind: "egg", label: eggKind === "silverEgg" ? "银星蛋" : "普通蛋", action: "拾取", yaw: 90, pitch: -34, angle: 14, collected: false, quality: eggKind }
        ];
      } else if (id === "dock") {
        scene.data = {
          phase: "search",
          activeId: randomChoice(["spot1", "spot2", "spot3"]),
          castId: "",
          wait: 0,
          bite: 0,
          fightTime: 0,
          fishY: 0.5,
          boxY: 0.5,
          boxVel: 0,
          progress: 28,
          catches: 0
        };
        scene.objects = [
          { id: "spot1", kind: "spot", label: "左侧水花", action: "抛竿", yaw: -58, pitch: -12, angle: 15 },
          { id: "spot2", kind: "spot", label: "近岸水花", action: "抛竿", yaw: 12, pitch: -14, angle: 15 },
          { id: "spot3", kind: "spot", label: "远处水花", action: "抛竿", yaw: 78, pitch: -13, angle: 15 }
        ];
      } else if (id === "orchard") {
        scene.data = { holding: "", sorted: 0, jamDone: 0, honey: false };
        scene.objects = [
          { id: "tree1", kind: "tree", label: "苹果树", action: "摇一摇", yaw: -70, pitch: -12, angle: 18, shaken: false },
          { id: "tree2", kind: "tree", label: "野莓树", action: "摇一摇", yaw: 4, pitch: -10, angle: 18, shaken: false },
          { id: "tree3", kind: "tree", label: "杏果树", action: "摇一摇", yaw: 76, pitch: -12, angle: 18, shaken: false },
          { id: "hive", kind: "hive", label: "蜂箱", action: "收蜂蜜", yaw: -36, pitch: -10, angle: 14, taken: false },
          { id: "crate", kind: "crateGood", label: "完好果筐", action: "放入好果", yaw: -14, pitch: -21, angle: 14 },
          { id: "press", kind: "press", label: "压榨桶", action: "做成果酱", yaw: 46, pitch: -21, angle: 14 }
        ];
      } else if (id === "market") {
        scene.data = { panel: false, actions: 0, earned: 0 };
        scene.objects = [
          { id: "board", kind: "board", label: "订单公告板", action: "查看订单", yaw: 2, pitch: -16, angle: 16 },
          { id: "stallGrocer", kind: "stallGrocer", label: "杂货摊", action: "快速出售", yaw: -70, pitch: -10, angle: 15 },
          { id: "stallFish", kind: "stallFish", label: "鱼贩摊", action: "快速出售", yaw: 72, pitch: -10, angle: 15 },
          { id: "stallCraft", kind: "stallCraft", label: "手作摊", action: "快速出售", yaw: 38, pitch: -11, angle: 15 }
        ];
      }
      return scene;
    }

    function enterScene(id) {
      Audio.ensure();
      State.currentScene = createScene(id);
      State.result = null;
      State.screen = "playing";
      State.needsCalibration = State.sensorMode === "gyro";
      calibrate();
      setToast(`${SceneMeta[id].name} · ${SceneMeta[id].core}`, 2.1);
    }

    function leaveScene() {
      State.currentScene = null;
      State.screen = "hub";
      State.result = null;
      State.hoverId = null;
      State.press.down = false;
      saveGame();
    }

    function finishScene(success, body, rewardLines) {
      if (!State.currentScene) return;
      const id = State.currentScene.id;
      State.save.sceneClears[id] = (State.save.sceneClears[id] || 0) + (success ? 1 : 0);
      const usedTime = Math.max(0, Math.round(SceneMeta[id].duration - State.currentScene.timer));
      const best = State.save.sceneBest[id];
      if (success && (!best || usedTime < best)) State.save.sceneBest[id] = usedTime;
      saveGame();
      State.result = {
        id,
        title: success ? `${SceneMeta[id].name} 已完成` : `${SceneMeta[id].name} 暂停`,
        body: body || "",
        rewardLines: rewardLines || [],
        best: State.save.sceneBest[id] || 0
      };
      State.screen = "result";
      Audio.beep(success ? "win" : "miss");
    }

    function updateScene(dt) {
      const scene = State.currentScene;
      if (!scene) return;
      scene.timer -= dt;
      if (scene.timer <= 0) {
        scene.timer = 0;
        finishScene(false, "时间到了，这个场景还没完全跑通。", []);
        return;
      }

      if (scene.id === "coop") updateCoopScene(scene, dt);
      if (scene.id === "dock") updateDockScene(scene, dt);
      if (scene.id === "orchard") updateOrchardScene(scene, dt);

      findHover();
    }

    function updateDockScene(scene, dt) {
      const d = scene.data;
      if (d.phase === "wait") {
        d.wait -= dt;
        if (d.wait <= 0) {
          d.phase = "bite";
          d.bite = 0.82;
          setToast("鱼漂动了，快点一下", 1);
          Audio.beep("bite");
          vibrate(20);
        }
      } else if (d.phase === "bite") {
        d.bite -= dt;
        if (d.bite <= 0) {
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          setToast("没咬稳，换个方向再试试", 1.2);
        }
      } else if (d.phase === "fight") {
        d.fightTime += dt;
        const fishWave = Math.sin(d.fightTime * 2.8) * 0.28 + Math.sin(d.fightTime * 5.4) * 0.1;
        d.fishY = clamp(0.5 + fishWave, 0.08, 0.92);
        d.boxVel += (State.press.down ? -1 : 1) * dt * 1.2;
        d.boxVel *= 0.9;
        d.boxY = clamp(d.boxY + d.boxVel, 0.06, 0.94);
        const size = 0.18;
        if (Math.abs(d.fishY - d.boxY) < size) d.progress = Math.min(100, d.progress + dt * 34);
        else d.progress = Math.max(0, d.progress - dt * 22);
        if (d.progress >= 100) {
          d.catches += 1;
          addInventory("fish", 1);
          if (Math.random() < 0.5) addInventory("shell", 1);
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          setToast(`起钩成功 ${d.catches}/2`, 1.2);
          Audio.beep("harvest");
          if (d.catches >= 2) {
            finishScene(true, "听声、抛竿、拉扯这条线已经跑通。", ["鲜鱼 +2", "可能掉落贝壳"]);
          }
        } else if (d.progress <= 0) {
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          d.boxVel = 0;
          setToast("它挣脱了，再听听水花方向", 1.2);
          Audio.beep("miss");
        }
      }
    }

    function updateCoopScene(scene, dt) {
      for (const chick of scene.objects.filter(o => o.kind === "chicken")) {
        chick.bob += dt * 3.2;
        chick.wander += dt;
        chick.yaw = normDeg(chick.baseYaw + Math.sin(chick.wander * 0.68) * (chick.mood === "eat" ? 2.4 : 5));
        if (chick.mood === "happy" && Math.random() < dt * 0.5) {
          const p = project(chick);
          if (p) burstHearts(p.x, p.y - 36);
        }
      }
    }

    function updateOrchardScene(scene, dt) {
      for (const fruit of scene.objects.filter(o => o.kind === "fruit")) {
        fruit.bounce = (fruit.bounce || 0) + dt * 5;
      }
    }

    function getSceneHint() {
      const scene = State.currentScene;
      if (!scene) return null;
      if (scene.id === "coop") {
        if (scene.data.holding !== "hay" && scene.objects.some(o => o.kind === "trough" && !o.filled)) return { obj: scene.objects.find(o => o.id === "hopper"), text: "先从料斗拿一束干草" };
        if (scene.data.holding === "hay") return { obj: scene.objects.find(o => o.kind === "trough" && !o.filled), text: "把干草放进空食槽" };
        const unpet = scene.objects.find(o => o.kind === "chicken" && !o.pet);
        if (unpet) return { obj: unpet, text: `找到 ${unpet.label}，摸摸它` };
        return { obj: scene.objects.find(o => o.kind === "egg" && !o.collected), text: "地上还有鸡蛋没捡" };
      }
      if (scene.id === "dock") {
        const active = scene.objects.find(o => o.id === scene.data.activeId);
        if (scene.data.phase === "search") return { obj: active, text: "跟着咕噜声，把视角对准水花抛竿" };
        if (scene.data.phase === "bite") return { obj: active, text: "鱼漂沉了，马上点一下起钩" };
        return { obj: active, text: "按住屏幕让绿色捕获框追住鱼标" };
      }
      if (scene.id === "orchard") {
        const tree = scene.objects.find(o => o.kind === "tree" && !o.shaken);
        if (tree) return { obj: tree, text: "先摇树，把果子打下来" };
        if (!scene.data.holding) return { obj: scene.objects.find(o => o.kind === "fruit" && !o.collected), text: "捡起地上的果子" };
        if (scene.data.holding === "good") return { obj: scene.objects.find(o => o.id === "crate"), text: "把完好果放进果筐" };
        return { obj: scene.objects.find(o => o.id === "press"), text: "把加工果放进压榨桶" };
      }
      if (scene.id === "market") {
        if (scene.data.panel) return null;
        return { obj: scene.objects.find(o => o.id === "board"), text: "先看订单板，或者去摊位快速出售" };
      }
      return null;
    }

    function interactSceneObject(obj) {
      const scene = State.currentScene;
      if (!scene || !obj) {
        setToast("再靠近一点点", 0.9);
        Audio.beep("miss");
        return;
      }

      if (scene.id === "coop") return interactCoop(scene, obj);
      if (scene.id === "dock") return interactDock(scene, obj);
      if (scene.id === "orchard") return interactOrchard(scene, obj);
      if (scene.id === "market") return interactMarket(scene, obj);
    }

    function interactDock(scene, obj) {
      const d = scene.data;
      if (d.phase === "search") {
        if (obj.id !== d.activeId) {
          setToast("水花不太对，换个方向听听", 1);
          Audio.beep("miss");
          return;
        }
        if (!useStamina(3)) return;
        d.phase = "wait";
        d.castId = obj.id;
        d.wait = 1.05;
        setToast("鱼线甩出去啦", 1);
        Audio.beep("place");
      }
    }

    function interactCoop(scene, obj) {
      const d = scene.data;
      if (obj.kind === "hopper") {
        d.holding = "hay";
        setToast("手持干草", 1);
        Audio.beep("pickup");
        return;
      }
      if (obj.kind === "trough") {
        if (!d.holding) {
          setToast("先去料斗拿干草", 1);
          Audio.beep("miss");
          return;
        }
        if (obj.filled) return;
        obj.filled = true;
        d.holding = "";
        d.feedPlaced += 1;
        setToast(`食槽放好啦 ${d.feedPlaced}/3`, 1);
        Audio.beep("place");
        sparkleAtObject(obj, "#fff1a2");
        scene.objects.filter(o => o.kind === "chicken").forEach((chick) => { chick.mood = "eat"; });
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
        return;
      }
      if (obj.kind === "chicken") {
        if (obj.pet) {
          setToast(`${obj.label} 今天已经摸过啦`, 1);
          return;
        }
        obj.pet = true;
        obj.mood = "happy";
        d.petsDone += 1;
        State.save.friendship[obj.id] = clamp((State.save.friendship[obj.id] || 0) + 16, 0, 1000);
        burstHeartsAtObject(obj);
        addFloater("+好感", Config.W * 0.7, 132, "#ff82b0");
        Audio.beep("good");
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
        return;
      }
      if (obj.kind === "egg" && !obj.collected) {
        obj.collected = true;
        obj.hidden = true;
        d.eggsCollected += 1;
        addInventory(obj.quality, 1);
        addFloater(`+1 ${obj.label}`, Config.W * 0.76, 154, obj.quality === "silverEgg" ? "#edf7ff" : "#fff7d6");
        Audio.beep("harvest");
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
      }
    }

    function finishCoopScene(scene) {
      finishScene(true, "照料、陪伴、拾蛋这条治愈回路已经能直接体验。", [getEggQuality() === "silverEgg" ? "银星蛋 +2" : "鸡蛋 +2", "三只小鸡好感提升"]);
    }

    function spawnOrchardFruit(scene, baseYaw, goodFirst) {
      const kinds = goodFirst ? ["good", "process"] : ["process", "good"];
      kinds.forEach((type, index) => {
        scene.objects.push({
          id: `fruit-${baseYaw}-${index}-${Math.random().toString(36).slice(2, 5)}`,
          kind: "fruit",
          label: type === "good" ? "完好果" : "加工果",
          action: "捡起",
          yaw: baseYaw + (index === 0 ? -8 : 6),
          pitch: -28,
          angle: 12,
          fruitType: type,
          collected: false,
          bounce: index * 0.9
        });
      });
    }

    function interactOrchard(scene, obj) {
      const d = scene.data;
      if (obj.kind === "tree" && !obj.shaken) {
        if (!useStamina(2)) return;
        obj.shaken = true;
        obj.action = "已收过";
        spawnOrchardFruit(scene, obj.yaw, Math.random() > 0.35);
        setToast("树冠抖了抖，果子掉下来啦", 1.2);
        Audio.beep("good");
        return;
      }
      if (obj.kind === "hive" && !obj.taken) {
        if (!useStamina(1)) return;
        obj.taken = true;
        addInventory("honey", 1);
        d.honey = true;
        setToast("蜂蜜收好啦", 1);
        Audio.beep("harvest");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "fruit" && !obj.collected) {
        d.holding = obj.fruitType;
        obj.collected = true;
        obj.hidden = true;
        setToast(obj.fruitType === "good" ? "拿起完好果" : "拿起加工果", 1);
        Audio.beep("pickup");
        return;
      }
      if (obj.kind === "crateGood" && d.holding === "good") {
        addInventory("berry", 1);
        d.sorted += 1;
        d.holding = "";
        setToast(`完好果入筐 ${d.sorted}/2`, 1);
        Audio.beep("place");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "press" && d.holding === "process") {
        addInventory("jam", 1);
        d.jamDone = 1;
        d.holding = "";
        setToast("压榨完成，得到一罐果酱", 1.2);
        Audio.beep("harvest");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "crateGood" || obj.kind === "press") {
        setToast(d.holding ? "这个去另一边更合适" : "先捡起果子再处理", 1.1);
        Audio.beep("miss");
      }
    }

    function checkOrchardFinish(scene) {
      const d = scene.data;
      if (d.sorted >= 2 && d.jamDone >= 1 && d.honey) finishScene(true, "摇树、分拣、压榨这一套流程可以直接试玩。", ["鲜果 +2", "果酱 +1", "蜂蜜 +1"]);
    }

    function interactMarket(scene, obj) {
      if (obj.id === "board") {
        scene.data.panel = !scene.data.panel;
        setToast(scene.data.panel ? "订单板打开了" : "订单板收起", 0.8);
        return;
      }
      if (obj.id === "stallGrocer") return marketQuickSell(scene, ["egg", "berry"], "农货卖出");
      if (obj.id === "stallFish") return marketQuickSell(scene, ["fish", "shell"], "海货卖出");
      if (obj.id === "stallCraft") return marketQuickSell(scene, ["silverEgg", "jam", "honey"], "手作卖出");
    }

    function getSellPrice(key) {
      const base = { egg: 50, silverEgg: 85, fish: 70, shell: 24, berry: 28, jam: 115, honey: 92 };
      let price = base[key] || 20;
      if (State.save.weather === "晴" && key === "fish") price += 16;
      if (State.save.weather === "海风" && key === "shell") price += 8;
      return price;
    }

    function marketQuickSell(scene, list, label) {
      const found = list.find((key) => (State.save.inventory[key] || 0) > 0);
      if (!found) {
        setToast("背包里没有对应货物", 1);
        Audio.beep("miss");
        return;
      }
      removeInventory({ [found]: 1 });
      const price = getSellPrice(found);
      State.save.gold += price;
      scene.data.actions += 1;
      scene.data.earned += price;
      addFloater(`+${price}G`, Config.W * 0.74, 126, "#ffe593");
      setToast(`${label}：${InventoryLabels[found]} +${price}G`, 1.2);
      Audio.beep("coin");
      saveGame();
      if (scene.data.actions >= 2) finishScene(true, "订单交付和动态售价都已经挂上了。", [`本次赚到 ${scene.data.earned}G`]);
    }

    function handleSceneOverlayTap(x, y) {
      const scene = State.currentScene;
      if (!scene) return false;

      if (scene.id === "dock") {
        if (scene.data.phase === "bite") {
          scene.data.phase = "fight";
          scene.data.fightTime = 0;
          scene.data.boxY = 0.54;
          scene.data.boxVel = 0;
          scene.data.progress = 26;
          setToast("钩住了，稳住捕获框", 1.1);
          Audio.beep("good");
          return true;
        }
        return false;
      }

      if (scene.id === "market" && scene.data.panel) {
        if (hit(x, y, 38, 158, 284, 230)) {
          for (let i = 0; i < State.save.marketOrders.length; i++) {
            const oy = 194 + i * 58;
            if (hit(x, y, 52, oy - 18, 256, 42)) {
              const order = State.save.marketOrders[i];
              if (order.done) {
                setToast("这个订单今天已经交过了", 1);
                return true;
              }
              if (!hasInventory(order.needs)) {
                setToast(`缺少：${formatNeed(order.needs)}`, 1.2);
                Audio.beep("miss");
                return true;
              }
              removeInventory(order.needs);
              order.done = true;
              State.save.gold += order.gold;
              State.save.rep += order.rep;
              scene.data.actions += 1;
              scene.data.earned += order.gold;
              addFloater(`+${order.gold}G`, 286, 128, "#ffe593");
              setToast(`${order.title} 已交付`, 1.1);
              Audio.beep("coin");
              saveGame();
              if (scene.data.actions >= 2) finishScene(true, "集市的订单交付和即时变现已经具备基础回路。", [`本次赚到 ${scene.data.earned}G`]);
              return true;
            }
          }
        }
        if (hit(x, y, 248, 166, 58, 24)) {
          scene.data.panel = false;
          return true;
        }
        return true;
      }
      return false;
    }

    function burstHearts(x, y) {
      for (let i = 0; i < 10; i++) {
        State.particles.push({
          type: "heart",
          x, y,
          vx: (Math.random() - 0.5) * 55,
          vy: -42 - Math.random() * 44,
          life: 0.86 + Math.random() * 0.34,
          max: 1.16,
          size: 8 + Math.random() * 7,
          color: "#ff6f9c"
        });
      }
    }
    function sparkle(x, y, color = "#fff3aa") {
      for (let i = 0; i < 12; i++) {
        State.particles.push({
          type: "spark",
          x, y,
          vx: (Math.random() - 0.5) * 86,
          vy: (Math.random() - 0.7) * 80,
          life: 0.56,
          max: 0.56,
          size: 3 + Math.random() * 4,
          color
        });
      }
    }
    function addFloater(text, x, y, color) {
      State.floaters.push({ text, x, y, color, life: 1.1, max: 1.1 });
    }
    function sparkleAtObject(obj, color) {
      const p = project(obj);
      if (p) sparkle(p.x, p.y - 8, color);
    }
    function burstHeartsAtObject(obj) {
      const p = project(obj);
      if (p) burstHearts(p.x, p.y - 34);
    }

    function update(dt) {
      updateLook();
      if (State.screen === "playing") updateScene(dt);

      for (let i = State.particles.length - 1; i >= 0; i--) {
        const p = State.particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 45 * dt;
        if (p.life <= 0) State.particles.splice(i, 1);
      }
      for (let i = State.floaters.length - 1; i >= 0; i--) {
        const f = State.floaters[i];
        f.life -= dt;
        f.y -= 24 * dt;
        if (f.life <= 0) State.floaters.splice(i, 1);
      }
      if (State.toastTimer > 0) State.toastTimer -= dt;
    }

    function drawGradient(top, mid, bottom) {
      const grd = ctx.createLinearGradient(0, 0, 0, Config.H);
      grd.addColorStop(0, top);
      grd.addColorStop(0.42, mid);
      grd.addColorStop(0.43, bottom);
      grd.addColorStop(1, bottom);
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, Config.W, Config.H);
    }

    function drawBackgroundForScene() {
      const id = State.currentScene.id;
      const yaw = State.look.yaw;
      if (id === "coop") {
        drawGradient("#f7d48f", "#f0bf73", "#5a3828");
        ctx.fillStyle = "#70462e";
        ctx.fillRect(0, 386, Config.W, 254);
        drawWindow(180 - normDeg(yaw - 4) * 1.1, 106);
        drawWallProp(-110, "草捆");
        drawWallProp(118, "木桶");
      } else if (id === "dock") {
        drawGradient("#74b5db", "#fee0a9", "#4f6b74");
        ctx.fillStyle = "#4e9fbe";
        ctx.fillRect(0, 374, Config.W, 266);
        for (let i = 0; i < 7; i++) {
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.beginPath();
          ctx.moveTo(0, 392 + i * 30 + Math.sin(i + yaw * 0.03) * 8);
          ctx.lineTo(Config.W, 388 + i * 30 + Math.cos(i + yaw * 0.02) * 8);
          ctx.stroke();
        }
        ctx.fillStyle = "#9b744d";
        ctx.fillRect(0, 520, Config.W, 120);
      } else if (id === "orchard") {
        drawGradient("#b6e4ff", "#e9d48d", "#6a914a");
        ctx.fillStyle = "#8cb764";
        ctx.fillRect(0, 392, Config.W, 248);
        drawWindmill(274 - yaw * 1.1, 132);
      } else if (id === "market") {
        drawGradient("#7a6fa4", "#e4a670", "#4d3256");
        ctx.fillStyle = "#5b3c63";
        ctx.fillRect(0, 398, Config.W, 242);
        drawLantern(84 - yaw * 1.4, 140);
        drawLantern(180 - yaw * 1.1, 114);
        drawLantern(276 - yaw * 1.35, 140);
      }
    }

    function drawWindow(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#7b4a2b";
      roundRect(-46, -34, 92, 68, 8, true);
      ctx.fillStyle = "#ffe2a0";
      roundRect(-34, -24, 68, 48, 4, true);
      ctx.strokeStyle = "#9b6337";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -24); ctx.lineTo(0, 24);
      ctx.moveTo(-34, 0); ctx.lineTo(34, 0);
      ctx.stroke();
      ctx.restore();
    }
    function drawWallProp(yaw, type) {
      const dx = normDeg(yaw - State.look.yaw);
      if (Math.abs(dx) > 90) return;
      const x = Config.W / 2 + dx * 2;
      ctx.save();
      ctx.globalAlpha = 0.46;
      ctx.fillStyle = type === "草捆" ? "#c39142" : "#6f3f27";
      roundRect(x - 26, 292, 52, 44, 10, true);
      ctx.restore();
    }
    function drawWindmill(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#d5b386";
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(34, 72);
      ctx.lineTo(-34, 72);
      ctx.closePath();
      ctx.fill();
      ctx.translate(0, -4);
      ctx.strokeStyle = "#8d6a47";
      ctx.lineWidth = 6;
      const t = performance.now() * 0.002;
      for (let i = 0; i < 4; i++) {
        const a = t + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34);
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawLantern(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(255,240,210,0.42)";
      ctx.beginPath();
      ctx.moveTo(0, -40);
      ctx.lineTo(0, 0);
      ctx.stroke();
      ctx.fillStyle = "#ffdd8a";
      roundRect(-12, 0, 24, 28, 8, true);
      ctx.restore();
    }
    function drawSceneObjects() {
      const ordered = getSceneObjects().map((o) => ({ o, p: project(o) })).filter((entry) => entry.p);
      ordered.sort((a, b) => a.p.y - b.p.y);
      for (const entry of ordered) {
        const hover = State.hoverId === entry.o.id;
        ctx.save();
        ctx.translate(entry.p.x, entry.p.y);
        ctx.scale(entry.p.scale, entry.p.scale);
        if (hover) drawGlow(entry.o);
        drawObject(entry.o);
        if (hover && State.currentScene.id !== "market") drawObjectLabel(entry.o);
        ctx.restore();
      }
    }

    function drawGlow(obj) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(performance.now() * 0.008) * 0.14;
      ctx.fillStyle = "#fff2a6";
      const r = obj.kind === "tree" ? 40 : obj.kind === "chicken" ? 34 : 26;
      ctx.beginPath();
      ctx.ellipse(0, 4, r, r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawObject(obj) {
      switch (obj.kind) {
        case "spot": return drawFishSpot(obj);
        case "hopper": return drawHopper();
        case "trough": return drawTrough(obj);
        case "chicken": return drawChicken(obj);
        case "egg": return drawEgg(obj);
        case "tree": return drawTree(obj);
        case "hive": return drawHive(obj);
        case "crateGood": return drawCrate(obj, "#d39e59", "好果");
        case "press": return drawPress(obj);
        case "fruit": return drawFruit(obj);
        case "board": return drawBoard();
        case "stallGrocer": return drawStall("#9cc666", "菜");
        case "stallFish": return drawStall("#6cbad7", "鱼");
        case "stallCraft": return drawStall("#c9a8f7", "作");
      }
    }

    function drawFishSpot(obj) {
      ctx.strokeStyle = obj.id === State.currentScene.data.activeId ? "#fff4bf" : "rgba(255,255,255,0.42)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(0, i * 3, 22 - i * 5, 7 - i, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    function drawHopper() {
      ctx.fillStyle = "#6d4328";
      roundRect(-28, -24, 56, 48, 7, true);
      ctx.fillStyle = "#c7903e";
      for (let i = -20; i <= 18; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, -22);
        ctx.lineTo(i + 10, -40);
        ctx.lineTo(i + 20, -22);
        ctx.fill();
      }
      ctx.fillStyle = "#4b2d1e";
      ctx.fillRect(-22, -2, 44, 8);
    }
    function drawTrough(obj) {
      ctx.fillStyle = "#75462b";
      roundRect(-33, -12, 66, 24, 7, true);
      ctx.fillStyle = "#4d2d1f";
      roundRect(-27, -7, 54, 12, 5, true);
      if (obj.filled) {
        ctx.fillStyle = "#d8ad55";
        for (let i = -22; i <= 18; i += 8) {
          ctx.beginPath();
          ctx.moveTo(i, -6);

    function drawObjectiveGuide() {
      const guide = getSceneHint();
      if (!guide || !guide.obj) return;
      if (State.hoverId === guide.obj.id) return;
      const obj = guide.obj;
      const delta = normDeg(obj.yaw - State.look.yaw);
      const yDelta = obj.pitch - State.look.pitch;
      const offscreen = Math.abs(delta) > Config.fov / 2 - 8;
      ctx.save();
      ctx.fillStyle = "rgba(64,39,27,0.7)";
      roundRect(34, 116, 292, 30, 11, true);
      safeText(guide.text, 180, 131, 12, "#fff1c2");
      if (offscreen) {
        const left = delta < 0;
        const x = left ? 28 : 332;
        const y = 320;
        ctx.fillStyle = "rgba(255,232,159,0.92)";
        ctx.beginPath();
        if (left) {
          ctx.moveTo(x - 12, y);
          ctx.lineTo(x + 10, y - 16);
          ctx.lineTo(x + 10, y + 16);
        } else {
          ctx.moveTo(x + 12, y);
          ctx.lineTo(x - 10, y - 16);
          ctx.lineTo(x - 10, y + 16);
        }
        ctx.closePath();
        ctx.fill();
      } else if (Math.abs(yDelta) > 8) {
        const x = Config.W / 2 + (delta / (Config.fov / 2)) * (Config.W / 2);
        const y = yDelta > 0 ? 168 : 486;
        ctx.fillStyle = "rgba(255,232,159,0.92)";
        ctx.beginPath();
        if (yDelta > 0) {
          ctx.moveTo(x, y - 13);
          ctx.lineTo(x - 13, y + 10);
          ctx.lineTo(x + 13, y + 10);
        } else {
          ctx.moveTo(x, y + 13);
          ctx.lineTo(x - 13, y - 10);
          ctx.lineTo(x + 13, y - 10);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

        drawParticles();
        drawHud();
        drawSceneOverlay();
        drawToast();
      } else if (State.screen === "result") drawResult();
      else drawError();

    function getPoint(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * Config.W / r.width,
        y: (t.clientY - r.top) * Config.H / r.height
      };
    }
    function hit(x, y, bx, by, bw, bh) {
      return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
    }
    function isPlayingControl(x, y) {
      return hit(x, y, 16, 584, 64, 34) || hit(x, y, 90, 584, 64, 34) || hit(x, y, 202, 584, 142, 34) || (State.currentScene && State.currentScene.id === "market" && State.currentScene.data.panel);
    }

    function pointerDown(e) {
      e.preventDefault();
      Audio.ensure();
      const p = getPoint(e);
      State.press.down = true;
      if (State.screen === "playing" && State.currentScene && State.currentScene.id === "dock" && State.currentScene.data.phase === "fight") return;
      State.drag.active = true;
      State.drag.moved = false;
      State.drag.canPan = State.screen === "playing" && !isPlayingControl(p.x, p.y);
      State.drag.x = p.x;
      State.drag.y = p.y;
    }

    function pointerMove(e) {
      if (!State.drag.active) return;
      e.preventDefault();
      const p = getPoint(e);
      const dx = p.x - State.drag.x;
      const dy = p.y - State.drag.y;
      if (Math.hypot(dx, dy) > 2) State.drag.moved = true;
      State.drag.x = p.x;
      State.drag.y = p.y;
      if (State.drag.canPan) {
        State.drag.yaw = normDeg(State.drag.yaw - dx * 0.32);
        State.drag.pitch = clamp(State.drag.pitch + dy * 0.11, -32, 32);
      }
    }

    function pointerUp(e) {
      e.preventDefault();
      const p = getPoint(e.changedTouches ? e.changedTouches[0] : e);
      const wasDrag = State.drag.moved;
      const canPan = State.drag.canPan;
      State.press.down = false;
      if (State.screen === "playing" && State.currentScene && State.currentScene.id === "dock" && State.currentScene.data.phase === "fight") {
        State.drag.active = false;
        State.drag.moved = false;
        State.drag.canPan = false;
        return;
      }
      State.drag.active = false;
      State.drag.moved = false;
      State.drag.canPan = false;
      if (wasDrag && canPan) return;
      handleTap(p.x, p.y);
    }

    function handleTap(x, y) {
      if (State.screen === "menu") {
        if (hit(x, y, 86, 290, 188, 48)) requestMotionAndOpenHub();
        else if (hit(x, y, 104, 350, 152, 40)) openHubDesktop();
        return;
      }

      if (State.screen === "hub") {
        if (hit(x, y, 34, 570, 104, 40)) {
          advanceDay();
          saveGame();
          return;
        }
        if (hit(x, y, 148, 570, 92, 40)) {
          State.screen = "menu";
          return;
        }
        const layout = getHubCardLayout();
        for (let i = 0; i < SceneOrder.length; i++) {
          const col = i % layout.cols;
          const row = Math.floor(i / layout.cols);
          const bx = layout.startX + col * (layout.cardW + layout.gapX);
          const by = layout.startY + row * (layout.cardH + layout.gapY);
          if (hit(x, y, bx, by, layout.cardW, layout.cardH)) {
            enterScene(SceneOrder[i]);
            return;
          }
        }
        return;
      }

      if (State.screen === "playing") {
        if (hit(x, y, 16, 584, 64, 34)) {
          leaveScene();
          return;
        }
        if (hit(x, y, 90, 584, 64, 34)) {
          calibrate();
          return;
        }
        if (handleSceneOverlayTap(x, y)) return;
        interactSceneObject(findHover());
        return;
      }

      if (State.screen === "result") {
        if (hit(x, y, 86, 446, 188, 46) && State.result) {
          enterScene(State.result.id);
          return;
        }
        if (hit(x, y, 94, 510, 172, 40)) {
          State.currentScene = null;
          State.result = null;
          State.screen = "hub";
        }
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, (ts - (State.lastTime || ts)) / 1000);
        State.lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    function init() {
      try {
        loadSave();
        window.addEventListener("deviceorientation", onOrientation, true);
        canvas.addEventListener("pointerdown", pointerDown, { passive: false });
        canvas.addEventListener("pointermove", pointerMove, { passive: false });
        canvas.addEventListener("pointerup", pointerUp, { passive: false });
        canvas.addEventListener("pointercancel", pointerUp, { passive: false });
        document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    init();
  })();
  </script>
</body>
</html>
