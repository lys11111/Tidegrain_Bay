<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>晨光小鸡舍</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2e241d;
      color: #fff7df;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }
    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 230, 162, .2), transparent 35%),
        linear-gradient(180deg, #3b2c23, #1d1715);
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      max-width: 100vw;
      max-height: 100vh;
      background: #f5d08f;
      border-radius: 14px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .45);
      touch-action: none;
    }
    @media (max-width: 520px) {
      canvas { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="gameCanvas" width="360" height="640" aria-label="晨光小鸡舍游戏画面"></canvas>
  </div>

  <script>
  (() => {
    "use strict";

    const Config = {
      version: "v1.0",
      W: 360,
      H: 640,
      fov: 100,
      pitchScale: 4.8,
      yawSmoothing: 0.1,
      pitchSmoothing: 0.1,
      gameSeconds: 90,
      errorText: "哎呀，出错了，请重启试试吧~",
      tasks: { hay: 3, pets: 3, eggs: 2 },
      storageKey: "morning-coop-save-v1",
      pitchRange: 55
    };

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const State = {
      screen: "boot",
      sensorMode: "drag",
      desktopSim: false,
      sensorReady: false,
      permissionAsked: false,
      needsCalibration: false,
      holding: null,
      hayLeft: 3,
      feedPlaced: 0,
      eggsCollected: 0,
      petsDone: 0,
      timeLeft: Config.gameSeconds,
      lastTime: 0,
      hoverId: null,
      lastFedId: null,
      toast: "",
      toastTimer: 0,
      resultTitle: "",
      resultBody: "",
      resultGrade: "",
      clearTime: 0,
      collectedEggs: [],
      sessionFriendshipGain: {},
      milestones: {},
      ended: false,
      drag: { active: false, moved: false, canPan: false, x: 0, y: 0, yaw: 0, pitch: 0 },
      orientation: { alpha: 0, beta: 0, gamma: 0, has: false },
      calibration: { alpha: 0, beta: 70 },
      targetLook: { yaw: 0, pitch: 0 },
      look: { yaw: 0, pitch: 0 },
      particles: [],
      floaters: [],
      save: { days: 0, eggs: 0, bestClear: 0, perfectDays: 0, friendship: {}, eggQuality: { normal: 0, silver: 0, gold: 0, rare: 0 }, coins: 0, hayStorage: 10, heatLamp: false },
      objects: []
    };

    const Assets = {
      loaded: false,
      imgs: {},
      frames: {
        idle: ["idle_011", "idle_012"],
        happy: ["happy_017","happy_018","happy_019","happy_020","happy_021","happy_022","happy_023","happy_024","happy_025","happy_026","happy_027","happy_028","happy_029","happy_030","happy_031","happy_032","happy_033","happy_034","happy_035","happy_036","happy_037","happy_038","happy_039"],
        peck: ["peck_040","peck_041","peck_042","peck_043","peck_044","peck_045","peck_046","peck_047","peck_048","peck_049","peck_050","peck_051","peck_052","peck_053","peck_054","peck_055","peck_056","peck_057","peck_058","peck_059","peck_060","peck_061","peck_062","peck_063"],
        dir: ["方向图_000","方向图_001","方向图_002","方向图_003","方向图_004","方向图_005"]
      },
      load() {
        const list = [
          "chicken_white", "chicken_brown", "chicken_yellow",
          "egg_normal", "egg_silver", "egg_gold", "egg_rare",
          "hopper", "trough_empty", "trough_filled"
        ];
        Object.values(Assets.frames).forEach(arr => arr.forEach(name => list.push(`小鸡状态图/${name}`)));
        let count = 0;
        return new Promise(resolve => {
          list.forEach(name => {
            const img = new Image();
            img.onload = () => {
              count++;
              if (count === list.length) {
                Assets.loaded = true;
                resolve();
              }
            };
            img.onerror = () => {
              console.warn(`Failed to load ${name}`);
              count++;
              if (count === list.length) {
                Assets.loaded = true;
                resolve();
              }
            };
            img.src = `assets/${name}.png`;
            Assets.imgs[name] = img;
          });
        });
      }
    };

    const Audio = {
      ctx: null,
      ensure() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      },
      beep(type) {
        try {
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const map = {
            hay: [360, 0.07, "triangle"],
            place: [260, 0.09, "sine"],
            pet: [620, 0.12, "sine"],
            egg: [780, 0.08, "triangle"],
            miss: [150, 0.04, "sawtooth"],
            win: [520, 0.22, "sine"]
          };
          const [freq, dur, wave] = map[type] || map.miss;
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now);
          if (type === "win") osc.frequency.exponentialRampToValueAtTime(880, now + dur);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        } catch (_) {}
      }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function normDeg(v) {
      let n = ((v + 180) % 360 + 360) % 360 - 180;
      return n === -180 ? 180 : n;
    }
    function angleDistance(a, b) { return Math.abs(normDeg(a - b)); }
    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {}
    }
    function safeText(text, x, y, size = 16, color = "#fff7df", align = "center") {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `700 ${size}px system-ui, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(Config.storageKey);
        if (raw) {
          const parsed = JSON.parse(raw);
          State.save = Object.assign(State.save, parsed);
          State.save.bestClear = parsed.bestClear || 0;
          State.save.perfectDays = parsed.perfectDays || 0;
          State.save.friendship = Object.assign({}, State.save.friendship || {}, parsed.friendship || {});
          State.save.eggQuality = Object.assign({ normal: 0, silver: 0, gold: 0, rare: 0 }, parsed.eggQuality || {});
          State.save.coins = parsed.coins || 0;
          State.save.hayStorage = parsed.hayStorage !== undefined ? parsed.hayStorage : 10;
          State.save.heatLamp = parsed.heatLamp || false;
        }
      } catch (_) {}
    }
    function saveGame() {
      try { localStorage.setItem(Config.storageKey, JSON.stringify(State.save)); } catch (_) {}
    }

    function getFriendship(id) {
      return clamp(State.save.friendship[id] || 0, 0, 1000);
    }

    function heartsFromFriendship(value) {
      return clamp(Math.floor(value / 200), 0, 5);
    }

    function getEggQuality() {
      const ids = ["chickA", "chickB", "chickC"];
      const avg = ids.reduce((sum, id) => sum + getFriendship(id), 0) / ids.length;
      const bonus = State.save.heatLamp ? 300 : 0;
      if (avg + bonus >= 900) return { key: "rare", label: "稀有蛋", color: "#d8b4ff", sparkle: "#f3ddff" };
      if (avg + bonus >= 600) return { key: "gold", label: "金星蛋", color: "#ffe07a", sparkle: "#fff3a8" };
      if (avg + bonus >= 200) return { key: "silver", label: "银星蛋", color: "#e7edf4", sparkle: "#ffffff" };
      return { key: "normal", label: "普通蛋", color: "#fff4d2", sparkle: "#ffffff" };
    }

    function resetObjects() {
      State.objects = [
        { id: "hopper", type: "hopper", label: "干草料斗", action: "拿干草", yaw: -58, pitch: -4, angle: 13, state: "ready" },
        { id: "trough1", type: "trough", label: "食槽 1", action: "放干草", yaw: 4, pitch: -18, angle: 13, state: "empty" },
        { id: "trough2", type: "trough", label: "食槽 2", action: "放干草", yaw: 24, pitch: -18, angle: 13, state: "empty" },
        { id: "trough3", type: "trough", label: "食槽 3", action: "放干草", yaw: 44, pitch: -18, angle: 13, state: "empty" },
        { id: "chickA", type: "chicken", label: "米粒", action: "摸摸", yaw: -24, baseYaw: -24, pitch: -24, angle: 17, state: "idle", color: "#fff6d7", pet: false, bob: 0, wander: 0, animState: "idle", animFrame: 0, animTimer: 0, dirFrame: 0 },
        { id: "chickB", type: "chicken", label: "栗栗", action: "摸摸", yaw: 64, baseYaw: 64, pitch: -22, angle: 17, state: "idle", color: "#c98242", pet: false, bob: 1.7, wander: 1.2, animState: "idle", animFrame: 0, animTimer: 0, dirFrame: 0 },
        { id: "chickC", type: "chicken", label: "小葵", action: "摸摸", yaw: -84, baseYaw: -84, pitch: -25, angle: 17, state: "idle", color: "#ffd85e", pet: false, bob: 3.1, wander: 2.4, animState: "idle", animFrame: 0, animTimer: 0, dirFrame: 0 },
        { id: "egg1", type: "egg", label: getEggQuality().label, action: "拾取", yaw: -42, pitch: -36, angle: 15, state: "onGround", quality: getEggQuality() },
        { id: "egg2", type: "egg", label: getEggQuality().label, action: "拾取", yaw: 88, pitch: -35, angle: 15, state: "onGround", quality: getEggQuality() }
      ];
    }

    function startGame() {
      Audio.ensure();
      resetObjects();
      State.screen = "playing";
      State.holding = null;
      State.hayLeft = Config.tasks.hay;
      State.feedPlaced = 0;
      State.lastFedId = null;
      State.eggsCollected = 0;
      State.petsDone = 0;
      State.timeLeft = Config.gameSeconds;
      State.resultTitle = "";
      State.resultBody = "";
      State.resultGrade = "";
      State.clearTime = 0;
      State.collectedEggs = [];
      State.sessionFriendshipGain = {};
      State.milestones = {};
      State.sessionCoins = 0;
      State.ended = false;
      State.toast = "转动手机，也可按住画面拖动视角";
      State.toastTimer = 2.2;
      State.particles.length = 0;
      State.floaters.length = 0;
    }

    async function requestMotionAndStart() {
      try {
        Audio.ensure();
        State.permissionAsked = true;
        const DOE = window.DeviceOrientationEvent;
        if (DOE && typeof DOE.requestPermission === "function") {
          const res = await DOE.requestPermission();
          if (res === "granted") {
            State.sensorMode = "gyro";
            State.sensorReady = true;
          } else {
            State.sensorMode = "drag";
            State.toast = "已切换为拖动视角";
            State.toastTimer = 2;
          }
        } else if (DOE) {
          State.sensorMode = "gyro";
          State.sensorReady = true;
        } else {
          State.sensorMode = "drag";
          State.desktopSim = true;
        }
        State.screen = "calibrate";
      } catch (_) {
        State.sensorMode = "drag";
        State.desktopSim = true;
        State.screen = "calibrate";
      }
    }

    function calibrate() {
      State.calibration.alpha = State.orientation.has ? State.orientation.alpha : 0;
      State.calibration.beta = State.orientation.has ? State.orientation.beta : 70;
      State.drag.yaw = 0;
      State.drag.pitch = 0;
      State.targetLook.yaw = 0;
      State.targetLook.pitch = 0;
      State.look.yaw = 0;
      State.look.pitch = 0;
    }

    function endGame(auto) {
      if (State.ended) return;
      State.ended = true;
      const completed = State.feedPlaced + State.petsDone + State.eggsCollected;
      const perfect = completed >= 8;
      State.clearTime = Math.max(0, Math.round(Config.gameSeconds - State.timeLeft));
      State.resultGrade = getResultGrade(completed, State.timeLeft);
      State.screen = "nextday";
      State.save.days += 1;
      State.save.eggs += State.eggsCollected;
      if (perfect) {
        State.save.perfectDays = (State.save.perfectDays || 0) + 1;
        if (!State.save.bestClear || State.clearTime < State.save.bestClear) State.save.bestClear = State.clearTime;
      }
      for (const egg of State.collectedEggs) {
        State.save.eggQuality[egg.key] = (State.save.eggQuality[egg.key] || 0) + 1;
      }
      for (const o of State.objects) {
        let gain = 0;
        if (o.type === "chicken" && o.pet) {
          gain += 15;
        }
        if (o.type === "chicken" && State.feedPlaced >= Config.tasks.hay) {
          gain += 8;
        }
        if (o.type === "chicken" && completed >= 8) {
          gain += 5;
        }
        if (o.type === "chicken" && gain > 0) {
          State.save.friendship[o.id] = clamp((State.save.friendship[o.id] || 0) + gain, 0, 1000);
          State.sessionFriendshipGain[o.id] = gain;
        }
      }
      const priceMap = { normal: 10, silver: 20, gold: 50, rare: 100 };
      State.sessionCoins = 0;
      for (const egg of State.collectedEggs) {
        State.sessionCoins += priceMap[egg.key] || 10;
      }
      State.save.coins += State.sessionCoins;
      saveGame();
      if (perfect) {
        State.resultTitle = "今天的小鸡都吃饱啦";
        State.resultBody = `评分 ${State.resultGrade} · 用时 ${State.clearTime}s · 赚取 ${State.sessionCoins} 金币`;
        Audio.beep("win");
      } else if (auto) {
        State.resultTitle = "还有小鸡在等你";
        State.resultBody = `评分 ${State.resultGrade} · 完成度 ${completed}/8 · 赚取 ${State.sessionCoins} 金币`;
      } else {
        State.resultTitle = "今日照料暂停";
        State.resultBody = `评分 ${State.resultGrade} · 完成度 ${completed}/8 · 赚取 ${State.sessionCoins} 金币`;
      }
    }

    function getResultGrade(completed, timeLeft) {
      if (completed >= 8 && timeLeft >= 35) return "S";
      if (completed >= 8) return "A";
      if (completed >= 6) return "B";
      if (completed >= 3) return "C";
      return "D";
    }

    function formatEggSummary() {
      if (!State.collectedEggs.length) return "0/2";
      const counts = {};
      for (const egg of State.collectedEggs) counts[egg.label] = (counts[egg.label] || 0) + 1;
      return Object.entries(counts).map(([label, count]) => `${label}x${count}`).join("、");
    }

    function onOrientation(e) {
      State.orientation.alpha = e.alpha || 0;
      State.orientation.beta = e.beta || 0;
      State.orientation.gamma = e.gamma || 0;
      State.orientation.has = true;
      if (State.sensorReady) State.sensorMode = "gyro";
    }

    function updateLook() {
      if (State.sensorMode === "gyro" && State.orientation.has && !State.desktopSim) {
        State.targetLook.yaw = normDeg(State.orientation.alpha - State.calibration.alpha + State.drag.yaw);
        State.targetLook.pitch = clamp((State.orientation.beta - State.calibration.beta) * 0.7 + State.drag.pitch, -Config.pitchRange, Config.pitchRange);
      } else {
        State.targetLook.yaw = normDeg(State.drag.yaw);
        State.targetLook.pitch = clamp(State.drag.pitch, -Config.pitchRange, Config.pitchRange);
      }
      State.look.yaw = normDeg(State.look.yaw + normDeg(State.targetLook.yaw - State.look.yaw) * Config.yawSmoothing);
      State.look.pitch += (State.targetLook.pitch - State.look.pitch) * Config.pitchSmoothing;
    }

    function project(obj) {
      const dx = normDeg(obj.yaw - State.look.yaw);
      if (Math.abs(dx) > Config.fov / 2 + 20) return null;
      const x = Config.W / 2 + (dx / (Config.fov / 2)) * (Config.W / 2);
      const y = 330 - (obj.pitch - State.look.pitch) * Config.pitchScale;
      const scale = clamp(1 - Math.abs(dx) / 130, 0.55, 1.15);
      return { x, y, scale, dx };
    }

    function findHover() {
      let best = null;
      let bestScore = Infinity;
      for (const obj of State.objects) {
        if ((obj.type === "egg" && obj.state === "collected") || (obj.type === "trough" && obj.state === "filled")) continue;
        const dy = Math.abs(obj.pitch - State.look.pitch);
        const dist = Math.hypot(angleDistance(obj.yaw, State.look.yaw), dy * 1.4);
        if (dist < obj.angle && dist < bestScore) {
          best = obj;
          bestScore = dist;
        }
      }
      State.hoverId = best ? best.id : null;
      return best;
    }

    function getNextObjective() {
      if (State.holding !== "hay" && State.feedPlaced < Config.tasks.hay && State.hayLeft > 0) {
        const hopper = State.objects.find(o => o.type === "hopper");
        return hopper ? { obj: hopper, text: "先看向料斗，拿一束干草" } : null;
      }
      if (State.holding === "hay") {
        const trough = State.objects.find(o => o.type === "trough" && o.state === "empty");
        return trough ? { obj: trough, text: "看向空食槽，把干草放好" } : null;
      }
      const chicken = State.objects.find(o => o.type === "chicken" && !o.pet);
      if (chicken) return { obj: chicken, text: `找到 ${chicken.label}，轻轻摸摸它` };
      const egg = State.objects.find(o => o.type === "egg" && o.state !== "collected");
      if (egg) return { obj: egg, text: "地上还有鸡蛋可以拾取" };
      return null;
    }

    function findObjectAtScreen(tx, ty) {
      let best = null;
      let bestDist = Infinity;
      const tapRadius = 36;
      for (const obj of State.objects) {
        if ((obj.type === "egg" && obj.state === "collected") || (obj.type === "trough" && obj.state === "filled")) continue;
        const p = project(obj);
        if (!p) continue;
        const dist = Math.hypot(p.x - tx, p.y - ty);
        if (dist < tapRadius && dist < bestDist) {
          best = obj;
          bestDist = dist;
        }
      }
      return best;
    }

    function interact(tx, ty) {
      if (State.screen !== "playing") return;
      const obj = findObjectAtScreen(tx, ty);
      if (!obj) {
        Audio.beep("miss");
        return;
      }
      if (obj.type === "hopper") {
        if (State.holding === "hay") {
          State.toast = "手里已经有干草了";
          State.toastTimer = 1;
          return;
        }
        if (State.save.hayStorage <= 0) {
          State.toast = "干草耗尽，请去商店购买";
          State.toastTimer = 1.5;
          return;
        }
        State.save.hayStorage -= 1;
        State.holding = "hay";
        addFloater("手持干草", tx, ty - 20, "#ffe9a8");
        Audio.beep("hay");
        vibrate(25);
      } else if (obj.type === "trough") {
        if (State.holding !== "hay") {
          State.toast = "先去料斗拿干草";
          State.toastTimer = 1.2;
          Audio.beep("miss");
          return;
        }
        obj.state = "filled";
        obj.filledAt = performance.now();
        State.holding = null;
        State.feedPlaced += 1;
        State.lastFedId = obj.id;
        State.toast = "干草放好啦";
        State.toastTimer = 1;
        Audio.beep("place");
        vibrate(35);
        nudgeChickenToEat();
        sparkle(tx, ty - 8);
        checkMilestones();
      } else if (obj.type === "chicken") {
        if (!obj.pet) {
          obj.pet = true;
          obj.state = "happy";
          obj.happyTimer = 4.5;
          State.petsDone += 1;
          checkMilestones();
          burstHearts(tx, ty - 36, obj.color);
          addFloater("+好感", tx, ty - 64, "#ff7aa8");
          Audio.beep("pet");
          vibrate([20, 20, 30]);
        } else {
          State.toast = `${obj.label} 已经被摸摸过啦`;
          State.toastTimer = 1.1;
          Audio.beep("hay");
        }
      } else if (obj.type === "egg") {
        obj.state = "collected";
        State.eggsCollected += 1;
        State.collectedEggs.push(obj.quality);
        checkMilestones();
        addFloater(`+1 ${obj.quality.label}`, tx, ty - 28, obj.quality.sparkle);
        sparkle(tx, ty);
        Audio.beep("egg");
        vibrate(25);
      }
      if (State.feedPlaced >= 3 && State.petsDone >= 3 && State.eggsCollected >= 2) {
        setTimeout(() => endGame(false), 550);
      }
    }

    function checkMilestones() {
      const marks = [
        ["fed", State.feedPlaced >= Config.tasks.hay, "三格食槽都放好啦"],
        ["pet", State.petsDone >= Config.tasks.pets, "三只小鸡都开心啦"],
        ["egg", State.eggsCollected >= Config.tasks.eggs, "今天的鸡蛋收齐啦"]
      ];
      for (const [key, done, text] of marks) {
        if (done && !State.milestones[key]) {
          State.milestones[key] = true;
          State.toast = text;
          State.toastTimer = 1.6;
          sparkle(Config.W / 2, 210);
          return;
        }
      }
    }

    function nudgeChickenToEat() {
      const hungry = State.objects
        .filter(o => o.type === "chicken" && o.state !== "happy")
        .sort((a, b) => Math.abs(normDeg(a.yaw - State.look.yaw)) - Math.abs(normDeg(b.yaw - State.look.yaw)));
      const chick = hungry[0];
      if (chick) {
        chick.state = "eat";
        chick.eatTimer = 3.8;
        State.toast = `${chick.label} 听见干草声，跑去吃饭啦`;
        State.toastTimer = 1.8;
      }
    }

    function burstHearts(x, y) {
      for (let i = 0; i < 10; i++) {
        State.particles.push({
          type: "heart",
          x, y,
          vx: (Math.random() - 0.5) * 55,
          vy: -40 - Math.random() * 45,
          life: 0.85 + Math.random() * 0.35,
          max: 1.2,

    function update(dt) {
      updateLook();
      if (State.screen === "playing") {
        State.timeLeft -= dt;
        if (State.timeLeft <= 0) {
          State.timeLeft = 0;
          endGame(true);
        }
        for (const o of State.objects) {
          if (o.type === "chicken") {
            o.bob += dt * 3;
            o.wander += dt;
            const fpsMap = { idle: 1.5, happy: 8, peck: 10, dir: 4 };
            const fps = fpsMap[o.animState] || 4;
            o.animTimer += dt;
            const interval = 1 / fps;
            if (o.animTimer >= interval) {
              o.animTimer -= interval;
              const frames = Assets.frames[o.animState] || Assets.frames.idle;
              o.animFrame = (o.animFrame + 1) % frames.length;
            }
            o.dirFrame = Math.floor((Math.sin(o.wander * 0.5) + 1) * 3) % 6;
            if (o.state === "eat") {
              o.eatTimer = Math.max(0, (o.eatTimer || 0) - dt);
              o.animState = "peck";
              if (o.eatTimer <= 0) {
                o.state = o.pet ? "happy" : "idle";
                o.animState = o.state;
                o.animFrame = 0;
                o.animTimer = 0;
              }
            } else if (o.state === "happy") {
              o.happyTimer = Math.max(0, (o.happyTimer || 0) - dt);
              o.animState = "happy";
              if (o.happyTimer <= 0) {
                o.state = "idle";
                o.animState = "idle";
                o.animFrame = 0;
                o.animTimer = 0;
              }
            } else if (o.animState !== "peck") {
              o.animState = "idle";
            }
            if (o.state === "happy" && Math.random() < dt * 0.55) {
              const p = project(o);
              if (p) burstHearts(p.x, p.y - 35);
            }
          }
        }
      }
      for (let i = State.particles.length - 1; i >= 0; i--) {
        const p = State.particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 45 * dt;
        if (p.life <= 0) State.particles.splice(i, 1);
      }
      for (let i = State.floaters.length - 1; i >= 0; i--) {
        const f = State.floaters[i];
        f.life -= dt;
        f.y -= 24 * dt;
        if (f.life <= 0) State.floaters.splice(i, 1);
      }
      if (State.toastTimer > 0) State.toastTimer -= dt;
    }

    function drawObjectiveGuide() {
      const next = getNextObjective();
      if (!next || State.hoverId === next.obj.id) return;
      const obj = next.obj;
      const delta = normDeg(obj.yaw - State.look.yaw);
      const offscreen = Math.abs(delta) > Config.fov / 2 - 8;
      const yDelta = obj.pitch - State.look.pitch;

      ctx.save();
      ctx.fillStyle = "rgba(64, 39, 27, .68)";
      roundRect(38, 112, 284, 30, 11, true);
      safeText(next.text, 180, 127, 12, "#fff1c2");

      if (offscreen) {
        const left = delta < 0;
        const x = left ? 28 : 332;
        const y = 320;
        ctx.fillStyle = "rgba(255, 232, 159, .92)";
        ctx.beginPath();
        if (left) {
          ctx.moveTo(x - 12, y);
          ctx.lineTo(x + 10, y - 16);
          ctx.lineTo(x + 10, y + 16);
        } else {
          ctx.moveTo(x + 12, y);
          ctx.lineTo(x - 10, y - 16);
          ctx.lineTo(x - 10, y + 16);
        }
        ctx.closePath();
        ctx.fill();
      } else if (Math.abs(yDelta) > 8) {
        const x = Config.W / 2 + (delta / (Config.fov / 2)) * (Config.W / 2);
        const y = yDelta > 0 ? 168 : 486;
        ctx.fillStyle = "rgba(255, 232, 159, .92)";
        ctx.beginPath();
        if (yDelta > 0) {
          ctx.moveTo(x, y - 13);
          ctx.lineTo(x - 13, y + 10);
          ctx.lineTo(x + 13, y + 10);
        } else {
          ctx.moveTo(x, y + 13);
          ctx.lineTo(x - 13, y - 10);
          ctx.lineTo(x + 13, y - 10);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

      ctx.fillRect(0, 0, Config.W, Config.H);
      ctx.fillStyle = "rgba(255, 239, 197, .96)";
      roundRect(32, 88, 296, 380, 18, true);
      const dayNum = State.save.days;
      safeText(`第 ${dayNum} 天完成`, 180, 140, 26, "#604026");
      safeText(State.resultTitle || "今日照料完成", 180, 178, 18, "#765238");
      safeText(State.resultBody || "", 180, 212, 13, "#9a6a3c");
      ctx.fillStyle = "rgba(180, 140, 90, .25)";
      roundRect(50, 230, 260, 110, 12, true);
      safeText(`本局好感`, 180, 252, 12, "#9a6a3c");
      safeText(`米粒 +${State.sessionFriendshipGain.chickA || 0} · 栗栗 +${State.sessionFriendshipGain.chickB || 0} · 小葵 +${State.sessionFriendshipGain.chickC || 0}`, 180, 275, 12, "#765238");
      safeText(`累计鸡蛋`, 180, 300, 12, "#9a6a3c");
      safeText(`普通 ${State.save.eggQuality.normal || 0} · 银 ${State.save.eggQuality.silver || 0} · 金 ${State.save.eggQuality.gold || 0} · 稀有 ${State.save.eggQuality.rare || 0}`, 180, 323, 12, "#765238");
      safeText(`已照料天数：${State.save.days} · 累计鸡蛋：${State.save.eggs}`, 180, 358, 12, "#9a6a3c");
      safeText("明天也来看看它们吧", 180, 400, 14, "#9a6a3c");
      drawButton(86, 440, 188, 48, "开始新的一天", true);
      drawButton(104, 506, 152, 40, "返回菜单");
    }

    function newGame() {
      State.save.days = 0;
      State.save.eggs = 0;
      State.save.bestClear = 0;
      State.save.perfectDays = 0;
      State.save.friendship = {};
      State.save.eggQuality = { normal: 0, silver: 0, gold: 0, rare: 0 };
      State.save.coins = 0;
      State.save.hayStorage = 10;
      State.save.heatLamp = false;
      saveGame();
    }

    function drawResult() {
      drawBackground();
      ctx.fillStyle = "rgba(47, 31, 23, .62)";
      ctx.fillRect(0, 0, Config.W, Config.H);
      ctx.fillStyle = "rgba(255, 239, 197, .94)";
      roundRect(32, 118, 296, 330, 18, true);
      safeText(State.resultTitle || "今日照料完成", 180, 176, 22, "#604026");
      safeText(State.resultBody || "", 180, 218, 13, "#765238");
      safeText(`最佳完成：${formatBestClear()} · 完美日 ${State.save.perfectDays || 0}`, 180, 242, 12, "#9a6a3c");
      safeText(`本局好感：米粒 +${State.sessionFriendshipGain.chickA || 0} · 栗栗 +${State.sessionFriendshipGain.chickB || 0} · 小葵 +${State.sessionFriendshipGain.chickC || 0}`, 180, 266, 12, "#765238");
      safeText(`累计：普通 ${State.save.eggQuality.normal || 0} · 银 ${State.save.eggQuality.silver || 0} · 金 ${State.save.eggQuality.gold || 0} · 稀有 ${State.save.eggQuality.rare || 0}`, 180, 296, 12, "#765238");
      safeText(`已照料天数：${State.save.days} · 累计鸡蛋：${State.save.eggs}`, 180, 326, 12, "#765238");
      safeText("明天也来看看它们吧", 180, 366, 14, "#9a6a3c");
      drawButton("再照料一次", 86, 482, 188, 48, true);
      drawButton("返回菜单", 104, 548, 152, 40);
    }

    function formatBestClear() {
      return State.save.bestClear ? `${State.save.bestClear}s` : "--";
    }

    function drawError(msg) {
      ctx.fillStyle = "#2f211b";
      ctx.fillRect(0, 0, Config.W, Config.H);
      safeText(msg || Config.errorText, 180, 310, 16, "#fff5d2");
    }

    function drawButton(text, x, y, w, h, primary = false) {
      ctx.fillStyle = primary ? "#f0b45e" : "rgba(255, 235, 190, .18)";
      ctx.strokeStyle = primary ? "#ffe4a7" : "rgba(255, 235, 190, .46)";
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 12, true, true);
      safeText(text, x + w / 2, y + h / 2, primary ? 17 : 14, primary ? "#533420" : "#fff2ca");
    }

    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, Config.W, Config.H);
      if (State.screen === "boot") drawBoot();
      else if (State.screen === "permission") drawPermission();
      else if (State.screen === "calibrate") drawCalibrate();
      else if (State.screen === "menu") drawMenu();
      else if (State.screen === "shop") drawShop();
      else if (State.screen === "playing") {
        drawBackground();
        drawObjects();
        drawParticles();
        drawHud();
        drawToast();
      } else if (State.screen === "nextday") drawNextDay();
      else if (State.screen === "result") drawResult();
      else drawError();
    }

    function getPoint(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * Config.W / r.width,
        y: (t.clientY - r.top) * Config.H / r.height
      };
    }

    function hit(x, y, bx, by, bw, bh) {
      return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
    }

    function pointerDown(e) {
      e.preventDefault();
      Audio.ensure();
      const p = getPoint(e);
      State.drag.active = true;
      State.drag.moved = false;
      State.drag.canPan = State.screen === "playing" && !isPlayingControl(p.x, p.y);
      State.drag.x = p.x;
      State.drag.y = p.y;
    }

    function pointerMove(e) {
      if (!State.drag.active) return;
      e.preventDefault();
      const p = getPoint(e);
      const dx = p.x - State.drag.x;
      const dy = p.y - State.drag.y;
      if (Math.hypot(dx, dy) > 2) State.drag.moved = true;
      State.drag.x = p.x;
      State.drag.y = p.y;
      if (State.drag.canPan) {
        State.drag.yaw = normDeg(State.drag.yaw - dx * 0.32);
        State.drag.pitch = clamp(State.drag.pitch + dy * 0.11, -Config.pitchRange, Config.pitchRange);
      }
    }

    function pointerUp(e) {
      e.preventDefault();
      const p = getPoint(e.changedTouches ? e.changedTouches[0] : e);
      const wasDrag = State.drag.moved;
      const canPan = State.drag.canPan;
      State.drag.active = false;
      State.drag.moved = false;
      State.drag.canPan = false;
      if (wasDrag && canPan) return;
      handleTap(p.x, p.y);
    }

    function isPlayingControl(x, y) {
      return hit(x, y, 16, 584, 64, 34) || hit(x, y, 90, 584, 64, 34);
    }

    function handleTap(x, y) {
      if (State.screen === "permission") {
        requestMotionAndStart();
      } else if (State.screen === "calibrate") {
        calibrate();
        startGame();
      } else if (State.screen === "menu") {
        if (hit(x, y, 86, 282, 188, 48)) {
          if (State.permissionAsked) {
            State.screen = "calibrate";
          } else {
            requestMotionAndStart();
          }
        }
        else if (hit(x, y, 86, 346, 188, 48)) State.screen = "shop";
        else if (hit(x, y, 86, 410, 188, 40)) {
          newGame();
          State.permissionAsked = false;
          State.sensorMode = "drag";
          State.sensorReady = false;
          State.desktopSim = false;
          State.screen = "permission";
        } else if (hit(x, y, 104, 468, 152, 40)) {
          State.sensorMode = "drag";
          State.sensorReady = false;
          State.desktopSim = true;
          State.screen = "calibrate";
        }
      } else if (State.screen === "shop") {
        if (hit(x, y, 50, 200, 260, 60)) {
          if (State.save.coins >= 50) {
            State.save.coins -= 50;
            State.save.hayStorage += 10;
            saveGame();
            Audio.beep("pet");
          } else { Audio.beep("miss"); }
        } else if (hit(x, y, 50, 320, 260, 60) && !State.save.heatLamp) {
          if (State.save.coins >= 500) {
            State.save.coins -= 500;
            State.save.heatLamp = true;
            saveGame();
            Audio.beep("win");
          } else { Audio.beep("miss"); }
        } else if (hit(x, y, 104, 480, 152, 40)) {
          State.screen = "menu";
        }
      } else if (State.screen === "playing") {
        if (hit(x, y, 16, 584, 64, 34)) calibrate();
        else if (hit(x, y, 90, 584, 64, 34)) endGame(false);
        else interact(x, y);
      } else if (State.screen === "nextday") {
        if (hit(x, y, 86, 440, 188, 48)) {
          State.screen = "calibrate";
        } else if (hit(x, y, 104, 506, 152, 40)) {
          State.screen = "menu";
        }
      } else if (State.screen === "result") {
        if (hit(x, y, 86, 482, 188, 48)) startGame();
        else if (hit(x, y, 104, 548, 152, 40)) State.screen = "menu";
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, (ts - (State.lastTime || ts)) / 1000);
        State.lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    function init() {
      try {
        loadSave();
        resetObjects();
        window.addEventListener("deviceorientation", onOrientation, true);
        canvas.addEventListener("pointerdown", pointerDown, { passive: false });
        canvas.addEventListener("pointermove", pointerMove, { passive: false });
        canvas.addEventListener("pointerup", pointerUp, { passive: false });
        canvas.addEventListener("pointercancel", pointerUp, { passive: false });
        document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
        Assets.load().then(() => {
          requestAnimationFrame(loop);
        });
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    init();
  })();
  </script>
</body>
</html>
