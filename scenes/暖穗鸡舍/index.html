<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>穗潮湾场景原型集</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #211a16;
      color: #fff6de;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }
    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 223, 165, 0.18), transparent 36%),
        linear-gradient(180deg, #35281f, #15110f);
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      background: #142027;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #worldCanvas { pointer-events: none; }
    #hudCanvas { background: transparent; }
    @media (max-width: 520px) {
      #stage { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="worldCanvas" width="360" height="640" aria-hidden="true"></canvas>
      <canvas id="hudCanvas" width="360" height="640" aria-label="穗潮湾场景原型集"></canvas>
    </div>
  </div>

  <script src="./js/three.min.js"></script>
  <script>
  (() => {
    "use strict";

    const Config = {
      version: "v2.1",
      W: 360,
      H: 640,
      fov: 98,
      pitchScale: 5.3,
      staminaMax: 100,
      errorText: "哎呀，出错了，请重启试试吧~",
      storageKey: "tidegrain-bay-multi-scene-v1",
      input: {
        hoverEnterAngle: 12,
        hoverExitAngle: 9,
        hoverLockMs: 150,
        edgeHintAngle: 18,
        stationaryFrameCount: 18,
        fastTurnThreshold: 2.4,
        idleDeadzoneYaw: 0.7,
        idleDeadzonePitch: 0.45,
        moveDeadzoneYaw: 0.3,
        moveDeadzonePitch: 0.2,
        idleSmoothing: 0.10,
        moveSmoothing: 0.18,
        fastTurnSmoothing: 0.32,
        dragThresholdPx: 2,
        dragYawScale: 0.32,
        dragPitchScale: 0.11
      },
      depthWeight: { far: 0, mid: 1, near: 2, fx: 3 }
    };

    const SceneOrder = ["coop", "dock", "orchard", "market"];
    const SceneMeta = {
      coop: { name: "暖穗鸡舍", en: "WarmSheaf Coop", core: "投喂、抚摸、拾蛋", color: "#efbd70", duration: 80 },
      dock: { name: "听潮码头", en: "Tidewharf Dock", core: "听音、抛竿、拉扯", color: "#6dc5dd", duration: 82 },
      orchard: { name: "风磨果园", en: "Windmill Orchard", core: "摇树、分拣、压榨", color: "#f29d63", duration: 80 },
      market: { name: "暮灯集市", en: "Dusklantern Market", core: "浏览、交付、变现", color: "#c18dff", duration: 80 }
    };

    const InventoryLabels = {
      egg: "鸡蛋",
      silverEgg: "银星蛋",
      fish: "鲜鱼",
      shell: "贝壳",
      berry: "鲜果",
      jam: "果酱",
      honey: "蜂蜜"
    };

    const OrderDefs = [
      { id: "egg_pair", title: "早餐篮", needs: { egg: 2 }, gold: 90, rep: 1 },
      { id: "silver_show", title: "银星展示", needs: { silverEgg: 1 }, gold: 120, rep: 1 },
      { id: "dock_pair", title: "海风拼盘", needs: { fish: 1, shell: 1 }, gold: 125, rep: 1 },
      { id: "sweet_jar", title: "甜味订单", needs: { jam: 1 }, gold: 150, rep: 2 },
      { id: "orchard_box", title: "果篮补货", needs: { berry: 2 }, gold: 96, rep: 1 },
      { id: "honey_gift", title: "蜂蜜伴手礼", needs: { honey: 1 }, gold: 138, rep: 2 }
    ];

    const ChickenArt = {
      basePath: "./assets/chicken2p5d/",
      idle: {
        front: "idle_front.png",
        back: "idle_back.png",
        frontRight: "idle_front_right.png",
        frontLeft: "idle_front_left.png",
        backRight: "idle_back_right.png",
        backLeft: "idle_back_left.png"
      },
      happy: {
        side: "happy_side.png"
      },
      peck: {
        up: "peck_side_up.png",
        down: "peck_side_down.png"
      }
    };

    const SceneBackdrops = {
      coop: { bg: 0xd9b788, fog: 0xc69b6d, density: 0.034 },
      dock: { bg: 0x8cb7cf, fog: 0x7ea9c0, density: 0.038 },
      orchard: { bg: 0xc9e3a5, fog: 0xb6d68a, density: 0.03 },
      market: { bg: 0x7f6f97, fog: 0x755f8a, density: 0.045 }
    };

    const ScenePanoramas = {
      coop: {
        pathLarge: "./assets/panoramas/coop-360-4096.jpg",
        pathSmall: "./assets/panoramas/coop-360-2048.jpg",
        radius: 34,
        rotationY: 0
      }
    };

    const worldCanvas = document.getElementById("worldCanvas");
    const canvas = document.getElementById("hudCanvas");
    const ctx = canvas.getContext("2d");

    function defaultSave() {
      return {
        day: 1,
        gold: 120,
        stamina: Config.staminaMax,
        rep: 0,
        weather: "晴",
        friendship: { chickA: 0, chickB: 0, chickC: 0 },
        inventory: {
          egg: 0,
          silverEgg: 0,
          fish: 0,
          shell: 0,
          berry: 0,
          jam: 0,
          honey: 0
        },
        marketOrders: [],
        sceneBest: {},
        sceneClears: {}
      };
    }

    const State = {
      screen: "menu",
      sensorMode: "drag",
      desktopSim: false,
      sensorReady: false,
      needsCalibration: false,
      permissionAsked: false,
      lastTime: 0,
      hoverId: null,
      hoverLockUntil: 0,
      edgeHintId: null,
      toast: "",
      toastTimer: 0,
      result: null,
      currentScene: null,
      drag: { active: false, moved: false, canPan: false, x: 0, y: 0, yaw: 0, pitch: 0 },
      press: { down: false },
      orientation: { alpha: 0, beta: 0, gamma: 0, has: false },
      screenAngle: 0,
      calibration: { alpha: 0, beta: 70 },
      targetLook: { yaw: 0, pitch: 0 },
      lastTargetLook: { yaw: 0, pitch: 0 },
      look: { yaw: 0, pitch: 0 },
      motion: { stationaryFrames: 0, isStationary: false, lastTurnSpeed: 0 },
      particles: [],
      floaters: [],
      save: defaultSave()
    };

    const Audio = {
      ctx: null,
      ensure() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      },
      beep(type) {
        try {
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const map = {
            pickup: [340, 0.08, "triangle"],
            place: [250, 0.1, "sine"],
            good: [620, 0.12, "sine"],
            harvest: [780, 0.09, "triangle"],
            coin: [560, 0.14, "square"],
            miss: [150, 0.05, "sawtooth"],
            bite: [920, 0.08, "triangle"],
            win: [460, 0.24, "sine"]
          };
          const entry = map[type] || map.miss;
          osc.type = entry[2];
          osc.frequency.setValueAtTime(entry[0], now);
          if (type === "win" || type === "coin") osc.frequency.exponentialRampToValueAtTime(entry[0] * 1.5, now + entry[1]);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + entry[1]);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + entry[1] + 0.02);
        } catch (_) {}
      }
    };

    const World = {
      ready: false,
      renderer: null,
      scene: null,
      camera: null,
      root: null,
      objectMap: new Map(),
      textureLoader: null,
      textureCache: new Map(),
      shadowTexture: null,
      panoramaMesh: null,
      scratchWorld: null,
      scratchCam: null,
      scratchDistance: null,
      currentSceneId: "",
      sceneView: {
        coop: { fov: 51, cameraHeight: 1.46, fog: 0.066 },
        dock: { fov: 54, cameraHeight: 1.58, fog: 0.042 },
        orchard: { fov: 57, cameraHeight: 1.56, fog: 0.03 },
        market: { fov: 56, cameraHeight: 1.58, fog: 0.045 }
      },
      init() {
        if (!window.THREE) throw new Error("THREE not loaded");
        this.renderer = new THREE.WebGLRenderer({ canvas: worldCanvas, antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setSize(Config.W, Config.H, false);
        this.textureLoader = new THREE.TextureLoader();
        if ("outputColorSpace" in this.renderer && THREE.SRGBColorSpace) {
          this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        }
        this.renderer.setClearColor(0x000000, 0);

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(56, Config.W / Config.H, 0.1, 80);
        this.camera.rotation.order = "YXZ";
        this.camera.position.set(0, 1.58, 0);

        const hemi = new THREE.HemisphereLight(0xfff0d0, 0x574333, 1.55);
        hemi.position.set(0, 10, 0);
        this.scene.add(hemi);

        const key = new THREE.DirectionalLight(0xfff5dd, 1.25);
        key.position.set(4, 9, 3);
        this.scene.add(key);

        this.root = new THREE.Group();
        this.scene.add(this.root);
        this.scratchWorld = new THREE.Vector3();
        this.scratchCam = new THREE.Vector3();
        this.scratchDistance = new THREE.Vector3();
        this.ready = true;
        worldCanvas.style.opacity = "0";
      },
      setActive(active) {
        worldCanvas.style.opacity = active && this.ready ? "1" : "0";
      },
      unloadScene() {
        if (!this.ready) return;
        while (this.root.children.length) this.root.remove(this.root.children[0]);
        this.objectMap.clear();
        this.panoramaMesh = null;
        this.currentSceneId = "";
      },
      getView(sceneId) {
        return this.sceneView[sceneId] || this.sceneView.coop;
      },
      loadScene(sceneData) {
        if (!this.ready || !sceneData) return;
        this.unloadScene();
        this.currentSceneId = sceneData.id;
        const view = this.getView(sceneData.id);
        this.camera.fov = view.fov;
        this.camera.position.y = view.cameraHeight;
        this.camera.updateProjectionMatrix();
        this.applySceneBackdrop(sceneData.id);
        try {
          this.buildSceneEnvironment(sceneData.id);
          for (const obj of sceneData.objects) {
            const mesh = this.createObjectMesh(obj);
            if (!mesh) continue;
            mesh.userData.objId = obj.id;
            this.root.add(mesh);
            this.objectMap.set(obj.id, mesh);
            this.syncObjectTransform(obj, mesh);
          }
        } catch (err) {
          console.warn("Scene build failed, falling back to base coop environment.", err);
          this.unloadScene();
          this.currentSceneId = sceneData.id;
          this.scene.background = new THREE.Color((SceneBackdrops[sceneData.id] || SceneBackdrops.coop).bg);
          this.buildSceneEnvironment(sceneData.id, true);
          for (const obj of sceneData.objects) {
            const mesh = this.createObjectMesh(obj);
            if (!mesh) continue;
            mesh.userData.objId = obj.id;
            this.root.add(mesh);
            this.objectMap.set(obj.id, mesh);
            this.syncObjectTransform(obj, mesh);
          }
        }
      },
      applySceneBackdrop(sceneId) {
        const entry = SceneBackdrops[sceneId] || SceneBackdrops.coop;
        const view = this.getView(sceneId);
        this.scene.background = new THREE.Color(entry.bg);
        this.scene.fog = new THREE.FogExp2(entry.fog, view.fog || entry.density);
      },
      mat(color, roughness = 0.88, metalness = 0.06, emissive = 0x000000, emissiveIntensity = 0) {
        return new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, emissiveIntensity });
      },
      addMesh(group, geometry, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.rotation.set(rx, ry, rz);
        mesh.scale.set(sx, sy, sz);
        group.add(mesh);
        return mesh;
      },
      loadSmoothTexture(path) {
        const cacheKey = `smooth:${path}`;
        const cached = this.textureCache.get(cacheKey);
        if (cached) return cached;
        const texture = this.textureLoader.load(path);
        texture.magFilter = THREE.LinearFilter;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        if ("colorSpace" in texture && THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;
        if (this.renderer && this.renderer.capabilities && typeof this.renderer.capabilities.getMaxAnisotropy === "function") {
          texture.anisotropy = Math.min(8, this.renderer.capabilities.getMaxAnisotropy() || 1);
        }
        this.textureCache.set(cacheKey, texture);
        return texture;
      },
      resolvePanoramaPath(config) {
        const preferSmall = ("ontouchstart" in window)
          || (navigator && typeof navigator.maxTouchPoints === "number" && navigator.maxTouchPoints > 0);
        const maxTextureSize = this.renderer && this.renderer.capabilities
          ? this.renderer.capabilities.maxTextureSize
          : 4096;
        if (preferSmall && config.pathSmall) return config.pathSmall;
        if (maxTextureSize < 4096 && config.pathSmall) return config.pathSmall;
        if (config.pathLarge) return config.pathLarge;
        return config.pathSmall || config.path || "";
      },
      loadPixelTexture(path) {
        const cached = this.textureCache.get(path);
        if (cached) return cached;
        const texture = this.textureLoader.load(path);
        texture.magFilter = THREE.NearestFilter;
        texture.minFilter = THREE.NearestFilter;
        texture.generateMipmaps = false;
        if ("colorSpace" in texture && THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;
        this.textureCache.set(path, texture);
        return texture;
      },
      getChickenShadowTexture() {
        if (this.shadowTexture) return this.shadowTexture;
        const shadowCanvas = document.createElement("canvas");
        shadowCanvas.width = 96;
        shadowCanvas.height = 48;
        const shadowCtx = shadowCanvas.getContext("2d");
        const gradient = shadowCtx.createRadialGradient(48, 24, 5, 48, 24, 31);
        gradient.addColorStop(0, "rgba(28, 14, 6, 0.54)");
        gradient.addColorStop(0.6, "rgba(28, 14, 6, 0.2)");
        gradient.addColorStop(1, "rgba(28, 14, 6, 0)");
        shadowCtx.fillStyle = gradient;
        shadowCtx.beginPath();
        shadowCtx.ellipse(48, 24, 36, 15, 0, 0, Math.PI * 2);
        shadowCtx.fill();
        this.shadowTexture = new THREE.CanvasTexture(shadowCanvas);
        this.shadowTexture.needsUpdate = true;
        return this.shadowTexture;
      },
      resolveChickenState(obj) {
        if (obj.mood === "happy") return "happy";
        if (obj.mood === "eat") return "peck";
        return "idle";
      },
      resolveChickenFrame(obj) {
        const poseYaw = clamp(obj.faceOffset || 0, -179, 179);
        const absPose = Math.abs(poseYaw);
        const facingRight = poseYaw >= 0;
        const state = this.resolveChickenState(obj);
        const idleKey = absPose < 25
          ? "front"
          : absPose > 142
            ? "back"
            : absPose < 88
              ? (facingRight ? "frontRight" : "frontLeft")
              : (facingRight ? "backRight" : "backLeft");
        const idleFrame = {
          path: ChickenArt.basePath + ChickenArt.idle[idleKey],
          flipX: false,
          spriteScaleX: 1,
          spriteScaleY: 1,
          shadowScaleX: 1,
          shadowScaleY: 1,
          tint: obj.spriteTint || "#ffffff"
        };
        if (state === "idle" || absPose < 22 || absPose > 150) return idleFrame;
        if (state === "happy") {
          return {
            path: ChickenArt.basePath + ChickenArt.happy.side,
            flipX: facingRight,
            spriteScaleX: 1.02,
            spriteScaleY: 1.07,
            shadowScaleX: 0.96,
            shadowScaleY: 0.98,
            tint: obj.spriteTint || "#ffffff"
          };
        }
        const peckKey = Math.sin(performance.now() * 0.006 + (obj.wander || 0) * 0.5) > 0.16 ? "down" : "up";
        return {
          path: ChickenArt.basePath + ChickenArt.peck[peckKey],
          flipX: facingRight,
          spriteScaleX: 1.04,
          spriteScaleY: peckKey === "down" ? 0.96 : 1,
          shadowScaleX: peckKey === "down" ? 1.04 : 0.98,
          shadowScaleY: peckKey === "down" ? 1.02 : 0.96,
          tint: obj.spriteTint || "#ffffff"
        };
      },
      updateChickenBillboard(obj, group) {
        if (!group || !group.userData.sprite) return;
        const frame = this.resolveChickenFrame(obj);
        const sprite = group.userData.sprite;
        const shadow = group.userData.shadow;
        if (group.userData.framePath !== frame.path) {
          sprite.material.map = this.loadPixelTexture(frame.path);
          sprite.material.needsUpdate = true;
          group.userData.framePath = frame.path;
        }
        sprite.material.color.set(frame.tint);
        sprite.scale.set(frame.flipX ? -frame.spriteScaleX : frame.spriteScaleX, frame.spriteScaleY, 1);
        if (shadow) shadow.scale.set(frame.shadowScaleX, frame.shadowScaleY, 1);
        sprite.getWorldPosition(this.scratchWorld);
        sprite.lookAt(this.camera.position.x, this.scratchWorld.y, this.camera.position.z);
      },
      makePanoramaSphere(config) {
        const texturePath = this.resolvePanoramaPath(config);
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(config.radius || 34, 64, 40),
          new THREE.MeshBasicMaterial({
            map: this.loadSmoothTexture(texturePath),
            color: new THREE.Color(config.tint || 0xf5dfbf),
            side: THREE.BackSide,
            fog: false,
            toneMapped: false,
            depthWrite: false
          })
        );
        sphere.position.copy(this.camera.position);
        sphere.rotation.y = config.rotationY || 0;
        sphere.renderOrder = -20;
        sphere.frustumCulled = false;
        return sphere;
      },
      addRingProp(yaw, radius, y, width, height, depth, color) {
        const geo = new THREE.BoxGeometry(width, height, depth);
        const mesh = new THREE.Mesh(geo, this.mat(color));
        const rad = THREE.MathUtils.degToRad(yaw);
        mesh.position.set(Math.sin(rad) * radius, y + height * 0.5, -Math.cos(rad) * radius);
        mesh.lookAt(0, mesh.position.y, 0);
        this.root.add(mesh);
      },
      buildSceneEnvironment(sceneId, forceFallback = false) {
        const panorama = !forceFallback ? ScenePanoramas[sceneId] : null;
        if (panorama) {
          this.panoramaMesh = this.makePanoramaSphere(panorama);
          this.root.add(this.panoramaMesh);
        } else {
          const sky = new THREE.Mesh(
            new THREE.SphereGeometry(38, 24, 16),
            new THREE.MeshBasicMaterial({ color: sceneId === "market" ? 0x6f5c84 : sceneId === "dock" ? 0x8fb9d0 : sceneId === "orchard" ? 0xc4dea1 : 0xf0c578, side: THREE.BackSide })
          );
          this.root.add(sky);
        }

        if (sceneId === "coop") {
          if (!panorama) {
            const floor = new THREE.Mesh(new THREE.CircleGeometry(12.5, 48), this.mat(0x7d5236));
            floor.rotation.x = -Math.PI / 2;
            this.root.add(floor);
            const wall = new THREE.Mesh(new THREE.CylinderGeometry(9.8, 9.8, 4.9, 48, 1, true), this.mat(0xad7b4a));
            wall.position.y = 2.02;
            wall.material.side = THREE.BackSide;
            this.root.add(wall);
            this.addRingProp(4, 8.9, 1.12, 2.8, 1.9, 0.12, 0xffe1a4);
            this.addRingProp(-112, 7.7, 0.18, 1.2, 0.9, 1.2, 0xc49346);
            this.addRingProp(118, 7.8, 0.2, 0.9, 1.1, 0.9, 0x774732);
          }
        } else if (sceneId === "dock") {
          const water = new THREE.Mesh(new THREE.CircleGeometry(18, 56), this.mat(0x4d90af, 0.45, 0.02));
          water.rotation.x = -Math.PI / 2;
          this.root.add(water);
          const deck = new THREE.Mesh(new THREE.RingGeometry(1.9, 7.2, 32), this.mat(0x8b6442));
          deck.rotation.x = -Math.PI / 2;
          deck.position.y = 0.02;
          this.root.add(deck);
        } else if (sceneId === "orchard") {
          const grass = new THREE.Mesh(new THREE.CircleGeometry(18, 48), this.mat(0x7aa858));
          grass.rotation.x = -Math.PI / 2;
          this.root.add(grass);
          this.addRingProp(34, 12.5, 0, 0.9, 3.6, 0.9, 0xd6b07d);
        } else if (sceneId === "market") {
          const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 48), this.mat(0x6c4a43));
          ground.rotation.x = -Math.PI / 2;
          this.root.add(ground);
          const lanternMat = this.mat(0xffdc88, 0.5, 0, 0xffc85b, 0.4);
          [-34, 0, 36].forEach((yaw) => {
            const g = new THREE.Group();
            const rad = THREE.MathUtils.degToRad(yaw);
            g.position.set(Math.sin(rad) * 9.5, 2.8, -Math.cos(rad) * 9.5);
            g.lookAt(0, g.position.y, 0);
            this.addMesh(g, new THREE.CylinderGeometry(0.05, 0.05, 0.6, 6), this.mat(0xbba47c), 0, 0.2, 0);
            this.addMesh(g, new THREE.BoxGeometry(0.34, 0.46, 0.34), lanternMat, 0, -0.25, 0);
            this.root.add(g);
          });
        }
      },
      getObjectRadius(obj) {
        const map = {
          dust: 8.2, hayBits: 5.3, glint: 5.1, cuePulse: 9.4, glimmer: 7.5,
          hopper: 4.9, trough: 4.4, chicken: 4.2, egg: 3.8,
          boat: 12.2, post: 8.4, net: 7.8, spot: 7.1,
          fence: 8.6, beeFx: 5.9, leafFx: 6.6, tree: 7.4, hive: 5.6, crateGood: 4.9, press: 5.1, fruit: 4.1,
          glowOrb: 6.7, flagFx: 8.1, boxCluster: 7.2, board: 5.2, stallGrocer: 6.6, stallFish: 6.6, stallCraft: 5.9
        };

      projectObject(obj) {

        mesh.localToWorld(this.scratchWorld);
        this.scratchCam.copy(this.scratchWorld).applyMatrix4(this.camera.matrixWorldInverse);
        if (this.scratchCam.z > -0.12) return null;
        this.scratchWorld.project(this.camera);
        if (this.scratchWorld.z < -1 || this.scratchWorld.z > 1) return null;
        const x = (this.scratchWorld.x * 0.5 + 0.5) * Config.W;
        const y = (-this.scratchWorld.y * 0.5 + 0.5) * Config.H;
        mesh.getWorldPosition(this.scratchDistance);
        const distance = this.camera.position.distanceTo(this.scratchDistance);
        const scale = clamp(4.6 / distance, 0.34, 1.9);
        return { x, y, scale, dx: x - Config.W / 2, distance };

      update(sceneData, dt) {

        if (this.panoramaMesh) this.panoramaMesh.position.copy(this.camera.position);
        for (const obj of sceneData.objects) {
          const mesh = this.objectMap.get(obj.id);
          if (!mesh) continue;
          this.syncObjectTransform(obj, mesh);
          if (obj.kind === "trough" && mesh.userData.content) {
            mesh.userData.content.material.color.set(obj.filled ? 0xd6b15a : 0x4f2e21);
          }
          if ((obj.kind === "spot" || obj.kind === "glimmer") && mesh.userData.rings) {
            const active = sceneData.data.activeId === obj.id;
            const ringColors = active
              ? [{ color: 0xfff3bb, emissive: 0xffdb7d, intensity: 0.4 }, { color: 0xfff7d1, emissive: 0xffdb7d, intensity: 0.2 }]
              : [{ color: 0xd7eef8, emissive: 0x8cc7de, intensity: 0.18 }, { color: 0xe8f7ff, emissive: 0x8cc7de, intensity: 0.12 }];
            mesh.userData.rings.forEach((ring, index) => {
              ring.material.color.set(ringColors[index].color);
              ring.material.emissive.set(ringColors[index].emissive);
              ring.material.emissiveIntensity = ringColors[index].intensity;
            });
          }
          if (obj.kind === "tree" && mesh.userData.crown) {
            mesh.userData.crown.material.color.set(obj.shaken ? 0x7fbb5d : 0x86c45d);
            if (mesh.userData.treeFruit) mesh.userData.treeFruit.forEach((fruit) => { fruit.visible = !obj.shaken; });
          }
          if (obj.kind === "hive" && mesh.userData.body) {
            mesh.userData.body.material.color.set(obj.taken ? 0x8d6a49 : 0xcfab58);
          }
          if (obj.kind === "chicken") {
            mesh.position.y += Math.sin(obj.bob) * (obj.mood === "happy" ? 0.07 : 0.03);
            this.updateChickenBillboard(obj, mesh);
            if (mesh.userData.shadow) {
              const shadowPulse = obj.mood === "happy" ? 1 - Math.max(0, Math.sin(obj.bob)) * 0.16 : 1 - Math.max(0, Math.sin(obj.bob)) * 0.08;
              mesh.userData.shadow.scale.multiplyScalar(shadowPulse);
            }
          } else if (obj.kind === "fruit") {
            mesh.position.y += Math.sin(obj.bounce || 0) * 0.08;
          } else if (obj.kind === "boat") {
            mesh.position.y += Math.sin(performance.now() * 0.001 + (obj.bob || 0)) * 0.06;
          } else if (obj.kind === "spot" || obj.kind === "glimmer" || obj.kind === "cuePulse") {
            const pulse = 1 + Math.sin(performance.now() * 0.004 + (obj.pulse || 0)) * 0.08;
            mesh.scale.setScalar(pulse);
          } else if (obj.kind === "glint" || obj.kind === "leafFx" || obj.kind === "beeFx" || obj.kind === "glowOrb") {
            mesh.rotation.y += dt * 0.9;
          } else if (obj.kind === "dust") {
            mesh.rotation.y -= dt * 0.3;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function normDeg(v) {
      let n = ((v + 180) % 360 + 360) % 360 - 180;
      return n === -180 ? 180 : n;
    }
    function angleDistance(a, b) { return Math.abs(normDeg(a - b)); }
    function vibrate(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {}
    }
    function safeText(text, x, y, size = 16, color = "#fff7df", align = "center") {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `700 ${size}px system-ui, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }
    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }
    function setToast(text, time = 1.2) {
      State.toast = text;
      State.toastTimer = time;
    }

    function normalizeSave(parsed) {
      const base = defaultSave();
      const save = Object.assign(base, parsed || {});
      save.friendship = Object.assign(base.friendship, parsed && parsed.friendship ? parsed.friendship : {});
      save.inventory = Object.assign(base.inventory, parsed && parsed.inventory ? parsed.inventory : {});
      save.sceneBest = filterSceneStats(parsed && parsed.sceneBest);
      save.sceneClears = filterSceneStats(parsed && parsed.sceneClears);
      save.marketOrders = normalizeOrders(parsed && parsed.marketOrders);
      return save;
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(Config.storageKey);
        State.save = raw ? normalizeSave(JSON.parse(raw)) : normalizeSave(null);
      } catch (_) {
        State.save = normalizeSave(null);
      }
    }
    function saveGame() {
      try { localStorage.setItem(Config.storageKey, JSON.stringify(State.save)); } catch (_) {}
    }

    function randomChoice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }
    function rollWeather() {
      const pool = ["晴", "晴", "多云", "海风", "小雨"];
      return randomChoice(pool);
    }
    function generateOrders() {
      const available = OrderDefs.slice();
      const result = [];
      while (result.length < 3 && available.length) {
        const idx = Math.floor(Math.random() * available.length);
        result.push(Object.assign({ done: false }, available.splice(idx, 1)[0]));
      }
      return result;
    }
    function filterSceneStats(map) {
      const result = {};
      for (const id of SceneOrder) {
        if (map && map[id] != null) result[id] = map[id];
      }
      return result;
    }
    function isSupportedOrder(order) {
      if (!order || typeof order !== "object" || !order.needs) return false;
      return Object.keys(order.needs).every((key) => Object.prototype.hasOwnProperty.call(InventoryLabels, key));
    }
    function normalizeOrders(orders) {
      if (!Array.isArray(orders)) return generateOrders();
      const cleaned = orders.filter(isSupportedOrder).map((order) => Object.assign({ done: false }, order));
      return cleaned.length >= 3 ? cleaned.slice(0, 3) : generateOrders();
    }
    function advanceDay() {
      State.save.day += 1;
      State.save.stamina = Config.staminaMax;
      State.save.weather = rollWeather();
      State.save.marketOrders = generateOrders();
      saveGame();
      setToast(`第 ${State.save.day} 天开始了 · ${State.save.weather}`, 1.8);
    }

    function addInventory(key, amount) {
      State.save.inventory[key] = (State.save.inventory[key] || 0) + amount;
    }
    function hasInventory(need) {
      for (const [key, amount] of Object.entries(need)) {
        if ((State.save.inventory[key] || 0) < amount) return false;
      }
      return true;
    }
    function removeInventory(need) {
      if (!hasInventory(need)) return false;
      for (const [key, amount] of Object.entries(need)) {
        State.save.inventory[key] = Math.max(0, (State.save.inventory[key] || 0) - amount);
      }
      return true;
    }
    function useStamina(amount) {
      if (State.save.stamina < amount) {
        setToast("体力不够啦，先睡一觉吧", 1.4);
        Audio.beep("miss");
        return false;
      }
      State.save.stamina = Math.max(0, State.save.stamina - amount);
      return true;
    }
    function getFriendship(id) {
      return clamp(State.save.friendship[id] || 0, 0, 1000);
    }
    function heartsFromFriendship(value) {
      return clamp(Math.floor(value / 200), 0, 5);
    }
    function getEggQuality() {
      const avg = (getFriendship("chickA") + getFriendship("chickB") + getFriendship("chickC")) / 3;
      return avg >= 300 ? "silverEgg" : "egg";
    }
    function formatNeed(need) {
      return Object.entries(need).map(([key, amount]) => `${InventoryLabels[key]}x${amount}`).join(" + ");
    }

    function depthBandOf(obj) {
      return obj.depthBand || "near";
    }
    function depthParallax(obj) {
      const map = { far: 0.76, mid: 0.9, near: 1, fx: 1.06 };
      return map[depthBandOf(obj)] || 1;
    }
    function depthScaleMul(obj) {
      const map = { far: 0.84, mid: 0.94, near: 1.02, fx: 0.92 };
      return map[depthBandOf(obj)] || 1;
    }
    function getEnterAngle(obj) {
      return obj.enterAngle || obj.angle || Config.input.hoverEnterAngle;
    }
    function getExitAngle(obj) {
      return obj.exitAngle || Math.max(8, getEnterAngle(obj) - 3);
    }
    function getObjectPriority(obj) {
      let score = obj.priority || 0;
      if (depthBandOf(obj) === "near") score += 10;
      if (obj.id === getGuideTargetId()) score += 20;
      return score;
    }
    function getGuideTargetId() {
      const guide = getSceneHint();
      return guide && guide.obj ? guide.obj.id : "";
    }
    function isInteractable(obj) {
      return !!obj && !obj.disabled && obj.interactable !== false && !!obj.action;
    }
    function getLookDistance(obj) {
      const dy = Math.abs(obj.pitch - State.look.pitch);
      return Math.hypot(angleDistance(obj.yaw, State.look.yaw), dy * 1.35);
    }
    function getHoverRadius(obj, projection) {
      const base = {
        hopper: 32,
        trough: 34,
        chicken: 36,
        egg: 30,
        spot: 36,
        tree: 44,
        hive: 32,
        crateGood: 34,
        press: 34,
        board: 38,
        stallGrocer: 44,
        stallFish: 44,
        stallCraft: 42,
        fruit: 30
      };
      const radius = (base[obj.kind] || 32) * (projection ? clamp(projection.scale, 0.72, 1.42) : 1);
      return radius;
    }
    function project(obj) {
      if (World.ready && State.screen === "playing") {
        const projected = World.projectObject(obj);
        if (projected) return projected;
      }
      const dx = normDeg(obj.yaw - State.look.yaw);
      if (Math.abs(dx) > Config.fov / 2 + 22) return null;
      const x = Config.W / 2 + (dx / (Config.fov / 2)) * (Config.W / 2) * depthParallax(obj);
      const y = 330 - (obj.pitch - State.look.pitch) * Config.pitchScale;
      const scale = clamp((1 - Math.abs(dx) / 132) * depthScaleMul(obj), 0.46, 1.18);
      return { x, y, scale, dx, distance: 6 };
    }

    function getSceneObjects() {
      return State.currentScene ? State.currentScene.objects.filter(o => !o.hidden) : [];
    }

    function findHover() {
      if (!State.currentScene) return null;
      const now = performance.now();
      const current = State.hoverId ? getSceneObjects().find(o => o.id === State.hoverId) : null;
      if (current && isInteractable(current)) {
        const currentProj = project(current);
        if (currentProj) {
          const currentScreenDist = Math.hypot(currentProj.x - Config.W / 2, (currentProj.y - Config.H / 2) * 1.08);
          if (currentScreenDist <= getHoverRadius(current, currentProj) * 0.88 && now < State.hoverLockUntil) return current;
        }
      }

      let best = null;
      let bestScore = -Infinity;
      for (const obj of getSceneObjects()) {
        if (!isInteractable(obj)) continue;
        const p = project(obj);
        if (!p) continue;
        const screenDist = Math.hypot(p.x - Config.W / 2, (p.y - Config.H / 2) * 1.08);
        const radius = getHoverRadius(obj, p);
        if (screenDist > radius) continue;
        let score = getObjectPriority(obj) + p.scale * 26 - screenDist;
        if (current && current.id === obj.id) score += 6;
        if (score > bestScore) {
          best = obj;
          bestScore = score;
        }
      }

      if (!best && current && isInteractable(current)) {
        const currentProj = project(current);
        if (currentProj) {
          const currentScreenDist = Math.hypot(currentProj.x - Config.W / 2, (currentProj.y - Config.H / 2) * 1.08);
          if (currentScreenDist <= getHoverRadius(current, currentProj) * 0.8) best = current;
        }
      }

      if (best && best.id !== State.hoverId) {
        State.hoverLockUntil = now + Config.input.hoverLockMs;
      }
      State.hoverId = best ? best.id : null;
      State.edgeHintId = best && best.hintMode === "edgeArrow" ? best.id : null;
      return best;
    }

    function getScreenAngle() {
      const screenObj = window.screen && window.screen.orientation;
      if (screenObj && typeof screenObj.angle === "number") return screenObj.angle;
      if (typeof window.orientation === "number") return window.orientation;
      return 0;
    }

    function calibrate() {
      State.calibration.alpha = State.orientation.has ? State.orientation.alpha : 0;
      State.calibration.beta = State.orientation.has ? State.orientation.beta : 70;
      State.drag.yaw = 0;
      State.drag.pitch = 0;
      State.targetLook.yaw = 0;
      State.targetLook.pitch = 0;
      State.lastTargetLook.yaw = 0;
      State.lastTargetLook.pitch = 0;
      State.look.yaw = 0;
      State.look.pitch = 0;
      State.motion.stationaryFrames = 0;
      State.motion.isStationary = false;
      State.hoverId = null;
      State.hoverLockUntil = 0;
      State.edgeHintId = null;
      setToast("已重新居中", 1);
    }

    function onOrientation(e) {
      State.orientation.alpha = e.alpha || 0;
      State.orientation.beta = e.beta || 0;
      State.orientation.gamma = e.gamma || 0;
      State.orientation.has = true;
      State.screenAngle = getScreenAngle();
      if (State.sensorReady) State.sensorMode = "hybrid";
      if (State.needsCalibration && State.screen === "playing") {
        State.calibration.alpha = State.orientation.alpha;
        State.calibration.beta = State.orientation.beta;
        State.needsCalibration = false;
      }
    }

    function onScreenOrientationChange() {
      State.screenAngle = getScreenAngle();
      if (State.screen === "playing" && State.sensorReady) {
        calibrate();
        setToast("视角已重新对齐", 1.2);
      }
    }

    function getOrientationTargetLook() {
      const angle = Math.abs(State.screenAngle) === 90 ? Math.sign(State.screenAngle || 1) : 0;
      let yaw = State.orientation.alpha - State.calibration.alpha;
      let pitch = (State.orientation.beta - State.calibration.beta) * 0.72;
      if (angle) {
        yaw += State.orientation.gamma * 0.22 * angle;
        pitch = (State.orientation.beta - State.calibration.beta) * 0.58;
      }
      return {
        yaw: normDeg(yaw + State.drag.yaw),
        pitch: clamp(pitch + State.drag.pitch, -32, 32)
      };
    }

    function resolveInputSmoothing(speed) {
      if (speed > Config.input.fastTurnThreshold) return Config.input.fastTurnSmoothing;
      return State.motion.isStationary ? Config.input.idleSmoothing : Config.input.moveSmoothing;
    }

    function resolveDeadzone() {
      return State.motion.isStationary
        ? { yaw: Config.input.idleDeadzoneYaw, pitch: Config.input.idleDeadzonePitch }
        : { yaw: Config.input.moveDeadzoneYaw, pitch: Config.input.moveDeadzonePitch };
    }

    function updateMotionState(nextLook) {
      const yawDelta = angleDistance(nextLook.yaw, State.lastTargetLook.yaw);
      const pitchDelta = Math.abs(nextLook.pitch - State.lastTargetLook.pitch);
      const speed = yawDelta + pitchDelta * 1.15;
      State.motion.lastTurnSpeed = speed;
      if (speed < 0.12) State.motion.stationaryFrames += 1;
      else State.motion.stationaryFrames = 0;
      State.motion.isStationary = State.motion.stationaryFrames >= Config.input.stationaryFrameCount;
      State.lastTargetLook.yaw = nextLook.yaw;
      State.lastTargetLook.pitch = nextLook.pitch;
    }

    function updateLook() {
      let nextLook;
      if ((State.sensorMode === "gyro" || State.sensorMode === "hybrid") && State.orientation.has && !State.desktopSim) {
        nextLook = getOrientationTargetLook();
      } else {
        nextLook = {
          yaw: normDeg(State.drag.yaw),
          pitch: clamp(State.drag.pitch, -32, 32)
        };
      }

      updateMotionState(nextLook);
      State.targetLook.yaw = nextLook.yaw;
      State.targetLook.pitch = nextLook.pitch;

      const deadzone = resolveDeadzone();
      const smoothing = resolveInputSmoothing(State.motion.lastTurnSpeed);
      const yawDelta = normDeg(State.targetLook.yaw - State.look.yaw);
      const pitchDelta = State.targetLook.pitch - State.look.pitch;

      if (Math.abs(yawDelta) > deadzone.yaw) {
        State.look.yaw = normDeg(State.look.yaw + yawDelta * smoothing);
      }
      if (Math.abs(pitchDelta) > deadzone.pitch) {
        State.look.pitch += pitchDelta * smoothing;
      }
      State.look.pitch = clamp(State.look.pitch, -32, 32);
    }

    async function requestMotionAndOpenHub() {
      try {
        Audio.ensure();
        State.permissionAsked = true;
        const DOE = window.DeviceOrientationEvent;
        if (DOE && typeof DOE.requestPermission === "function") {
          const res = await DOE.requestPermission();
          if (res === "granted") {
            State.sensorMode = "hybrid";
            State.sensorReady = true;
            State.desktopSim = false;
            setToast("陀螺仪已就绪，可拖动微调", 1.5);
          } else {
            State.sensorMode = "drag";
            State.desktopSim = false;
            setToast("已切换为拖动视角", 1.6);
          }
        } else if (DOE) {
          State.sensorMode = "hybrid";
          State.sensorReady = true;
          State.desktopSim = false;
          setToast("陀螺仪已就绪，可拖动微调", 1.5);
        } else {
          State.sensorMode = "drag";
          State.desktopSim = true;
        }
      } catch (_) {
        State.sensorMode = "drag";
        State.desktopSim = true;
      }
      State.screen = "hub";
    }

    function enterScene(id) {
      Audio.ensure();
      State.currentScene = createScene(id);
      State.result = null;
      State.screen = "playing";
      State.needsCalibration = State.sensorReady && !State.desktopSim;
      calibrate();
      if (World.ready) World.loadScene(State.currentScene);
      setToast(`${SceneMeta[id].name} · ${SceneMeta[id].core}`, 2.1);
    }

    function leaveScene() {
      if (World.ready) World.unloadScene();
      State.currentScene = null;
      State.screen = "hub";
      State.result = null;
      State.hoverId = null;
      State.press.down = false;
      saveGame();
    }

    function finishScene(success, body, rewardLines) {
      if (!State.currentScene) return;
      const id = State.currentScene.id;
      State.save.sceneClears[id] = (State.save.sceneClears[id] || 0) + (success ? 1 : 0);
      const usedTime = Math.max(0, Math.round(SceneMeta[id].duration - State.currentScene.timer));
      const best = State.save.sceneBest[id];
      if (success && (!best || usedTime < best)) State.save.sceneBest[id] = usedTime;
      saveGame();
      State.result = {
        id,
        title: success ? `${SceneMeta[id].name} 已完成` : `${SceneMeta[id].name} 暂停`,
        body: body || "",
        rewardLines: rewardLines || [],
        best: State.save.sceneBest[id] || 0
      };
      State.screen = "result";
      Audio.beep(success ? "win" : "miss");
    }

    function updateScene(dt) {
      const scene = State.currentScene;
      if (!scene) return;
      scene.timer -= dt;
      if (scene.timer <= 0) {
        scene.timer = 0;
        finishScene(false, "时间到了，这个场景还没完全跑通。", []);
        return;
      }

      if (scene.id === "coop") updateCoopScene(scene, dt);
      if (scene.id === "dock") updateDockScene(scene, dt);
      if (scene.id === "orchard") updateOrchardScene(scene, dt);

      findHover();
    }

    function updateDockScene(scene, dt) {
      const d = scene.data;
      const cueLeft = scene.objects.find(o => o.id === "cueGullLeft");
      const cueRight = scene.objects.find(o => o.id === "cueBubbleRight");
      if (cueLeft) cueLeft.hidden = !(d.phase === "search" && d.activeId === "spot1");
      if (cueRight) cueRight.hidden = !(d.phase === "search" && d.activeId === "spot3");
      if (d.phase === "wait") {
        d.wait -= dt;
        if (d.wait <= 0) {
          d.phase = "bite";
          d.bite = 0.82;
          setToast("鱼漂动了，快点一下", 1);
          Audio.beep("bite");
          vibrate(20);
        }
      } else if (d.phase === "bite") {
        d.bite -= dt;
        if (d.bite <= 0) {
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          setToast("没咬稳，换个方向再试试", 1.2);
        }
      } else if (d.phase === "fight") {
        d.fightTime += dt;
        const fishWave = Math.sin(d.fightTime * 2.8) * 0.28 + Math.sin(d.fightTime * 5.4) * 0.1;
        d.fishY = clamp(0.5 + fishWave, 0.08, 0.92);
        d.boxVel += (State.press.down ? -1 : 1) * dt * 1.2;
        d.boxVel *= 0.9;
        d.boxY = clamp(d.boxY + d.boxVel, 0.06, 0.94);
        const size = 0.18;
        if (Math.abs(d.fishY - d.boxY) < size) d.progress = Math.min(100, d.progress + dt * 34);
        else d.progress = Math.max(0, d.progress - dt * 22);
        if (d.progress >= 100) {
          d.catches += 1;
          addInventory("fish", 1);
          if (Math.random() < 0.5) addInventory("shell", 1);
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          setToast(`起钩成功 ${d.catches}/2`, 1.2);
          Audio.beep("harvest");
          if (d.catches >= 2) {
            finishScene(true, "听声、抛竿、拉扯这条线已经跑通。", ["鲜鱼 +2", "可能掉落贝壳"]);
          }
        } else if (d.progress <= 0) {
          d.phase = "search";
          d.activeId = randomChoice(["spot1", "spot2", "spot3"]);
          d.progress = 28;
          d.boxVel = 0;
          setToast("它挣脱了，再听听水花方向", 1.2);
          Audio.beep("miss");
        }
      }
    }

      function updateCoopScene(scene, dt) {
        const eggRight = scene.objects.find(o => o.id === "egg2");
        const glint = scene.objects.find(o => o.id === "rareGlint");
        if (glint && eggRight) glint.hidden = !!eggRight.collected;
        for (const chick of scene.objects.filter(o => o.kind === "chicken")) {
          chick.bob += dt * 3.2;
          chick.wander += dt;
          chick.yaw = normDeg(chick.baseYaw + Math.sin(chick.wander * 0.68) * (chick.mood === "eat" ? 2.4 : 5));
          const poseBias = chick.mood === "eat" ? 78 : chick.mood === "happy" ? 42 : 0;
          const poseSwing = chick.mood === "eat" ? 10 : chick.mood === "happy" ? 20 : 26;
          chick.faceOffset = clamp((chick.turnBias || 1) * poseBias + Math.sin(chick.wander * 1.1 + (chick.bob || 0) * 0.18) * poseSwing, -160, 160);
          if (chick.mood === "happy" && Math.random() < dt * 0.5) {
            const p = project(chick);
            if (p) burstHearts(p.x, p.y - 36);
          }
        }
    }

    function updateOrchardScene(scene, dt) {
      const tree3 = scene.objects.find(o => o.id === "tree3");
      const glint = scene.objects.find(o => o.id === "dropGlint");
      if (glint && tree3) glint.hidden = !!tree3.shaken;
      for (const fruit of scene.objects.filter(o => o.kind === "fruit")) {
        fruit.bounce = (fruit.bounce || 0) + dt * 5;
      }
    }

    function getSceneHint() {
      const scene = State.currentScene;
      if (!scene) return null;
      if (scene.id === "coop") {
        if (scene.data.holding !== "hay" && scene.objects.some(o => o.kind === "trough" && !o.filled)) return { obj: scene.objects.find(o => o.id === "hopper"), text: "先从料斗拿一束干草" };
        if (scene.data.holding === "hay") return { obj: scene.objects.find(o => o.kind === "trough" && !o.filled), text: "把干草放进空食槽" };
        const unpet = scene.objects.find(o => o.kind === "chicken" && !o.pet);
        if (unpet) return { obj: unpet, text: `找到 ${unpet.label}，摸摸它` };
        return { obj: scene.objects.find(o => o.kind === "egg" && !o.collected), text: "地上还有鸡蛋没捡" };
      }
      if (scene.id === "dock") {
        const active = scene.objects.find(o => o.id === scene.data.activeId);
        if (scene.data.phase === "search") return { obj: active, text: "跟着咕噜声，把视角对准水花抛竿" };
        if (scene.data.phase === "bite") return { obj: active, text: "鱼漂沉了，马上点一下起钩" };
        return { obj: active, text: "按住屏幕让绿色捕获框追住鱼标" };
      }
      if (scene.id === "orchard") {
        const tree = scene.objects.find(o => o.kind === "tree" && !o.shaken);
        if (tree) return { obj: tree, text: "先摇树，把果子打下来" };
        if (!scene.data.holding) return { obj: scene.objects.find(o => o.kind === "fruit" && !o.collected), text: "捡起地上的果子" };
        if (scene.data.holding === "good") return { obj: scene.objects.find(o => o.id === "crate"), text: "把完好果放进果筐" };
        return { obj: scene.objects.find(o => o.id === "press"), text: "把加工果放进压榨桶" };
      }
      if (scene.id === "market") {
        if (scene.data.panel) return null;
        return { obj: scene.objects.find(o => o.id === "board"), text: "先看订单板，或者去摊位快速出售" };
      }
      return null;
    }

    function interactSceneObject(obj) {
      const scene = State.currentScene;
      if (!scene || !obj) {
        setToast("再靠近一点点", 0.9);
        Audio.beep("miss");
        return;
      }

      if (scene.id === "coop") return interactCoop(scene, obj);
      if (scene.id === "dock") return interactDock(scene, obj);
      if (scene.id === "orchard") return interactOrchard(scene, obj);
      if (scene.id === "market") return interactMarket(scene, obj);
    }

    function interactDock(scene, obj) {
      const d = scene.data;
      if (d.phase === "search") {
        if (obj.id !== d.activeId) {
          setToast("水花不太对，换个方向听听", 1);
          Audio.beep("miss");
          return;
        }
        if (!useStamina(3)) return;
        d.phase = "wait";
        d.castId = obj.id;
        d.wait = 1.05;
        setToast("鱼线甩出去啦", 1);
        Audio.beep("place");
      }
    }

    function interactCoop(scene, obj) {
      const d = scene.data;
      if (obj.kind === "hopper") {
        d.holding = "hay";
        setToast("手持干草", 1);
        Audio.beep("pickup");
        return;
      }
      if (obj.kind === "trough") {
        if (!d.holding) {
          setToast("先去料斗拿干草", 1);
          Audio.beep("miss");
          return;
        }
        if (obj.filled) return;
        obj.filled = true;
        d.holding = "";
        d.feedPlaced += 1;
        setToast(`食槽放好啦 ${d.feedPlaced}/3`, 1);
        Audio.beep("place");
        sparkleAtObject(obj, "#fff1a2");
        scene.objects.filter(o => o.kind === "chicken").forEach((chick) => { chick.mood = "eat"; });
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
        return;
      }
      if (obj.kind === "chicken") {
        if (obj.pet) {
          setToast(`${obj.label} 今天已经摸过啦`, 1);
          return;
        }
        obj.pet = true;
        obj.mood = "happy";
        d.petsDone += 1;
        State.save.friendship[obj.id] = clamp((State.save.friendship[obj.id] || 0) + 16, 0, 1000);
        burstHeartsAtObject(obj);
        addFloater("+好感", Config.W * 0.7, 132, "#ff82b0");
        Audio.beep("good");
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
        return;
      }
      if (obj.kind === "egg" && !obj.collected) {
        obj.collected = true;
        obj.hidden = true;
        d.eggsCollected += 1;
        addInventory(obj.quality, 1);
        addFloater(`+1 ${obj.label}`, Config.W * 0.76, 154, obj.quality === "silverEgg" ? "#edf7ff" : "#fff7d6");
        Audio.beep("harvest");
        if (d.feedPlaced >= 3 && d.petsDone >= 3 && d.eggsCollected >= 2) finishCoopScene(scene);
      }
    }

    function finishCoopScene(scene) {
      const silverCount = scene.objects.filter((obj) => obj.kind === "egg" && obj.quality === "silverEgg").length;
      finishScene(true, "照料、陪伴、拾蛋这条治愈回路已经能直接体验。", [silverCount > 0 ? "银星蛋 +2" : "鸡蛋 +2", "三只小鸡好感提升"]);
    }

    function spawnOrchardFruit(scene, baseYaw, goodFirst) {
      const kinds = goodFirst ? ["good", "process"] : ["process", "good"];
      kinds.forEach((type, index) => {
        scene.objects.push({
          id: `fruit-${baseYaw}-${index}-${Math.random().toString(36).slice(2, 5)}`,
          kind: "fruit",
          label: type === "good" ? "完好果" : "加工果",
          action: "捡起",
          yaw: baseYaw + (index === 0 ? -8 : 6),
          pitch: -28,
          angle: 12,
          fruitType: type,
          collected: false,
          bounce: index * 0.9
        });
      });
    }

    function interactOrchard(scene, obj) {
      const d = scene.data;
      if (obj.kind === "tree" && !obj.shaken) {
        if (!useStamina(2)) return;
        obj.shaken = true;
        obj.action = "已收过";
        spawnOrchardFruit(scene, obj.yaw, Math.random() > 0.35);
        setToast("树冠抖了抖，果子掉下来啦", 1.2);
        Audio.beep("good");
        return;
      }
      if (obj.kind === "hive" && !obj.taken) {
        if (!useStamina(1)) return;
        obj.taken = true;
        addInventory("honey", 1);
        d.honey = true;
        setToast("蜂蜜收好啦", 1);
        Audio.beep("harvest");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "fruit" && !obj.collected) {
        d.holding = obj.fruitType;
        obj.collected = true;
        obj.hidden = true;
        setToast(obj.fruitType === "good" ? "拿起完好果" : "拿起加工果", 1);
        Audio.beep("pickup");
        return;
      }
      if (obj.kind === "crateGood" && d.holding === "good") {
        addInventory("berry", 1);
        d.sorted += 1;
        d.holding = "";
        setToast(`完好果入筐 ${d.sorted}/2`, 1);
        Audio.beep("place");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "press" && d.holding === "process") {
        addInventory("jam", 1);
        d.jamDone = 1;
        d.holding = "";
        setToast("压榨完成，得到一罐果酱", 1.2);
        Audio.beep("harvest");
        checkOrchardFinish(scene);
        return;
      }
      if (obj.kind === "crateGood" || obj.kind === "press") {
        setToast(d.holding ? "这个去另一边更合适" : "先捡起果子再处理", 1.1);
        Audio.beep("miss");
      }
    }

    function checkOrchardFinish(scene) {
      const d = scene.data;
      if (d.sorted >= 2 && d.jamDone >= 1 && d.honey) finishScene(true, "摇树、分拣、压榨这一套流程可以直接试玩。", ["鲜果 +2", "果酱 +1", "蜂蜜 +1"]);
    }

    function interactMarket(scene, obj) {
      if (obj.id === "board") {
        scene.data.panel = !scene.data.panel;
        setToast(scene.data.panel ? "订单板打开了" : "订单板收起", 0.8);
        return;
      }
      if (obj.id === "stallGrocer") return marketQuickSell(scene, ["egg", "berry"], "农货卖出");
      if (obj.id === "stallFish") return marketQuickSell(scene, ["fish", "shell"], "海货卖出");
      if (obj.id === "stallCraft") return marketQuickSell(scene, ["silverEgg", "jam", "honey"], "手作卖出");
    }

    function getSellPrice(key) {
      const base = { egg: 50, silverEgg: 85, fish: 70, shell: 24, berry: 28, jam: 115, honey: 92 };
      let price = base[key] || 20;
      if (State.save.weather === "晴" && key === "fish") price += 16;
      if (State.save.weather === "海风" && key === "shell") price += 8;
      return price;
    }

    function marketQuickSell(scene, list, label) {
      const found = list.find((key) => (State.save.inventory[key] || 0) > 0);
      if (!found) {
        setToast("背包里没有对应货物", 1);
        Audio.beep("miss");
        return;
      }
      removeInventory({ [found]: 1 });
      const price = getSellPrice(found);
      State.save.gold += price;
      scene.data.actions += 1;
      scene.data.earned += price;
      addFloater(`+${price}G`, Config.W * 0.74, 126, "#ffe593");
      setToast(`${label}：${InventoryLabels[found]} +${price}G`, 1.2);
      Audio.beep("coin");
      saveGame();
      if (scene.data.actions >= 2) finishScene(true, "订单交付和动态售价都已经挂上了。", [`本次赚到 ${scene.data.earned}G`]);
    }

    function handleSceneOverlayTap(x, y) {
      const scene = State.currentScene;
      if (!scene) return false;

      if (scene.id === "dock") {
        if (scene.data.phase === "bite") {
          scene.data.phase = "fight";
          scene.data.fightTime = 0;
          scene.data.boxY = 0.54;
          scene.data.boxVel = 0;
          scene.data.progress = 26;
          setToast("钩住了，稳住捕获框", 1.1);
          Audio.beep("good");
          return true;
        }
        return false;
      }

      if (scene.id === "market" && scene.data.panel) {
        if (hit(x, y, 38, 158, 284, 230)) {
          for (let i = 0; i < State.save.marketOrders.length; i++) {
            const oy = 194 + i * 58;
            if (hit(x, y, 52, oy - 18, 256, 42)) {
              const order = State.save.marketOrders[i];
              if (order.done) {
                setToast("这个订单今天已经交过了", 1);
                return true;
              }
              if (!hasInventory(order.needs)) {
                setToast(`缺少：${formatNeed(order.needs)}`, 1.2);
                Audio.beep("miss");
                return true;
              }
              removeInventory(order.needs);
              order.done = true;
              State.save.gold += order.gold;
              State.save.rep += order.rep;
              scene.data.actions += 1;
              scene.data.earned += order.gold;
              addFloater(`+${order.gold}G`, 286, 128, "#ffe593");
              setToast(`${order.title} 已交付`, 1.1);
              Audio.beep("coin");
              saveGame();
              if (scene.data.actions >= 2) finishScene(true, "集市的订单交付和即时变现已经具备基础回路。", [`本次赚到 ${scene.data.earned}G`]);
              return true;
            }
          }
        }
        if (hit(x, y, 248, 166, 58, 24)) {
          scene.data.panel = false;
          return true;
        }
        return true;
      }
      return false;
    }

    function burstHearts(x, y) {
      for (let i = 0; i < 10; i++) {
        State.particles.push({
          type: "heart",
          x, y,
          vx: (Math.random() - 0.5) * 55,
          vy: -42 - Math.random() * 44,
          life: 0.86 + Math.random() * 0.34,
          max: 1.16,
          size: 8 + Math.random() * 7,
          color: "#ff6f9c"
        });
      }
    }
    function sparkle(x, y, color = "#fff3aa") {
      for (let i = 0; i < 12; i++) {
        State.particles.push({
          type: "spark",
          x, y,
          vx: (Math.random() - 0.5) * 86,
          vy: (Math.random() - 0.7) * 80,
          life: 0.56,
          max: 0.56,
          size: 3 + Math.random() * 4,
          color
        });
      }
    }
    function addFloater(text, x, y, color) {
      State.floaters.push({ text, x, y, color, life: 1.1, max: 1.1 });
    }
    function sparkleAtObject(obj, color) {
      const p = project(obj);
      if (p) sparkle(p.x, p.y - 8, color);
    }
    function burstHeartsAtObject(obj) {
      const p = project(obj);
      if (p) burstHearts(p.x, p.y - 34);
    }

    function update(dt) {
      updateLook();
      if (State.screen === "playing") updateScene(dt);
      if (World.ready && State.screen === "playing" && State.currentScene) World.update(State.currentScene, dt);

      for (let i = State.particles.length - 1; i >= 0; i--) {
        const p = State.particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 45 * dt;
        if (p.life <= 0) State.particles.splice(i, 1);
      }
      for (let i = State.floaters.length - 1; i >= 0; i--) {
        const f = State.floaters[i];
        f.life -= dt;
        f.y -= 24 * dt;
        if (f.life <= 0) State.floaters.splice(i, 1);
      }
      if (State.toastTimer > 0) State.toastTimer -= dt;
    }

    function drawGradient(top, mid, bottom) {
      const grd = ctx.createLinearGradient(0, 0, 0, Config.H);
      grd.addColorStop(0, top);
      grd.addColorStop(0.42, mid);
      grd.addColorStop(0.43, bottom);
      grd.addColorStop(1, bottom);
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, Config.W, Config.H);
    }

    function drawBackgroundForScene() {
      const id = State.currentScene.id;
      const yaw = State.look.yaw;
      if (id === "coop") {
        drawGradient("#f7d48f", "#f0bf73", "#5a3828");
        ctx.fillStyle = "#70462e";
        ctx.fillRect(0, 386, Config.W, 254);
        drawWindow(180 - normDeg(yaw - 4) * 1.1, 106);
        drawWallProp(-110, "草捆");
        drawWallProp(118, "木桶");
      } else if (id === "dock") {
        drawGradient("#74b5db", "#fee0a9", "#4f6b74");
        ctx.fillStyle = "#4e9fbe";
        ctx.fillRect(0, 374, Config.W, 266);
        for (let i = 0; i < 7; i++) {
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.beginPath();
          ctx.moveTo(0, 392 + i * 30 + Math.sin(i + yaw * 0.03) * 8);
          ctx.lineTo(Config.W, 388 + i * 30 + Math.cos(i + yaw * 0.02) * 8);
          ctx.stroke();
        }
        ctx.fillStyle = "#9b744d";
        ctx.fillRect(0, 520, Config.W, 120);
      } else if (id === "orchard") {
        drawGradient("#b6e4ff", "#e9d48d", "#6a914a");
        ctx.fillStyle = "#8cb764";
        ctx.fillRect(0, 392, Config.W, 248);
        drawWindmill(274 - yaw * 1.1, 132);
      } else if (id === "market") {
        drawGradient("#7a6fa4", "#e4a670", "#4d3256");
        ctx.fillStyle = "#5b3c63";
        ctx.fillRect(0, 398, Config.W, 242);
        drawLantern(84 - yaw * 1.4, 140);
        drawLantern(180 - yaw * 1.1, 114);
        drawLantern(276 - yaw * 1.35, 140);
      }
    }

    function drawWindow(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#7b4a2b";
      roundRect(-46, -34, 92, 68, 8, true);
      ctx.fillStyle = "#ffe2a0";
      roundRect(-34, -24, 68, 48, 4, true);
      ctx.strokeStyle = "#9b6337";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -24); ctx.lineTo(0, 24);
      ctx.moveTo(-34, 0); ctx.lineTo(34, 0);
      ctx.stroke();
      ctx.restore();
    }
    function drawWallProp(yaw, type) {
      const dx = normDeg(yaw - State.look.yaw);
      if (Math.abs(dx) > 90) return;
      const x = Config.W / 2 + dx * 2;
      ctx.save();
      ctx.globalAlpha = 0.46;
      ctx.fillStyle = type === "草捆" ? "#c39142" : "#6f3f27";
      roundRect(x - 26, 292, 52, 44, 10, true);
      ctx.restore();
    }
    function drawWindmill(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#d5b386";
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(34, 72);
      ctx.lineTo(-34, 72);
      ctx.closePath();
      ctx.fill();
      ctx.translate(0, -4);
      ctx.strokeStyle = "#8d6a47";
      ctx.lineWidth = 6;
      const t = performance.now() * 0.002;
      for (let i = 0; i < 4; i++) {
        const a = t + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34);
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawLantern(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "rgba(255,240,210,0.42)";
      ctx.beginPath();
      ctx.moveTo(0, -40);
      ctx.lineTo(0, 0);
      ctx.stroke();
      ctx.fillStyle = "#ffdd8a";
      roundRect(-12, 0, 24, 28, 8, true);
      ctx.restore();
    }
    function drawSceneObjects() {
      const ordered = getSceneObjects().map((o) => ({ o, p: project(o) })).filter((entry) => entry.p);
      ordered.sort((a, b) => {
        const depthDiff = (Config.depthWeight[depthBandOf(a.o)] || 0) - (Config.depthWeight[depthBandOf(b.o)] || 0);
        if (depthDiff !== 0) return depthDiff;
        return a.p.y - b.p.y;
      });
      for (const entry of ordered) {
        const hover = State.hoverId === entry.o.id;
        ctx.save();
        ctx.translate(entry.p.x, entry.p.y);
        ctx.scale(entry.p.scale, entry.p.scale);
        if (hover) drawGlow(entry.o);
        drawObject(entry.o);
        if (hover && isInteractable(entry.o) && State.currentScene.id !== "market") drawObjectLabel(entry.o);
        ctx.restore();
      }
    }

    function drawGlow(obj) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(performance.now() * 0.008) * 0.14;
      ctx.fillStyle = "#fff2a6";
      const r = obj.kind === "tree" ? 40 : obj.kind === "chicken" ? 34 : obj.kind === "board" ? 32 : 26;
      ctx.beginPath();
      ctx.ellipse(0, 4, r, r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawObject(obj) {
      switch (obj.kind) {
        case "dust": return drawDust(obj);
        case "hayBits": return drawHayBits(obj);
        case "glint": return drawGlint(obj);
        case "cuePulse": return drawCuePulse(obj);
        case "boat": return drawBoat(obj);
        case "post": return drawPost(obj);
        case "net": return drawNet(obj);
        case "fence": return drawFence(obj);
        case "beeFx": return drawBeeFx(obj);
        case "leafFx": return drawLeafFx(obj);
        case "glowOrb": return drawGlowOrb(obj);
        case "flagFx": return drawFlagFx(obj);
        case "boxCluster": return drawBoxCluster(obj);
        case "glimmer": return drawGlimmer(obj);
        case "spot": return drawFishSpot(obj);
        case "hopper": return drawHopper();
        case "trough": return drawTrough(obj);
        case "chicken": return drawChicken(obj);
        case "egg": return drawEgg(obj);
        case "tree": return drawTree(obj);
        case "hive": return drawHive(obj);
        case "crateGood": return drawCrate(obj, "#d39e59", "好果");
        case "press": return drawPress(obj);
        case "fruit": return drawFruit(obj);
        case "board": return drawBoard();
        case "stallGrocer": return drawStall("#9cc666", "菜");
        case "stallFish": return drawStall("#6cbad7", "鱼");
        case "stallCraft": return drawStall("#c9a8f7", "作");
      }
    }

    function drawFishSpot(obj) {
      ctx.strokeStyle = obj.id === State.currentScene.data.activeId ? "#fff4bf" : "rgba(255,255,255,0.42)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(0, i * 3, 22 - i * 5, 7 - i, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    function drawDust(obj) {
      const t = performance.now() * 0.001 + (obj.sparkle || 0);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(255,244,220,${0.18 + Math.sin(t + i) * 0.08})`;
        ctx.beginPath();
        ctx.arc(Math.sin(t * 1.2 + i * 0.7) * 18, Math.cos(t * 0.9 + i) * 10, 2 + (i % 2), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function drawHayBits(obj) {
      const t = performance.now() * 0.001 + (obj.sparkle || 0);
      ctx.strokeStyle = "rgba(222,185,94,0.7)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const x = -20 + i * 9;
        ctx.beginPath();
        ctx.moveTo(x, -4 + Math.sin(t + i) * 2);
        ctx.lineTo(x + 8, -12 + Math.cos(t + i * 0.6) * 2);

    function drawObjectiveGuide() {
      const guide = getSceneHint();
      if (!guide || !guide.obj) return;
      if (State.hoverId === guide.obj.id) return;
      const obj = guide.obj;
      const delta = normDeg(obj.yaw - State.look.yaw);
      const yDelta = obj.pitch - State.look.pitch;
      const offscreen = Math.abs(delta) > Config.fov / 2 - 8;
      ctx.save();
      ctx.fillStyle = "rgba(64,39,27,0.7)";
      roundRect(34, 116, 292, 30, 11, true);
      safeText(guide.text, 180, 131, 12, "#fff1c2");
      if (offscreen) {
        drawDirectionalArrow(delta < 0, 320, true);
      } else if (Math.abs(yDelta) > 8) {
        const x = Config.W / 2 + (delta / (Config.fov / 2)) * (Config.W / 2);
        const y = yDelta > 0 ? 168 : 486;
        ctx.fillStyle = "rgba(255,232,159,0.92)";
        ctx.beginPath();
        if (yDelta > 0) {
          ctx.moveTo(x, y - 13);
          ctx.lineTo(x - 13, y + 10);
          ctx.lineTo(x + 13, y + 10);
        } else {
          ctx.moveTo(x, y + 13);
          ctx.lineTo(x - 13, y - 10);
          ctx.lineTo(x + 13, y - 10);
        }
        ctx.closePath();
        ctx.fill();
      }
      drawPeripheralCueHints(guide.obj.id);
      ctx.restore();
    }

    function drawDirectionalArrow(left, y, strong = false) {
      const x = left ? 28 : 332;
      ctx.fillStyle = strong ? "rgba(255,232,159,0.92)" : "rgba(255,232,159,0.56)";
      ctx.beginPath();
      if (left) {
        ctx.moveTo(x - 12, y);
        ctx.lineTo(x + 10, y - 16);
        ctx.lineTo(x + 10, y + 16);
      } else {
        ctx.moveTo(x + 12, y);
        ctx.lineTo(x - 10, y - 16);
        ctx.lineTo(x - 10, y + 16);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawPeripheralCueHints(guideId) {
      const sceneObjects = getSceneObjects().filter((obj) => obj.hintMode === "edgeArrow" && obj.id !== guideId && obj.id !== State.hoverId);
      for (const obj of sceneObjects) {
        const delta = normDeg(obj.yaw - State.look.yaw);
        const abs = Math.abs(delta);
        if (abs <= Config.fov / 2 - 6 || abs > 118) continue;
        drawDirectionalArrow(delta < 0, 360 + Math.sin(performance.now() * 0.008 + abs) * 5, false);
      }
    }

      ctx.fillStyle = "rgba(29, 23, 20, 0.52)";
      ctx.fillRect(0, 0, Config.W, Config.H);
      safeText("穗潮湾", 180, 122, 36, "#fff2cb");
      safeText("Tidegrain Bay", 180, 150, 14, "#ffe0a6");
      safeText(Config.version, 180, 173, 12, "#ffdd98");
      safeText("四个核心场景的离线 Canvas 原型集", 180, 208, 14, "#ffeac1");
      safeText("支持手机陀螺仪，也支持电脑端拖动测试", 180, 230, 13, "#ffeac1");
      drawButton("进入穗潮湾", 86, 290, 188, 48, true);
      drawButton("电脑测试", 104, 350, 152, 40);
      safeText("定点观察 + 微操作 + 场景切换 + 资源回流", 180, 446, 12, "#ffe6b0");
      safeText("纯离线运行，无外部资源，无网络请求", 180, 470, 12, "#d9c089");
    }

    function getHubCardLayout() {
      return { cols: 2, startX: 20, startY: 118, cardW: 152, cardH: 104, gapX: 16, gapY: 18 };
    }

    function drawHub() {
      drawGradient("#7db6cf", "#e8cf91", "#5d4a3f");
      ctx.fillStyle = "rgba(24, 19, 17, 0.4)";
      ctx.fillRect(0, 0, Config.W, Config.H);
      ctx.fillStyle = "rgba(46, 34, 28, 0.72)";
      roundRect(12, 12, 336, 90, 14, true);
      safeText("穗潮湾场景选择", 28, 30, 15, "#fff4d6", "left");
      safeText(`第 ${State.save.day} 天 · ${State.save.weather}`, 28, 54, 13, "#ffe5b1", "left");
      safeText(`金币 ${State.save.gold}G`, 280, 30, 14, "#fff4d6");
      safeText(`体力 ${State.save.stamina}/${Config.staminaMax}`, 280, 54, 12, "#ffe5b1");
      safeText(`声望 ${State.save.rep}`, 280, 74, 12, "#ffe5b1");

      const layout = getHubCardLayout();
      SceneOrder.forEach((id, index) => {
        const col = index % layout.cols;
        const row = Math.floor(index / layout.cols);
        const x = layout.startX + col * (layout.cardW + layout.gapX);
        const y = layout.startY + row * (layout.cardH + layout.gapY);
        const meta = SceneMeta[id];
        const clears = State.save.sceneClears[id] || 0;
        ctx.fillStyle = "rgba(41, 30, 24, 0.75)";
        roundRect(x, y, layout.cardW, layout.cardH, 14, true);
        ctx.fillStyle = meta.color;
        roundRect(x + 8, y + 8, layout.cardW - 16, 26, 9, true);
        safeText(meta.name, x + layout.cardW / 2, y + 21, 12, "#3f2b1c");
        safeText(meta.en, x + layout.cardW / 2, y + 44, 10, "#ffe0ab");
        safeText(meta.core, x + layout.cardW / 2, y + 62, 10, "#fff2d0");
        safeText(clears ? `已完成 ${clears}` : "未试玩", x + layout.cardW / 2, y + 81, 11, clears ? "#b5f0a4" : "#e5c191");
        safeText(State.save.sceneBest[id] ? `最佳 ${State.save.sceneBest[id]}s` : "--", x + layout.cardW / 2, y + 96, 10, "#d8be91");
      });

      ctx.fillStyle = "rgba(41, 30, 24, 0.74)";
      roundRect(12, 456, 336, 90, 14, true);
      safeText("背包概览", 28, 474, 14, "#fff4d6", "left");
      safeText(formatInventorySummary(), 28, 500, 11, "#ffe5b1", "left");
      safeText(formatInventorySummary2(), 28, 524, 11, "#ffe5b1", "left");

      drawButton("睡到明天", 34, 570, 104, 40, true);
      drawButton("返回首页", 148, 570, 92, 40);
      drawButton(State.desktopSim ? "电脑测试中" : State.sensorMode === "hybrid" ? "陀螺仪已开" : "拖动模式", 250, 570, 94, 40);
    }

    function formatInventorySummary() {
      const inv = State.save.inventory;
      return `鸡蛋 ${inv.egg} · 银星蛋 ${inv.silverEgg} · 鲜鱼 ${inv.fish} · 贝壳 ${inv.shell}`;
    }
    function formatInventorySummary2() {
      const inv = State.save.inventory;
      return `鲜果 ${inv.berry} · 果酱 ${inv.jam} · 蜂蜜 ${inv.honey}`;
    }

    function drawResult() {
      drawGradient("#7db6cf", "#f1d6a1", "#4c3b31");
      ctx.fillStyle = "rgba(28, 22, 19, 0.52)";
      ctx.fillRect(0, 0, Config.W, Config.H);
      ctx.fillStyle = "rgba(255, 243, 215, 0.96)";
      roundRect(28, 112, 304, 380, 18, true);
      safeText(State.result.title, 180, 156, 24, "#5d4330");
      safeText(State.result.body || "", 180, 196, 13, "#7a5a3d");
      safeText(`最佳 ${State.result.best ? `${State.result.best}s` : "--"}`, 180, 224, 12, "#a0794a");
      const lines = State.result.rewardLines || [];
      safeText(lines.length ? "产出 / 变化" : "本次没有新增产出", 180, 260, 14, "#7a5a3d");
      lines.forEach((line, index) => {
        safeText(line, 180, 290 + index * 26, 13, "#5d4330");
      });
      safeText(`金币 ${State.save.gold}G · 体力 ${State.save.stamina} · 声望 ${State.save.rep}`, 180, 396, 12, "#7a5a3d");
      drawButton("重试场景", 86, 446, 188, 46, true);
      drawButton("回到穗潮湾", 94, 510, 172, 40);
    }

    function drawButton(text, x, y, w, h, primary = false) {
      ctx.fillStyle = primary ? "#f0b45e" : "rgba(255, 235, 190, 0.18)";
      ctx.strokeStyle = primary ? "#ffe4a7" : "rgba(255, 235, 190, 0.46)";
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 12, true, true);
      safeText(text, x + w / 2, y + h / 2, primary ? 17 : 13, primary ? "#533420" : "#fff2ca");
    }

    function drawError(msg) {
      ctx.fillStyle = "#2f211b";
      ctx.fillRect(0, 0, Config.W, Config.H);
      safeText(msg || Config.errorText, 180, 310, 16, "#fff5d2");
    }

    function render() {
      ctx.clearRect(0, 0, Config.W, Config.H);
      World.render(State.screen === "playing");
      if (State.screen === "menu") drawMenu();
      else if (State.screen === "hub") drawHub();
      else if (State.screen === "playing") {
        if (!World.ready) {
          drawBackgroundForScene();
          drawSceneObjects();
        }
        drawParticles();
        drawHud();
        drawSceneOverlay();
        drawToast();
      } else if (State.screen === "result") drawResult();
      else drawError();
    }

    function getPoint(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * Config.W / r.width,
        y: (t.clientY - r.top) * Config.H / r.height
      };
    }
    function hit(x, y, bx, by, bw, bh) {
      return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
    }
    function isPlayingControl(x, y) {
      return hit(x, y, 16, 584, 64, 34) || hit(x, y, 90, 584, 64, 34) || hit(x, y, 202, 584, 142, 34) || (State.currentScene && State.currentScene.id === "market" && State.currentScene.data.panel);
    }

    function pointerDown(e) {
      e.preventDefault();
      Audio.ensure();
      const p = getPoint(e);
      State.press.down = true;
      if (State.screen === "playing" && State.currentScene && State.currentScene.id === "dock" && State.currentScene.data.phase === "fight") return;
      State.drag.active = true;
      State.drag.moved = false;
      State.drag.canPan = State.screen === "playing" && !isPlayingControl(p.x, p.y);
      State.drag.x = p.x;
      State.drag.y = p.y;
    }

    function pointerMove(e) {
      if (!State.drag.active) return;
      e.preventDefault();
      const p = getPoint(e);
      const dx = p.x - State.drag.x;
      const dy = p.y - State.drag.y;
      if (Math.hypot(dx, dy) > Config.input.dragThresholdPx) State.drag.moved = true;
      State.drag.x = p.x;
      State.drag.y = p.y;
      if (State.drag.canPan) {
        State.drag.yaw = normDeg(State.drag.yaw - dx * Config.input.dragYawScale);
        State.drag.pitch = clamp(State.drag.pitch + dy * Config.input.dragPitchScale, -32, 32);
      }
    }

    function pointerUp(e) {
      e.preventDefault();
      const p = getPoint(e.changedTouches ? e.changedTouches[0] : e);
      const wasDrag = State.drag.moved;
      const canPan = State.drag.canPan;
      State.press.down = false;
      if (State.screen === "playing" && State.currentScene && State.currentScene.id === "dock" && State.currentScene.data.phase === "fight") {
        State.drag.active = false;
        State.drag.moved = false;
        State.drag.canPan = false;
        return;
      }
      State.drag.active = false;
      State.drag.moved = false;
      State.drag.canPan = false;
      if (wasDrag && canPan) return;
      handleTap(p.x, p.y);
    }

    function handleTap(x, y) {
      if (State.screen === "menu") {
        if (hit(x, y, 86, 290, 188, 48)) requestMotionAndOpenHub();
        else if (hit(x, y, 104, 350, 152, 40)) openHubDesktop();
        return;
      }

      if (State.screen === "hub") {
        if (hit(x, y, 34, 570, 104, 40)) {
          advanceDay();
          saveGame();
          return;
        }
        if (hit(x, y, 148, 570, 92, 40)) {
          State.screen = "menu";
          return;
        }
        const layout = getHubCardLayout();
        for (let i = 0; i < SceneOrder.length; i++) {
          const col = i % layout.cols;
          const row = Math.floor(i / layout.cols);
          const bx = layout.startX + col * (layout.cardW + layout.gapX);
          const by = layout.startY + row * (layout.cardH + layout.gapY);
          if (hit(x, y, bx, by, layout.cardW, layout.cardH)) {
            enterScene(SceneOrder[i]);
            return;
          }
        }
        return;
      }

      if (State.screen === "playing") {
        if (hit(x, y, 16, 584, 64, 34)) {
          leaveScene();
          return;
        }
        if (hit(x, y, 90, 584, 64, 34)) {
          calibrate();
          return;
        }
        if (handleSceneOverlayTap(x, y)) return;
        interactSceneObject(findHover());
        return;
      }

      if (State.screen === "result") {
        if (hit(x, y, 86, 446, 188, 46) && State.result) {
          enterScene(State.result.id);
          return;
        }
        if (hit(x, y, 94, 510, 172, 40)) {
          if (World.ready) World.unloadScene();
          State.currentScene = null;
          State.result = null;
          State.screen = "hub";
        }
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, (ts - (State.lastTime || ts)) / 1000);
        State.lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    function init() {
      try {
        loadSave();
        State.screenAngle = getScreenAngle();
        try {
          World.init();
        } catch (err) {
          console.warn("3D world init failed, fallback to canvas scene.", err);
        }
        window.addEventListener("deviceorientation", onOrientation, true);
        if (window.screen && window.screen.orientation && typeof window.screen.orientation.addEventListener === "function") {
          window.screen.orientation.addEventListener("change", onScreenOrientationChange);
        } else {
          window.addEventListener("orientationchange", onScreenOrientationChange, true);
        }
        canvas.addEventListener("pointerdown", pointerDown, { passive: false });
        canvas.addEventListener("pointermove", pointerMove, { passive: false });
        canvas.addEventListener("pointerup", pointerUp, { passive: false });
        canvas.addEventListener("pointercancel", pointerUp, { passive: false });
        document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        drawError(Config.errorText);
      }
    }

    init();
  })();
  </script>
</body>
</html>
